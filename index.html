<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#064E3B">
<title>منصة إتقان</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  /* Emerald (Primary) */
  --emerald-950:#022C22;
  --emerald-900:#064E3B;
  --emerald-800:#065F46;
  --emerald-700:#047857;
  --emerald-600:#059669;
  --emerald-500:#10B981;
  --emerald-100:#D1FAE5;
  --emerald-50:#ECFDF5;
  /* Gold (Accent) */
  --gold-600:#D97706;
  --gold-500:#F59E0B;
  --gold-400:#FBBF24;
  --gold-100:#FEF3C7;
  --gold-50:#FFFBEB;
  /* Status */
  --red-600:#DC2626;
  --red-50:#FEF2F2;
  --red-100:#FEE2E2;
  --blue-600:#2563EB;
  --blue-50:#EFF6FF;
  --blue-100:#DBEAFE;
  /* Grays */
  --g-50:#F9FAFB;
  --g-100:#F3F4F6;
  --g-200:#E5E7EB;
  --g-300:#D1D5DB;
  --g-400:#9CA3AF;
  --g-500:#6B7280;
  --g-600:#4B5563;
  --g-700:#374151;
  --g-900:#111827;
  /* Semantic */
  --bg:var(--g-50);
  --surface:#FFFFFF;
  --border:var(--g-200);
  --text:var(--g-900);
  --text-2:var(--g-600);
  --text-3:var(--g-400);
  --brand:var(--emerald-600);
  --brand-dark:var(--emerald-700);
  --brand-soft:var(--emerald-50);
  --accent:var(--gold-600);
  --accent-soft:var(--gold-50);
  /* Radius */
  --r:8px;
  --r-lg:12px;
  --r-xl:16px;
  /* Shadows */
  --sh-xs:0 1px 2px rgba(15,23,42,.04);
  --sh-sm:0 1px 3px rgba(15,23,42,.06);
  --sh:0 4px 6px rgba(15,23,42,.05);
  --sh-lg:0 10px 15px rgba(15,23,42,.06);
  --sh-xl:0 20px 25px rgba(15,23,42,.08);
  /* Font */
  --font:'Cairo',-apple-system,system-ui,sans-serif;
  /* Motion */
  --t:200ms cubic-bezier(.4,0,.2,1);
  /* Safe area */
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}

[data-theme="dark"]{
  --bg:#0A1929;
  --surface:#132F2A;
  --border:#1F4038;
  --text:#F0FDF4;
  --text-2:#86EFAC;
  --text-3:#4ADE80;
  --g-50:#0A1929;
  --g-100:#132F2A;
  --g-200:#1F4038;
  --g-300:#2E584D;
  --g-900:#F0FDF4;
  --brand:var(--emerald-500);
  --brand-dark:var(--emerald-600);
  --brand-soft:rgba(16,185,129,.12);
  --accent:var(--gold-500);
  --accent-soft:rgba(245,158,11,.12);
}

*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16px;-webkit-text-size-adjust:100%;text-rendering:optimizeLegibility}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;min-height:100dvh;line-height:1.6;overflow-x:hidden;transition:background var(--t),color var(--t)}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer;background:none;border:none}
input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
img{max-width:100%;display:block}
::selection{background:var(--brand-soft);color:var(--brand-dark)}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--g-300);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:var(--g-400)}

/* ═══ Splash ═══ */
#splash{position:fixed;inset:0;background:linear-gradient(135deg,#022C22 0%,#064E3B 50%,#065F46 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:99999;transition:opacity 400ms,visibility 400ms}
#splash.hide{opacity:0;visibility:hidden;pointer-events:none}
.splash-logo{width:96px;height:96px;background:rgba(255,255,255,.15);border:2px solid rgba(255,255,255,.3);border-radius:28px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:42px;margin-bottom:20px;backdrop-filter:blur(20px);animation:splashIn 600ms cubic-bezier(.34,1.56,.64,1);box-shadow:0 20px 60px rgba(0,0,0,.3)}
@keyframes splashIn{from{opacity:0;transform:scale(.5) rotate(-15deg)}to{opacity:1;transform:scale(1) rotate(0)}}
.splash-title{color:#fff;font-size:32px;font-weight:800;letter-spacing:-.5px;margin-bottom:6px;animation:fadeUp 500ms 200ms backwards}
.splash-sub{color:rgba(255,255,255,.7);font-size:15px;font-weight:500;animation:fadeUp 500ms 300ms backwards}
.splash-load{margin-top:32px;width:200px;height:4px;background:rgba(255,255,255,.15);border-radius:2px;overflow:hidden;animation:fadeUp 500ms 400ms backwards}
.splash-bar{height:100%;background:linear-gradient(90deg,var(--gold-400),var(--gold-500));border-radius:2px;width:0;animation:load 1200ms cubic-bezier(.4,0,.2,1) forwards}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes load{0%{width:0}100%{width:100%}}

/* ═══ Buttons ═══ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 20px;border-radius:var(--r);font-size:14px;font-weight:700;background:var(--brand);color:#fff;transition:all var(--t);white-space:nowrap;border:none;cursor:pointer}
.btn:hover{background:var(--brand-dark);transform:translateY(-1px);box-shadow:var(--sh)}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none!important}
.btn-block{width:100%}
.btn-lg{padding:13px 28px;font-size:15px}
.btn-sm{padding:7px 14px;font-size:13px;border-radius:6px}
.btn-secondary{background:var(--surface);color:var(--text);border:1px solid var(--border)}
.btn-secondary:hover{background:var(--g-100);border-color:var(--g-300);transform:translateY(-1px)}
.btn-danger{background:var(--red-600)}
.btn-danger:hover{background:#B91C1C}
.btn-gold{background:linear-gradient(135deg,var(--gold-600),var(--gold-500));color:#fff}
.btn-gold:hover{background:linear-gradient(135deg,#B45309,#D97706)}
.btn-icon{width:40px;height:40px;padding:0;border-radius:var(--r);background:transparent;color:var(--text-2);display:inline-flex;align-items:center;justify-content:center;font-size:18px;transition:all var(--t)}
.btn-icon:hover{background:var(--g-100);color:var(--text)}
.btn-google{background:var(--surface);color:var(--text);border:1px solid var(--border)}
.btn-google:hover{background:var(--g-100)}

/* ═══ Inputs ═══ */
.input,.textarea{width:100%;padding:11px 14px;border-radius:var(--r);font-size:14px;background:var(--surface);border:1.5px solid var(--border);color:var(--text);transition:all var(--t);font-family:inherit}
.input:focus,.textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.input::placeholder,.textarea::placeholder{color:var(--text-3)}
.textarea{resize:vertical;min-height:100px;line-height:1.7}
.field{display:flex;flex-direction:column;gap:8px;margin-bottom:18px}
.field label{font-size:13px;font-weight:700;color:var(--text)}
.field-hint{font-size:12px;color:var(--text-3);font-weight:500}
.password-wrapper{position:relative}
.password-toggle{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:32px;height:32px;display:flex;align-items:center;justify-content:center;color:var(--text-3);border-radius:var(--r);font-size:16px}
.password-toggle:hover{background:var(--g-100);color:var(--text)}

/* ═══ Card ═══ */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:20px}
.card-hover:hover{border-color:var(--brand);box-shadow:var(--sh);transform:translateY(-2px);transition:all var(--t)}

/* ═══ Badge ═══ */
.badge{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:700;background:var(--g-100);color:var(--text-2)}
.badge-brand{background:var(--brand-soft);color:var(--brand-dark)}
.badge-gold{background:var(--gold-50);color:var(--gold-600)}
.badge-danger{background:var(--red-50);color:var(--red-600)}

/* ═══ Avatar ═══ */
.avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--brand),var(--brand-dark));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex-shrink:0;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}

/* ═══ Modal ═══ */
#modal-root{position:fixed;inset:0;pointer-events:none;z-index:9000}
.modal{position:fixed;inset:0;background:rgba(6,78,59,.5);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:16px;pointer-events:auto;animation:fadeIn 200ms}
@keyframes fadeIn{from{opacity:0}}
.modal-content{background:var(--surface);border-radius:var(--r-xl);padding:24px;max-width:480px;width:100%;max-height:88vh;overflow-y:auto;box-shadow:var(--sh-xl);animation:slideIn 280ms cubic-bezier(.34,1.56,.64,1)}
@keyframes slideIn{from{opacity:0;transform:scale(.92) translateY(20px)}to{opacity:1;transform:scale(1) translateY(0)}}
.modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;gap:12px}
.modal-title{font-size:18px;font-weight:800;flex:1}
.modal-close{width:32px;height:32px;border-radius:var(--r);color:var(--text-3);display:flex;align-items:center;justify-content:center;font-size:18px}
.modal-close:hover{background:var(--g-100);color:var(--text)}

/* ═══ Toast ═══ */
#toast-root{position:fixed;bottom:calc(24px + var(--safe-bottom));left:50%;transform:translateX(-50%);z-index:99999;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;max-width:calc(100% - 32px)}
.toast{padding:12px 20px;border-radius:var(--r);background:var(--g-900);color:#fff;font-size:13px;font-weight:700;box-shadow:var(--sh-lg);opacity:0;transform:translateY(12px);transition:all 300ms;pointer-events:auto;text-align:center;max-width:100%}
.toast.show{opacity:1;transform:translateY(0)}
.toast.success{background:linear-gradient(135deg,var(--emerald-600),var(--emerald-500))}
.toast.error{background:linear-gradient(135deg,var(--red-600),#EF4444)}
.toast.warning{background:linear-gradient(135deg,var(--gold-600),var(--gold-500))}
.toast.info{background:linear-gradient(135deg,var(--blue-600),#3B82F6)}

/* ═══ Spinner ═══ */
.spinner{width:16px;height:16px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:spin 700ms linear infinite;display:inline-block;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}

.hidden{display:none!important}

/* ═══ Auth Screen ═══ */
.auth-screen{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#022C22 0%,#064E3B 50%,#065F46 100%);position:relative;overflow:hidden}
.auth-screen::before{content:'';position:absolute;top:-100px;right:-100px;width:400px;height:400px;background:radial-gradient(circle,rgba(245,158,11,.15),transparent 70%);border-radius:50%;pointer-events:none}
.auth-screen::after{content:'';position:absolute;bottom:-150px;left:-100px;width:500px;height:500px;background:radial-gradient(circle,rgba(16,185,129,.2),transparent 70%);border-radius:50%;pointer-events:none}
.auth-container{width:100%;max-width:440px;position:relative;z-index:1}
.auth-header{text-align:center;margin-bottom:28px}
.auth-logo{width:80px;height:80px;background:linear-gradient(135deg,var(--gold-500),var(--gold-600));border-radius:22px;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:36px;margin-bottom:16px;box-shadow:0 20px 50px rgba(245,158,11,.4)}
.auth-title{font-size:28px;font-weight:900;color:#fff;margin-bottom:6px;letter-spacing:-.5px}
.auth-subtitle{font-size:14px;color:rgba(255,255,255,.8);font-weight:600}
.auth-card{background:var(--surface);border-radius:var(--r-xl);padding:28px;box-shadow:0 24px 60px rgba(0,0,0,.3)}
.auth-tabs{display:flex;background:var(--g-100);padding:5px;border-radius:10px;margin-bottom:22px;gap:4px}
.auth-tab{flex:1;padding:10px;border-radius:8px;font-size:14px;font-weight:700;color:var(--text-2);transition:all var(--t)}
.auth-tab.active{background:var(--surface);color:var(--brand);box-shadow:var(--sh-sm)}
.auth-form{display:none}
.auth-form.active{display:block;animation:fadeIn 250ms}
.auth-divider{text-align:center;margin:18px 0;position:relative}
.auth-divider::before,.auth-divider::after{content:'';position:absolute;top:50%;width:42%;height:1px;background:var(--border)}
.auth-divider::before{right:0}
.auth-divider::after{left:0}
.auth-divider span{background:var(--surface);padding:0 14px;color:var(--text-3);font-size:12px;font-weight:600;position:relative;z-index:1}
.auth-footer{text-align:center;margin-top:22px;font-size:12px;color:rgba(255,255,255,.6);font-weight:500}

/* ═══ App Layout ═══ */
.app-layout{display:flex;min-height:100vh;min-height:100dvh}
.app-sidebar{display:none;position:fixed;top:0;right:0;bottom:0;width:260px;background:var(--surface);border-left:1px solid var(--border);padding:22px 14px;flex-direction:column;z-index:100}
.sidebar-brand{display:flex;align-items:center;gap:12px;padding:0 10px 22px;border-bottom:1px solid var(--border);margin-bottom:18px}
.sidebar-logo{width:44px;height:44px;background:linear-gradient(135deg,var(--gold-500),var(--gold-600));border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:18px;flex-shrink:0}
.sidebar-name{font-size:16px;font-weight:900;color:var(--text)}
.sidebar-sub{font-size:11px;color:var(--text-3);font-weight:600}
.sidebar-nav{display:flex;flex-direction:column;gap:3px;flex:1;overflow-y:auto}
.sidebar-item{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:10px;font-size:14px;font-weight:700;color:var(--text-2);transition:all var(--t);text-align:right;width:100%}
.sidebar-item:hover{background:var(--g-100);color:var(--text)}
.sidebar-item.active{background:linear-gradient(135deg,var(--brand),var(--brand-dark));color:#fff;box-shadow:var(--sh-sm)}
.sidebar-item-icon{font-size:18px;flex-shrink:0}
.sidebar-footer{padding-top:18px;border-top:1px solid var(--border);margin-top:12px}
.sidebar-user{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px;cursor:pointer;transition:background var(--t)}
.sidebar-user:hover{background:var(--g-100)}
.sidebar-user-name{font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sidebar-user-lvl{font-size:11px;color:var(--text-3);font-weight:600}
.app-main{flex:1;display:flex;flex-direction:column;min-width:0}
.app-header{position:sticky;top:0;z-index:50;background:var(--surface);border-bottom:1px solid var(--border);padding:14px 20px;padding-top:max(14px,var(--safe-top));display:flex;align-items:center;gap:12px;height:64px;backdrop-filter:blur(12px);background:rgba(255,255,255,.9)}
[data-theme="dark"] .app-header{background:rgba(19,47,42,.9)}
.header-title{font-size:17px;font-weight:800;flex:1}
.app-content{flex:1;padding:22px;padding-bottom:calc(90px + var(--safe-bottom));max-width:1050px;width:100%;margin:0 auto}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);padding:8px 10px;padding-bottom:max(8px,var(--safe-bottom));display:flex;justify-content:space-around;z-index:50;box-shadow:0 -4px 20px rgba(6,78,59,.06)}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 4px;border-radius:8px;color:var(--text-3);font-size:10px;font-weight:700;transition:all var(--t)}
.nav-item.active{color:var(--brand);background:var(--brand-soft)}
.nav-item-icon{font-size:20px;line-height:1}

/* ═══ Home ═══ */
.welcome{background:linear-gradient(135deg,#022C22 0%,#064E3B 50%,#065F46 100%);color:#fff;border-radius:var(--r-xl);padding:28px;margin-bottom:22px;position:relative;overflow:hidden;box-shadow:var(--sh-lg)}
.welcome::before{content:'';position:absolute;top:-40px;left:-40px;width:200px;height:200px;background:radial-gradient(circle,rgba(245,158,11,.2),transparent 70%);border-radius:50%}
.welcome-greet{font-size:14px;color:rgba(255,255,255,.8);margin-bottom:6px;font-weight:600;position:relative;z-index:1}
.welcome-name{font-size:26px;font-weight:900;color:#fff;position:relative;z-index:1;letter-spacing:-.5px}
.welcome-sub{font-size:13px;color:rgba(255,255,255,.7);margin-top:6px;font-weight:500;position:relative;z-index:1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:26px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px;text-align:center;position:relative;overflow:hidden}
.stat-icon{width:44px;height:44px;margin:0 auto 10px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px}
.stat-value{font-size:22px;font-weight:900;color:var(--text)}
.stat-label{font-size:11px;color:var(--text-2);margin-top:2px;font-weight:700}
.section-title{font-size:17px;font-weight:800;margin-bottom:14px;color:var(--text)}
.quick-actions{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.quick-action{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px;display:flex;align-items:center;gap:14px;cursor:pointer;transition:all var(--t)}
.quick-action:hover{border-color:var(--brand);box-shadow:var(--sh);transform:translateY(-2px)}
.quick-icon{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:24px}
.quick-title{font-size:14px;font-weight:800;margin-bottom:2px;color:var(--text)}
.quick-desc{font-size:12px;color:var(--text-3);font-weight:600}

/* ═══ Chat ═══ */
.chat-container{display:flex;flex-direction:column;height:calc(100vh - 170px);height:calc(100dvh - 170px);min-height:400px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;margin:0 auto;max-width:950px;box-shadow:var(--sh)}
.chat-header{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;flex-shrink:0}
.chat-header-icon{width:44px;height:44px;border-radius:12px;background:var(--brand-soft);color:var(--brand);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:20px}
.chat-header-info{flex:1;min-width:0}
.chat-header-title{font-size:15px;font-weight:800;color:var(--text)}
.chat-header-sub{font-size:12px;color:var(--brand);font-weight:700;margin-top:2px}
.chat-body{flex:1;overflow-y:auto;padding:18px;background:var(--g-50);display:flex;flex-direction:column;gap:14px;scroll-behavior:smooth}
.msg{display:flex;gap:10px;animation:msgIn 250ms}
@keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.msg.mine{flex-direction:row-reverse}
.msg-avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--g-300),var(--g-400));color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;flex-shrink:0;align-self:flex-end;overflow:hidden}
.msg.mine .msg-avatar{background:linear-gradient(135deg,var(--brand),var(--brand-dark))}
.msg-avatar img{width:100%;height:100%;object-fit:cover}
.msg-content{max-width:75%;display:flex;flex-direction:column}
.msg.mine .msg-content{align-items:flex-end}
.msg-meta{font-size:11px;color:var(--text-3);margin-bottom:5px;padding:0 6px;font-weight:700}
.msg-bubble{padding:10px 14px;border-radius:16px;font-size:14px;line-height:1.6;word-wrap:break-word;background:var(--surface);border:1px solid var(--border);color:var(--text)}
.msg.mine .msg-bubble{background:linear-gradient(135deg,var(--brand),var(--brand-dark));color:#fff;border-color:transparent}
.msg-img{max-width:100%;max-height:260px;border-radius:10px;cursor:pointer;display:block;margin-bottom:4px}
.msg-audio{display:flex;align-items:center;gap:8px;min-width:180px}
.msg-audio-play{width:32px;height:32px;border-radius:50%;background:var(--surface);color:var(--text);border:none;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px}
.msg.mine .msg-audio-play{background:rgba(255,255,255,.25);color:#fff}
.audio-wave{flex:1;display:flex;gap:2px;align-items:center;height:20px}
.audio-wave span{width:3px;background:currentColor;border-radius:2px;opacity:.4}
.msg-reply-ctx{background:rgba(0,0,0,.08);border-right:2px solid currentColor;padding:4px 8px;border-radius:6px;margin-bottom:4px;font-size:11px}
.msg.mine .msg-reply-ctx{background:rgba(255,255,255,.2)}
.msg-reply-ctx .rname{font-weight:700;opacity:.9}

    if (!name) return '?';

        var buf = new TextEncoder().encode(text);

          var hex = Array.from(new Uint8Array(hash)).map(function(b) {

// ═══════════════════════════════════════════════════════
// 5) Theme
// ═══════════════════════════════════════════════════════
var Theme = {
  init: function() {
    var saved = localStorage.getItem('itqan_theme');
    if (!saved) {
      var h = new Date().getHours();
      saved = (h >= 18 || h < 6) ? 'dark' : 'light';
    }
    this.set(saved);
  },
  set: function(t) {
    document.body.setAttribute('data-theme', t);
    try { localStorage.setItem('itqan_theme', t); } catch(e) {}
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', t === 'dark' ? '#0A1929' : '#064E3B');
  },
  toggle: function() {
    var c = document.body.getAttribute('data-theme');
    this.set(c === 'dark' ? 'light' : 'dark');
  },
  isDark: function() {
    return document.body.getAttribute('data-theme') === 'dark';
  }
};

// ═══════════════════════════════════════════════════════
// 6) Session
// ═══════════════════════════════════════════════════════
var Session = {
  load: function() {
    try {
      var s = localStorage.getItem('itqan_session');
      if (s) { State.user = JSON.parse(s); return true; }
    } catch(e) {}
    return false;
  },
  save: function(user) {
    State.user = {
      uid: user.uid,
      name: user.name || '',
      email: user.email || '',
      avatar: user.avatar || '',
      role: user.role || 'member',
      level: user.level || 1,
      xp: user.xp || 0
    };
    try { localStorage.setItem('itqan_session', JSON.stringify(State.user)); } catch(e) {}
  },
  clear: function() {
    State.user = null;
    try { localStorage.removeItem('itqan_session'); } catch(e) {}
  },
  isLoggedIn: function() { return !!(State.user && State.user.uid); },
  isAdmin: function() {
    if (!State.user) return false;
    return State.user.role === 'admin' || State.user.role === 'developer';
  },
  addXP: function(n) {
    if (!State.user) return;
    State.user.xp = (State.user.xp || 0) + n;
    var t = [0, 100, 250, 500, 900, 1400, 2000, 2800, 3800, 5000];
    var lvl = 1;
    for (var i = t.length - 1; i >= 0; i--) {
      if (State.user.xp >= t[i]) { lvl = i + 1; break; }
    }
    State.user.level = lvl;
    try { localStorage.setItem('itqan_session', JSON.stringify(State.user)); } catch(e) {}
    if (window.db && State.user.uid && State.user.uid.indexOf('guest') !== 0) {
      window.db.ref('users/' + State.user.uid).update({
        xp: State.user.xp,
        level: State.user.level,
        lastActive: Date.now()
      }).catch(function() {});
    }
  }
};

// ═══════════════════════════════════════════════════════
// 7) Router
// ═══════════════════════════════════════════════════════
var Router = {
  routes: {},
  current: null,
  register: function(name, fn) { this.routes[name] = fn; },
  go: function(name, params) {
    var fn = this.routes[name];
    if (!fn) { console.warn('No route:', name); return false; }
    this.current = name;
    State.screen = name;
    var root = U.$('app-root');
    if (!root) return false;
    try {
      root.innerHTML = fn(params || {}) || '';
      window.scrollTo(0, 0);
      return true;
    } catch(e) {
      console.error('Render error:', name, e);
      root.innerHTML = '<div style="padding:40px;text-align:center;color:var(--red-600)">حدث خطأ</div>';
      return false;
    }
  }
};

// ═══════════════════════════════════════════════════════
// 8) Firebase Init
// ═══════════════════════════════════════════════════════
function initFirebase() {
  try {
    if (typeof firebase === 'undefined') return false;
    if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
    window.db = firebase.database();
    window.fbAuth = firebase.auth();
    return true;
  } catch(e) {
    console.error('Firebase error:', e);
    return false;
  }
}

// ═══════════════════════════════════════════════════════
// 11) AUTH METHODS
// ═══════════════════════════════════════════════════════
var Auth = {
  switchTab: function(tab) {
    var tabs = U.$$('.auth-tab');
    tabs.forEach(function(t, i) {
      t.classList.toggle('active', i === (tab === 'signin' ? 0 : 1));
    });
    var forms = U.$$('.auth-form');
    forms.forEach(function(f) {
      f.classList.toggle('active', f.id === 'form-' + tab);
    });
  },

  togglePw: function(btn, id) {
    var inp = U.$(id);
    if (!inp) return;
    var isPw = inp.type === 'password';
    inp.type = isPw ? 'text' : 'password';
    btn.textContent = isPw ? '🙈' : '👁️';
  },

  signin: async function(e) {
    e.preventDefault();
    var email = U.$('signin-email').value.trim().toLowerCase();
    var pw = U.$('signin-password').value;

    if (!email || !pw) { UI.toast('أكمل البيانات', 'error'); return; }

    var btn = U.$('signin-btn');
    var orig = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>...';

    try {
      if (!window.db) throw new Error('Firebase غير متصل');

      // Admin shortcut
      if ((email === ADMIN.name || email === ADMIN.email) && pw === ADMIN.password) {
        var snap = await window.db.ref('users').once('value');
        var users = snap.val() || {};
        var adminUid = null, adminData = null;
        for (var uid in users) {
          if (users[uid].name === 'admin' || users[uid].email === ADMIN.email) {
            adminUid = uid;
            adminData = users[uid];
            break;
          }
        }
        if (!adminUid) {
          var salt = U.genSalt();
          var hash = await U.hashPw(ADMIN.password, salt);
          adminUid = 'admin_' + Date.now();
          adminData = {
            name: 'admin',
            email: ADMIN.email,
            salt: salt,
            hash: hash,
            role: 'developer',
            level: 99,
            xp: 0,
            createdAt: Date.now()
          };
          await window.db.ref('users/' + adminUid).set(adminData);
        }
        Session.save({
          uid: adminUid,
          name: adminData.name,
          email: adminData.email,
          role: adminData.role,
          level: adminData.level,
          xp: adminData.xp
        });
        UI.toast('مرحباً يا أدمن', 'success');
        U.haptic(20);
        setTimeout(function() { Router.go('home'); }, 200);
        return;
      }

      // Find user
      var user = null, foundUid = null;
      var byEmail = await window.db.ref('users').orderByChild('email').equalTo(email).once('value');
      if (byEmail.exists()) {
        var val = byEmail.val();
        foundUid = Object.keys(val)[0];
        user = val[foundUid];
      } else {
        var byName = await window.db.ref('users').orderByChild('name').equalTo(email).once('value');
        if (byName.exists()) {
          var val2 = byName.val();
          foundUid = Object.keys(val2)[0];
          user = val2[foundUid];
        }
      }

      if (!user) {
        UI.toast('البريد أو كلمة المرور غير صحيحة', 'error');
        btn.disabled = false;
        btn.innerHTML = orig;
        return;
      }

      if (user.banned) {
        UI.toast('🚫 الحساب محظور', 'error');
        btn.disabled = false;
        btn.innerHTML = orig;
        return;
      }

      var userHash = await U.hashPw(pw, user.salt || '');
      if (userHash !== user.hash) {
        UI.toast('البريد أو كلمة المرور غير صحيحة', 'error');
        btn.disabled = false;
        btn.innerHTML = orig;
        return;
      }

      Session.save({
        uid: foundUid,
        name: user.name,
        email: user.email,
        avatar: user.avatar,
        role: user.role,
        level: user.level,
        xp: user.xp
      });
      await window.db.ref('users/' + foundUid + '/lastActive').set(Date.now());
      UI.toast('مرحباً ' + user.name, 'success');
      U.haptic(20);
      setTimeout(function() { Router.go('home'); }, 200);

    } catch(err) {
      console.error(err);
      UI.toast('خطأ: ' + err.message, 'error');
      btn.disabled = false;
      btn.innerHTML = orig;
    }
  },

  signup: async function(e) {
    e.preventDefault();
    var name = U.$('signup-name').value.trim();
    var email = U.$('signup-email').value.trim().toLowerCase();
    var pw = U.$('signup-password').value;

    if (!name || name.length < 2) { UI.toast('الاسم قصير', 'error'); return; }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { UI.toast('بريد غير صالح', 'error'); return; }
    if (pw.length < 6) { UI.toast('كلمة المرور قصيرة', 'error'); return; }

    var btn = U.$('signup-btn');
    var orig = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>...';

    try {
      if (!window.db) throw new Error('Firebase غير متصل');
      var snap = await window.db.ref('users').orderByChild('email').equalTo(email).once('value');
      if (snap.exists()) {
        UI.toast('البريد مستخدم', 'error');
        btn.disabled = false;
        btn.innerHTML = orig;
        return;
      }

      var uid = U.genId('u');
      var salt = U.genSalt();
      var hash = await U.hashPw(pw, salt);
      var data = {
        name: name,
        email: email,
        avatar: '',
        salt: salt,
        hash: hash,
        role: 'member',
        level: 1,
        xp: 0,
        createdAt: Date.now(),
        lastActive: Date.now()
      };
      await window.db.ref('users/' + uid).set(data);
      Session.save({
        uid: uid,
        name: name,
        email: email,
        avatar: '',
        role: 'member',
        level: 1,
        xp: 0
      });
      UI.toast('تم إنشاء حسابك', 'success');
      U.haptic(20);
      setTimeout(function() { Router.go('home'); }, 200);

    } catch(err) {
      console.error(err);
      UI.toast('خطأ: ' + err.message, 'error');
      btn.disabled = false;
      btn.innerHTML = orig;
    }
  },

  googleSignIn: async function() {
    var btn = U.$('google-btn');
    if (!btn) return;
    var orig = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> جاري الاتصال...';

    try {
      if (!window.fbAuth) throw new Error('Firebase Auth غير متصل');
      var provider = new firebase.auth.GoogleAuthProvider();
      provider.addScope('email');
      provider.addScope('profile');

      var result = await window.fbAuth.signInWithPopup(provider);
      var guser = result.user;

      if (!guser || !guser.email) throw new Error('لم يتم الحصول على البيانات');

      var snap = await window.db.ref('users').orderByChild('email').equalTo(guser.email.toLowerCase()).once('value');

      var uid, userData;

      if (snap.exists()) {
        var val = snap.val();
        uid = Object.keys(val)[0];
        userData = val[uid];
        await window.db.ref('users/' + uid).update({
          lastActive: Date.now(),
          googleUid: guser.uid,
          avatar: userData.avatar || guser.photoURL || ''
        });
        userData.avatar = userData.avatar || guser.photoURL || '';
      } else {
        uid = U.genId('u');
        userData = {
          name: guser.displayName || guser.email.split('@')[0],
          email: guser.email.toLowerCase(),
          avatar: guser.photoURL || '',
          googleUid: guser.uid,
          role: 'member',
          level: 1,
          xp: 0,
          provider: 'google',
          createdAt: Date.now(),
          lastActive: Date.now()
        };
        await window.db.ref('users/' + uid).set(userData);
      }

      Session.save({
        uid: uid,
        name: userData.name,
        email: userData.email,
        avatar: userData.avatar || '',
        role: userData.role,
        level: userData.level,
        xp: userData.xp
      });
      UI.toast('مرحباً ' + userData.name, 'success');
      U.haptic(20);
      setTimeout(function() { Router.go('home'); }, 300);

    } catch(err) {
      console.error(err);
      var code = err.code || '';
      if (code === 'auth/popup-closed-by-user') {
        UI.toast('تم إغلاق النافذة', 'warning');
      } else if (code === 'auth/popup-blocked') {
        UI.toast('المتصفح منع النافذة', 'error');
      } else if (code === 'auth/operation-not-allowed') {
        UI.toast('فعّل Google في Firebase Console', 'error', 6000);
      } else if (code === 'auth/unauthorized-domain') {
        UI.toast('الدومين غير مصرح', 'error', 6000);
      } else {
        UI.toast('فشل: ' + (err.message || 'خطأ'), 'error');
      }
      btn.disabled = false;
      btn.innerHTML = orig;
    }
  },

  guest: function() {
    var guestId = U.genId('guest');
    Session.save({
      uid: guestId,
      name: 'ضيف',
      email: '',
      avatar: '',
      role: 'guest',
      level: 1,
      xp: 0
    });
    UI.toast('دخلت كضيف', 'info');
    setTimeout(function() { Router.go('home'); }, 100);
  }
};

  var fbOk = initFirebase();
  console.log(fbOk ? '  ✓ Firebase' : '  ✗ Firebase');

  Theme.init();
  console.log('  ✓ Theme');

  var hasSession = Session.load();
  console.log('  ' + (hasSession ? '✓' : '–') + ' Session');

    var splash = U.$('splash');

      setTimeout(function() { if (splash.parentNode) splash.remove(); }, 500);
    }

    if (hasSession && Session.isLoggedIn()) {
      Router.go('home');
    } else {
      Router.go('auth');
    }
  }, 900);

  console.log('%c✅ Core + Auth Ready', 'color:#10B981;font-weight:bold;');
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}

})();
</script>
<script>
/* ═══════════════════════════════════════════════════════
   منصة إتقان — Home + Chat + Rooms
   ═══════════════════════════════════════════════════════ */
(function() {
'use strict';

if (!window.App) { console.error('App not loaded'); return; }

var App = window.App;
var U = App.utils;
var UI = App.ui;
var Session = App.session;
var Router = App.router;
var layout = App.layout;

// ═══════════════════════════════════════════════════════
// 1) HOME SCREEN
// ═══════════════════════════════════════════════════════
function HomeScreen() {
  if (!Session.isLoggedIn()) { setTimeout(function() { Router.go('auth'); }, 50); return ''; }
  var s = App.state.user;
  var hour = new Date().getHours();
  var greet = hour < 12 ? 'صباح الخير' : hour < 18 ? 'مساء الخير' : 'مساء الخير';

  var actions = [
    { screen: 'chat', icon: '💬', label: 'الدردشة', desc: 'تحدث مع زمايلك', bg: 'linear-gradient(135deg,#DBEAFE,#BFDBFE)' },
    { screen: 'bot', icon: '🤖', label: 'المساعد', desc: 'اسأل أي حاجة', bg: 'linear-gradient(135deg,#D1FAE5,#A7F3D0)' },
    { screen: 'quiz', icon: '📄', label: 'الاختبارات', desc: 'اختبر نفسك', bg: 'linear-gradient(135deg,#FEF3C7,#FDE68A)' },
    { screen: 'cards', icon: '🃏', label: 'البطاقات', desc: 'احفظ المفاهيم', bg: 'linear-gradient(135deg,#EDE9FE,#DDD6FE)' }
  ];

  return '<div class="app-layout">' +
    layout.Sidebar('home') +
    '<div class="app-main">' +
    layout.Header('الرئيسية') +
    '<main class="app-content">' +
    '<div class="welcome">' +
    '<div class="welcome-greet">' + greet + '،</div>' +
    '<div class="welcome-name">' + U.esc(s.name) + '</div>' +
    '<div class="welcome-sub">مستعد للتعلم؟</div>' +
    '</div>' +
    '<div class="stats">' +
    '<div class="stat"><div class="stat-icon" style="background:#FEF3C7;color:#D97706">⚡</div><div class="stat-value">' + (s.xp || 0) + '</div><div class="stat-label">XP</div></div>' +
    '<div class="stat"><div class="stat-icon" style="background:#D1FAE5;color:#059669">🏅</div><div class="stat-value">' + (s.level || 1) + '</div><div class="stat-label">المستوى</div></div>' +
    '<div class="stat"><div class="stat-icon" style="background:#DBEAFE;color:#2563EB">🔥</div><div class="stat-value">0</div><div class="stat-label">Streak</div></div>' +
    '</div>' +
    '<h3 class="section-title">إيه اللي عايز تعمله؟</h3>' +
    '<div class="quick-actions">' +
    actions.map(function(a) {
      return '<div class="quick-action" onclick="App.go(\'' + a.screen + '\')">' +
        '<div class="quick-icon" style="background:' + a.bg + '">' + a.icon + '</div>' +
        '<div style="flex:1"><div class="quick-title">' + a.label + '</div><div class="quick-desc">' + a.desc + '</div></div>' +
        '<span style="color:var(--text3);font-size:18px">‹</span>' +
        '</div>';
    }).join('') +
    '</div>' +
    '</main>' +
    layout.BottomNav('home') +
    '</div>' +
    '</div>';
}

// ═══════════════════════════════════════════════════════
// 2) CHAT STATE
// ═══════════════════════════════════════════════════════
var ChatState = {
  room: 'GENERAL',
  messages: {},
  users: {},
  listeners: [],
  heartbeatInt: null,
  typingTimeout: null,
  replyTo: null,
  pendingMedia: null,
  mediaRecorder: null,
  recordChunks: [],
  recordStart: 0,
  recordTimer: null,
  isRecording: false,
  currentAudio: null,
  currentAudioId: null
};
window.ChatState = ChatState;

// ═══════════════════════════════════════════════════════
// 3) CHAT SCREEN
// ═══════════════════════════════════════════════════════
function ChatScreen() {
  if (!Session.isLoggedIn()) { setTimeout(function() { Router.go('auth'); }, 50); return ''; }
  setTimeout(function() { startChatSession(); }, 100);

  return '<div class="app-layout">' +
    layout.Sidebar('chat') +
    '<div class="app-main">' +
    layout.Header('الدردشة') +
    '<main class="app-content" style="padding:12px">' +
    '<div class="chat-container">' +
    '<div class="chat-header">' +
    '<button class="btn-icon" onclick="App.go(\'rooms\')" title="الغرف">🏘️</button>' +
    '<div class="chat-header-icon">💬</div>' +
    '<div class="chat-header-info">' +
    '<div class="chat-header-title" id="chat-room-name">' + U.esc(ChatState.room) + '</div>' +
    '<div class="chat-header-sub" id="chat-online">جاري التحميل...</div>' +
    '</div>' +
    '</div>' +
    '<div class="typing-indicator" id="chat-typing"></div>' +
    '<div class="chat-body" id="chat-body">' +
    '<div class="chat-empty"><div class="chat-empty-icon">💬</div><div class="chat-empty-title">جاري التحميل...</div></div>' +
    '</div>' +
    '<div class="reply-preview" id="chat-reply-preview">' +
    '<div class="reply-preview-content">' +
    '<div class="reply-preview-name" id="chat-reply-name"></div>' +
    '<div class="reply-preview-text" id="chat-reply-text"></div>' +
    '</div>' +
    '<button class="reply-preview-close" onclick="Chat.cancelReply()">✕</button>' +
    '</div>' +
    '<div class="chat-input-area">' +
    '<button class="chat-btn" onclick="Chat.showEmoji(this)">😊</button>' +
    '<button class="chat-btn" onclick="Chat.pickImage()">📷</button>' +
    '<button class="chat-btn" id="chat-mic-btn" onclick="Chat.toggleRecord()">🎤</button>' +
    '<input class="input chat-input" id="chat-input" type="text" placeholder="اكتب رسالة..." ' +
    'onkeypress="if(event.key===\'Enter\'){Chat.send()}" oninput="Chat.typing()">' +
    '<button class="chat-send" onclick="Chat.send()">➤</button>' +
    '</div>' +
    '</div>' +
    '</main>' +
    layout.BottomNav('chat') +
    '</div>' +
    '</div>';
}

// ═══════════════════════════════════════════════════════
// 4) CHAT SESSION
// ═══════════════════════════════════════════════════════
function startChatSession() {
  var s = App.state.user;
  if (!window.db || !s.uid) return;

  var uid = s.uid;
  var room = ChatState.room;

  ChatState.listeners.forEach(function(ref) { try { ref.off(); } catch(e) {} });
  ChatState.listeners = [];
  if (ChatState.heartbeatInt) clearInterval(ChatState.heartbeatInt);

  var userRef = window.db.ref('rooms/' + room + '/users/' + uid);
  userRef.set({ name: s.name, avatar: s.avatar || '', lastSeen: firebase.database.ServerValue.TIMESTAMP });
  userRef.onDisconnect().remove();

  ChatState.heartbeatInt = setInterval(function() {
    window.db.ref('rooms/' + room + '/users/' + uid + '/lastSeen')
      .set(firebase.database.ServerValue.TIMESTAMP);
  }, 20000);

  var usersRef = window.db.ref('rooms/' + room + '/users');
  usersRef.on('value', function(snap) {
    var users = snap.val() || {};
    ChatState.users = users;
    var el = U.$('chat-online');
    if (el) el.textContent = Object.keys(users).length + ' متصل';
  });
  ChatState.listeners.push(usersRef);

  var msgRef = window.db.ref('rooms/' + room + '/messages').limitToLast(100);
  msgRef.on('value', function(snap) {
    ChatState.messages = snap.val() || {};
    renderMessages();
  });
  ChatState.listeners.push(msgRef);

  var typingRef = window.db.ref('rooms/' + room + '/typing');
  typingRef.on('value', function(snap) {
    var t = snap.val() || {};
    var names = Object.keys(t)
      .filter(function(k) { return k !== uid && (Date.now() - (t[k].ts || 0)) < 4000; })
      .map(function(k) { return t[k].name; });
    var bar = U.$('chat-typing');
    if (bar) bar.textContent = names.length ? names.join(', ') + ' يكتب...' : '';
  });
  ChatState.listeners.push(typingRef);

  console.log('🔌 Chat session:', room);
}

// ═══════════════════════════════════════════════════════
// 5) RENDER MESSAGES
// ═══════════════════════════════════════════════════════
function renderMessages() {
  var body = U.$('chat-body');
  if (!body) return;
  var msgs = ChatState.messages;
  var keys = Object.keys(msgs).sort(function(a, b) {
    return (msgs[a].timestamp || 0) - (msgs[b].timestamp || 0);
  });

  if (!keys.length) {
    body.innerHTML = '<div class="chat-empty"><div class="chat-empty-icon">💬</div><div class="chat-empty-title">لا رسائل بعد</div><div class="chat-empty-desc">كن أول من يبدأ</div></div>';
    return;
  }

  var atBottom = body.scrollHeight - body.scrollTop - body.clientHeight < 100;
  var s = App.state.user;

  body.innerHTML = keys.map(function(k) {
    return renderOneMessage(k, msgs[k], s);
  }).join('');

  if (atBottom) body.scrollTop = body.scrollHeight;
}

function renderOneMessage(id, m, s) {
  var mine = m.userId === s.uid;
  var time = m.timestamp ? U.fmtTime(m.timestamp) : '';
  var initials = U.initials(m.name || '?');
  var avatarHtml = m.avatar ? '<img src="' + U.esc(m.avatar) + '" alt="">' : initials;

  var replyCtx = '';
  if (m.replyTo) {
    replyCtx = '<div class="msg-reply-ctx"><div class="rname">↩ ' + U.esc(m.replyTo.name) + '</div><div class="rprev">' + U.esc(m.replyTo.preview) + '</div></div>';
  }

  var content = '';
  if (m.type === 'image' && m.media && m.media.data) {
    content = '<img class="msg-img" src="' + U.esc(m.media.data) + '" onclick="Chat.lightbox(\'' + id + '\')" loading="lazy">';
    if (m.text) content += '<div style="margin-top:4px">' + U.esc(m.text) + '</div>';
  } else if (m.type === 'audio' && m.media && m.media.data) {
    var dur = Math.round(m.media.duration || 0);
    var bars = '';
    for (var i = 0; i < 20; i++) bars += '<span style="height:' + (4 + Math.random() * 14) + 'px"></span>';
    content = '<div class="msg-audio"><button class="msg-audio-play" onclick="Chat.toggleAudio(\'' + id + '\')" id="play-' + id + '">▶</button><div class="audio-wave">' + bars + '</div><span style="font-size:11px;opacity:.8">' + dur + 'ث</span></div><audio id="audio-' + id + '" src="' + U.esc(m.media.data) + '" preload="metadata"></audio>';
  } else {
    content = U.esc(m.text || '');
  }

  var reactions = '';
  if (m.reactions && Object.keys(m.reactions).length) {
    reactions = '<div class="msg-reactions">';
    Object.keys(m.reactions).forEach(function(emo) {
      var users = m.reactions[emo] || {};
      var count = Object.keys(users).length;
      var isMine = users[s.uid];
      reactions += '<button class="reaction-chip ' + (isMine ? 'mine' : '') + '" onclick="Chat.react(\'' + id + '\',\'' + emo + '\')">' + emo + ' ' + count + '</button>';
    });
    reactions += '</div>';
  }

  var actions = '<div class="msg-actions">' +
    '<button class="msg-action" onclick="Chat.replyTo(\'' + id + '\')">رد</button>' +
    '<button class="msg-action" onclick="Chat.react(\'' + id + '\',\'❤️\')">❤️</button>' +
    '<button class="msg-action" onclick="Chat.react(\'' + id + '\',\'👍\')">👍</button>' +
    (mine ? '<button class="msg-action" onclick="Chat.deleteMsg(\'' + id + '\')">🗑</button>' : '') +
    '</div>';

  return '<div class="msg ' + (mine ? 'mine' : '') + '">' +
    '<div class="msg-avatar">' + avatarHtml + '</div>' +
    '<div class="msg-content">' +
    '<div class="msg-meta">' + U.esc(m.name || '?') + ' • ' + time + '</div>' +
    '<div class="msg-bubble">' + replyCtx + content + '</div>' +
    reactions + actions +
    '</div>' +
    '</div>';
}

// ═══════════════════════════════════════════════════════
// 6) CHAT METHODS
// ═══════════════════════════════════════════════════════
var Chat = {
  send: async function() {
    var inp = U.$('chat-input');
    var text = inp && inp.value.trim();
    if (!text) return;
    if (!window.db) { UI.toast('Firebase غير متصل', 'error'); return; }

    var s = App.state.user;
    var id = U.genId('m');
    var payload = {
      type: 'text',
      text: text,
      name: s.name,
      avatar: s.avatar || '',
      userId: s.uid,
      timestamp: firebase.database.ServerValue.TIMESTAMP
    };

    if (ChatState.replyTo) {
      payload.replyTo = ChatState.replyTo;
      Chat.cancelReply();
    }

    try {
      await window.db.ref('rooms/' + ChatState.room + '/messages/' + id).set(payload);
      inp.value = '';
      Session.addXP(2);
    } catch(e) { UI.toast('فشل: ' + e.message, 'error'); }
  },

  typing: function() {
    var s = App.state.user;
    if (!s.uid || !window.db) return;
    var ref = window.db.ref('rooms/' + ChatState.room + '/typing/' + s.uid);
    ref.set({ name: s.name, ts: Date.now() });
    ref.onDisconnect().remove();
    clearTimeout(ChatState.typingTimeout);
    ChatState.typingTimeout = setTimeout(function() { ref.remove(); }, 2500);
  },

  replyTo: function(id) {
    var m = ChatState.messages[id];
    if (!m) return;
    var preview = m.type === 'image' ? '📷 صورة' : m.type === 'audio' ? '🎤 صوت' : (m.text || '').slice(0, 50);
    ChatState.replyTo = { id: id, name: m.name || '?', preview: preview };
    var nameEl = U.$('chat-reply-name');
    var textEl = U.$('chat-reply-text');
    var previewEl = U.$('chat-reply-preview');
    if (nameEl) nameEl.textContent = '↩ ' + ChatState.replyTo.name;
    if (textEl) textEl.textContent = preview;
    if (previewEl) previewEl.classList.add('show');
    U.$('chat-input') && U.$('chat-input').focus();
  },

  cancelReply: function() {
    ChatState.replyTo = null;
    var el = U.$('chat-reply-preview');
    if (el) el.classList.remove('show');
  },

  react: function(id, emo) {
    var s = App.state.user;
    if (!s.uid) return;
    var ref = window.db.ref('rooms/' + ChatState.room + '/messages/' + id + '/reactions/' + emo + '/' + s.uid);
    ref.once('value').then(function(snap) {
      if (snap.val()) ref.remove();
      else ref.set(true);
    });
  },

  deleteMsg: function(id) {
    UI.confirm('حذف', 'حذف هذه الرسالة؟').then(function(ok) {
      if (!ok) return;
      window.db.ref('rooms/' + ChatState.room + '/messages/' + id).remove();
      UI.toast('تم الحذف', 'success');
    });
  },

  showEmoji: function(btn) {
    var existing = document.querySelector('.emoji-picker');
    if (existing) { existing.remove(); return; }
    var emojis = ['😀','😁','😂','🤣','😊','😍','🤔','😎','😢','😡','👍','👎','❤️','🔥','✨','🎉','💯','👏','🙏','💪','🎓','📚','📝','✅','❌','⭐','🚀','💡'];
    var picker = document.createElement('div');
    picker.className = 'emoji-picker';
    picker.innerHTML = emojis.map(function(e) { return '<button onclick="Chat.insertEmoji(\'' + e + '\')">' + e + '</button>'; }).join('');
    btn.parentNode.appendChild(picker);
    setTimeout(function() {
      document.addEventListener('click', function close(e) {
        if (!picker.contains(e.target) && e.target !== btn) {
          picker.remove();
          document.removeEventListener('click', close);
        }
      }, { once: true });
    }, 10);
  },

  insertEmoji: function(e) {
    var inp = U.$('chat-input');
    if (inp) { inp.value += e; inp.focus(); }
    var p = document.querySelector('.emoji-picker');
    if (p) p.remove();
  },

  pickImage: function() {
    var s = App.state.user;
    if (!s.uid) return;
    var input = document.createElement('input');
    input.type = 'file';
    input.accept = 'image/*';
    input.onchange = function(e) {
      var file = e.target.files[0];
      if (!file) return;
      if (file.size > 5 * 1024 * 1024) { UI.toast('الصورة كبيرة (5MB max)', 'error'); return; }
      UI.toast('جاري المعالجة...', 'info', 1500);
      var reader = new FileReader();
      reader.onload = function(ev) {
        ChatState.pendingMedia = { type: 'image', dataUrl: ev.target.result };
        Chat.showMediaPreview();
      };
      reader.readAsDataURL(file);
    };
    input.click();
  },

  toggleRecord: async function() {
    var s = App.state.user;
    if (!s.uid) return;
    if (ChatState.isRecording && ChatState.mediaRecorder && ChatState.mediaRecorder.state === 'recording') {
      Chat.stopRecord();
      return;
    }
    try {
      var stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      var mime = MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : MediaRecorder.isTypeSupported('audio/mp4') ? 'audio/mp4' : '';
      ChatState.mediaRecorder = mime ? new MediaRecorder(stream, { mimeType: mime }) : new MediaRecorder(stream);
      ChatState.recordChunks = [];
      ChatState.isRecording = true;
      ChatState.mediaRecorder.ondataavailable = function(e) { if (e.data.size > 0) ChatState.recordChunks.push(e.data); };
      ChatState.mediaRecorder.onstop = function() {
        stream.getTracks().forEach(function(t) { t.stop(); });
        clearInterval(ChatState.recordTimer);
        ChatState.isRecording = false;
        var duration = (Date.now() - ChatState.recordStart) / 1000;
        var micBtn = U.$('chat-mic-btn');
        if (micBtn) { micBtn.classList.remove('recording'); micBtn.textContent = '🎤'; }
        if (duration < 1) { UI.toast('تسجيل قصير', 'error'); return; }
        var blob = new Blob(ChatState.recordChunks, { type: ChatState.mediaRecorder.mimeType || 'audio/webm' });
        var reader = new FileReader();
        reader.onload = function(ev) {
          ChatState.pendingMedia = { type: 'audio', dataUrl: ev.target.result, duration: duration };
          Chat.showMediaPreview();
        };
        reader.readAsDataURL(blob);
      };
      ChatState.mediaRecorder.start();
      ChatState.recordStart = Date.now();
      var micBtn = U.$('chat-mic-btn');
      if (micBtn) { micBtn.classList.add('recording'); micBtn.textContent = '⏹'; }
      UI.toast('🎤 جاري التسجيل — اضغط تاني للإيقاف', 'info', 2500);
      ChatState.recordTimer = setInterval(function() {
        var sec = Math.floor((Date.now() - ChatState.recordStart) / 1000);
        if (sec >= 180) { Chat.stopRecord(); UI.toast('الحد 3 دقائق', 'warning'); }
      }, 500);
    } catch(e) {
      UI.toast('تعذّر الميكروفون: ' + e.message, 'error');
      ChatState.isRecording = false;
    }
  },

  stopRecord: function() {
    if (ChatState.mediaRecorder && ChatState.mediaRecorder.state === 'recording') ChatState.mediaRecorder.stop();
    ChatState.isRecording = false;
    var micBtn = U.$('chat-mic-btn');
    if (micBtn) { micBtn.classList.remove('recording'); micBtn.textContent = '🎤'; }
  },

  showMediaPreview: function() {
    if (!ChatState.pendingMedia) return;
    var isImg = ChatState.pendingMedia.type === 'image';
    var html = isImg
      ? '<img src="' + ChatState.pendingMedia.dataUrl + '" style="max-width:100%;max-height:300px;border-radius:12px;margin:0 auto 12px">'
      : '<audio controls src="' + ChatState.pendingMedia.dataUrl + '" style="width:100%;margin-bottom:12px"></audio><p style="font-size:13px;color:var(--text2);font-weight:600">المدة: ' + Math.round(ChatState.pendingMedia.duration) + ' ثانية</p>';
    UI.modal({
      title: isImg ? '📷 معاينة' : '🎤 معاينة',
      content: '<div style="text-align:center;padding:16px 0">' + html + '</div>' +
        '<div style="display:flex;gap:8px;margin-top:16px">' +
        '<button class="btn btn-block" onclick="Chat.sendPending()">📤 إرسال</button>' +
        '<button class="btn btn-secondary btn-block" onclick="Chat.cancelPending()">إلغاء</button>' +
        '</div>'
    });
  },

  sendPending: function() {
    if (!ChatState.pendingMedia || !window.db) return;
    var s = App.state.user;
    var media = ChatState.pendingMedia;
    var id = U.genId('m');
    var payload = {
      type: media.type,
      media: { data: media.dataUrl, duration: media.duration || 0 },
      name: s.name,
      avatar: s.avatar || '',
      userId: s.uid,
      timestamp: firebase.database.ServerValue.TIMESTAMP
    };
    if (ChatState.replyTo) {
      payload.replyTo = ChatState.replyTo;
      Chat.cancelReply();
    }
    window.db.ref('rooms/' + ChatState.room + '/messages/' + id).set(payload)
      .then(function() {
        UI.toast('تم الإرسال', 'success');
        Session.addXP(3);
        ChatState.pendingMedia = null;
        UI.closeAll();
      })
      .catch(function(e) { UI.toast('فشل: ' + e.message, 'error'); });
  },

  cancelPending: function() {
    ChatState.pendingMedia = null;
    UI.closeAll();
  },

  toggleAudio: function(id) {
    var audio = U.$('audio-' + id);
    var btn = U.$('play-' + id);
    if (!audio) return;
    if (ChatState.currentAudio && ChatState.currentAudio !== audio) {
      ChatState.currentAudio.pause();
      var prevBtn = U.$('play-' + ChatState.currentAudioId);
      if (prevBtn) prevBtn.textContent = '▶';
    }
    if (audio.paused) {
      audio.play();
      if (btn) btn.textContent = '⏸';
      ChatState.currentAudio = audio;
      ChatState.currentAudioId = id;
      audio.onended = function() { if (btn) btn.textContent = '▶'; };
    } else {
      audio.pause();
      if (btn) btn.textContent = '▶';
    }
  },

  lightbox: function(id) {
    var m = ChatState.messages[id];
    if (!m || !m.media) return;
    UI.modal({
      title: '🖼️',
      content: '<img src="' + U.esc(m.media.data) + '" style="max-width:100%;max-height:80vh;border-radius:12px;margin:0 auto;display:block">'
    });
  }

async function loadPublicRooms() {
  var list = U.$('public-rooms-list');
  if (!list || !window.db) return;
  try {
    var snap = await window.db.ref('roomsMeta').once('value');
    var rooms = snap.val() || {};
    var publicRooms = Object.keys(rooms)
      .filter(function(k) { return !rooms[k].password && rooms[k].type !== 'private' && k !== 'GENERAL'; })
      .map(function(k) { return { code: k, data: rooms[k] }; })
      .sort(function(a, b) { return (b.data.createdAt || 0) - (a.data.createdAt || 0); });

    if (!publicRooms.length) {
      list.innerHTML = '<div class="room-empty"><div class="room-empty-icon">🏘️</div><div class="room-empty-title">لا غرف عامة بعد</div><div class="room-empty-desc">كن أول من ينشئ غرفة</div></div>';

    list.innerHTML = '<div class="room-list">' + publicRooms.slice(0, 30).map(function(r) {
      return '<div class="room-card" onclick="Rooms.enter(\'' + U.esc(r.code) + '\')">' +

        '<div class="room-card-info"><div class="room-card-name">' + U.esc(r.data.name || r.code) + '</div>' +

        (r.data.createdBy ? '<span>بواسطة ' + U.esc(r.data.createdBy) + '</span>' : '') +
        '</div></div>' +
        '</div>';
    }).join('') + '</div>';
  } catch(e) {
    list.innerHTML = '<div class="room-empty">فشل التحميل</div>';
  }
}

    var code = 'R' + Math.random().toString(36).slice(2, 7).toUpperCase();

      await window.db.ref('roomsMeta/' + code).set({
        name: name,
        password: password || null,

        createdBy: s.name,
        createdById: s.uid,
        createdAt: Date.now()

        '<div class="field"><label>كلمة سر (لو محمية)</label>' +
        '<input class="input" id="jr-password" type="password" placeholder="اتركها فاضية"></div>' +
        '<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px">' +

        '<button class="btn" id="join-room-btn" onclick="Rooms.join()">انضمام</button>' +
        '</div>'

    if (!window.db) { UI.toast('Firebase غير متصل', 'error'); return; }

    var btn = U.$('join-room-btn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>...';

    try {
      var snap = await window.db.ref('roomsMeta/' + code).once('value');
      var room = snap.val();
      if (!room) { UI.toast('الغرفة غير موجودة', 'error'); btn.disabled = false; btn.innerHTML = 'انضمام'; return; }
      if (room.password && room.password !== password) { UI.toast('كلمة السر غلط', 'error'); btn.disabled = false; btn.innerHTML = 'انضمام'; return; }
      UI.closeAll();
      Rooms.enter(code);
    } catch(e) {
      UI.toast('خطأ: ' + e.message, 'error');
      btn.disabled = false;
      btn.innerHTML = 'انضمام';

      window.db.ref('rooms/' + ChatState.room + '/users/' + s.uid).remove().catch(function() {});
    }
    ChatState.room = code;
    UI.toast('دخلت: ' + code, 'success');
    Router.go('chat');
  }
};

var Bot = {
  send: function() {

  reply: function(text) {
    var t = text.toLowerCase().trim();

    if (/^(مرحبا|السلام|اهلا|هلا|hi|hello)/.test(t)) {
      var hour = new Date().getHours();
      var greet = hour < 12 ? 'صباح الخير ☀️' : hour < 18 ? 'أهلاً 👋' : 'مساء الخير 🌙';
      return greet + '\n\nاسألني عن أي حاجة 📚';
    }

    if (/شكرا|thanks/.test(t)) return 'العفو! 😊';

    if (/نصيحه|نصائح/.test(t)) {
      var tips = [

        'ابعد الموبايل أثناء المذاكرة'
      ];
      return '💡 ' + tips[Math.floor(Math.random() * tips.length)];
    }

    if (/الفرق بين/.test(text)) {
      var m = text.match(/الفرق\s+بين\s+([^\s]+)\s+(?:و|و\s)([^\s]+)/);
      if (m) {
        var a = this.search(m[1]);

        if (a || b) {

          if (a) parts.push('🔹 **' + a.t + ':**\n' + a.d + '\n📌 ' + (a.e || ''));
          else parts.push('❓ **' + m[1] + ':** مش موجود');
          parts.push('');
          if (b) parts.push('🔸 **' + b.t + ':**\n' + b.d + '\n📌 ' + (b.e || ''));
          else parts.push('❓ **' + m[2] + ':** مش موجود');
          return parts.join('\n');

      }

    var mathResult = this.solveMath(text);

  solveMath: function(text) {
    var t = text.toLowerCase().replace(/[×✕]/g, '*').replace(/÷/g, '/').replace(/[س]/g, 'x').replace(/\s+/g, '');

var Quiz = {
  pickPDF: function() {
    var input = document.createElement('input');
    input.type = 'file';
    input.accept = 'application/pdf,.pdf';
    input.onchange = function(e) {
      var file = e.target.files[0];
      if (file) Quiz.handlePDF(file);
    };
    input.click();
  },

  handlePDF: async function(file) {
    var status = U.$('pdf-status');
    if (status) { status.className = 'pdf-status loading'; status.textContent = '⏳ جاري استخراج النص...'; }

    try {
      if (typeof pdfjsLib === 'undefined') {
        await new Promise(function(resolve, reject) {
          var s = document.createElement('script');
          s.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
          s.onload = resolve;
          s.onerror = reject;
          document.head.appendChild(s);
        });
      }
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

      var arrayBuffer = await file.arrayBuffer();
      var pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
      var text = '';
      for (var i = 1; i <= pdf.numPages; i++) {
        var page = await pdf.getPage(i);
        var content = await page.getTextContent();
        text += content.items.map(function(x) { return x.str; }).join(' ') + '\n';
      }

      var textarea = U.$('quiz-text');
      if (textarea) textarea.value = text.trim();

      if (status) { status.className = 'pdf-status success'; status.textContent = '✅ ' + pdf.numPages + ' صفحة مستخرجة'; }
      UI.toast('تم استخراج النص', 'success');
    } catch(e) {
      if (status) { status.className = 'pdf-status error'; status.textContent = '❌ ' + e.message; }
      UI.toast('فشل: ' + e.message, 'error');
    }
  },

  generate: function() {
    var text = U.$('quiz-text') && U.$('quiz-text').value.trim();
    if (!text || text.length < 80) { UI.toast('النص قصير (80+)', 'error'); return; }

    var sentences = text.split(/[.؟!؟\n]+/).map(function(s) { return s.trim(); }).filter(function(s) { return s.length >= 20; });
    if (sentences.length < 3) { UI.toast('النص مش كافي', 'error'); return; }

    var allWords = {};
    sentences.forEach(function(s) {
      s.split(/\s+/).forEach(function(w) {
        w = w.replace(/[،,.!؟]/g, '');
        if (w.length >= 4) allWords[w] = true;
      });
    });
    var words = Object.keys(allWords);
    if (words.length < 4) { UI.toast('كلمات غير كافية', 'error'); return; }

    var qs = [];
    var shuffled = sentences.slice().sort(function() { return Math.random() - 0.5; });

    for (var i = 0; i < shuffled.length; i++) {
      if (qs.length >= 5) break;
      var sen = shuffled[i];
      var senWords = sen.split(/\s+/).map(function(w) { return w.replace(/[،,.!؟]/g, ''); }).filter(function(w) { return w.length >= 4; });
      if (!senWords.length) continue;
      var cw = senWords.sort(function(a, b) { return b.length - a.length; })[0];
      var idx = sen.indexOf(cw);
      if (idx === -1) continue;
      var q = (sen.slice(0, idx) + '______' + sen.slice(idx + cw.length)).trim();
      if (q.length < 15) continue;
      var distractors = words.filter(function(w) { return w !== cw; }).sort(function() { return Math.random() - 0.5; }).slice(0, 3);
      var opts = [cw].concat(distractors).sort(function() { return Math.random() - 0.5; });
      qs.push({ question: q, options: opts, correct: opts.indexOf(cw) });
    }

    if (!qs.length) { UI.toast('فشل التوليد', 'error'); return; }

    QuizState.questions = qs;
    QuizState.answers = new Array(qs.length).fill(null);
    QuizState.current = 0;
    U.$('quiz-setup').style.display = 'none';
    U.$('quiz-display').style.display = 'block';
    U.$('quiz-result').style.display = 'none';
    this.renderQuestion();
  },

  renderQuestion: function() {
    var q = QuizState.questions[QuizState.current];
    var total = QuizState.questions.length;
    var pct = Math.round((QuizState.current / total) * 100);
    U.$('q-cur').textContent = QuizState.current + 1;
    U.$('q-tot').textContent = total;
    U.$('q-percent').textContent = pct + '%';
    U.$('q-prog').style.width = pct + '%';
    var ans = QuizState.answers[QuizState.current];
    var html = '<div class="card" style="margin-bottom:16px">' +
      '<div style="font-size:11px;color:var(--brand);font-weight:800;margin-bottom:10px">السؤال ' + (QuizState.current + 1) + '</div>' +
      '<div style="font-size:16px;font-weight:800;margin-bottom:16px;line-height:1.6">' + U.esc(q.question) + '</div>';
    q.options.forEach(function(opt, i) {
      html += '<button class="quiz-option ' + (ans === i ? 'selected' : '') + '" onclick="Quiz.pick(' + i + ')">' + String.fromCharCode(65 + i) + '. ' + U.esc(opt) + '</button>';
    });
    html += '</div>';
    html += '<button class="btn btn-block" ' + (ans === null ? 'disabled' : '') + ' onclick="Quiz.next()">' + (QuizState.current < total - 1 ? 'التالي' : 'النتيجة') + '</button>';
    U.$('quiz-q').innerHTML = html;
  },

  pick: function(i) {
    QuizState.answers[QuizState.current] = i;
    this.renderQuestion();
  },

  next: function() {
    if (QuizState.answers[QuizState.current] === null) return;
    if (QuizState.current < QuizState.questions.length - 1) {
      QuizState.current++;
      this.renderQuestion();
    } else {
      this.showResult();
    }
  },

  showResult: function() {
    var score = 0;
    QuizState.questions.forEach(function(q, i) {
      if (QuizState.answers[i] === q.correct) score++;
    });
    var pct = Math.round((score / QuizState.questions.length) * 100);
    var emoji = pct >= 80 ? '🎉' : pct >= 50 ? '👍' : '📚';

    var hist = [];
    try { hist = JSON.parse(localStorage.getItem('itqan_quizHistory') || '[]'); } catch(e) {}
    hist.unshift({ date: Date.now(), score: score, total: QuizState.questions.length, percent: pct });
    if (hist.length > 50) hist.length = 50;
    try { localStorage.setItem('itqan_quizHistory', JSON.stringify(hist)); } catch(e) {}

    Session.addXP(score * 5);

    U.$('quiz-display').style.display = 'none';
    U.$('quiz-result').style.display = 'block';
    U.$('quiz-result').innerHTML = '<div class="card quiz-result">' +
      '<div class="quiz-result-emoji">' + emoji + '</div>' +
      '<div class="quiz-result-score">' + score + ' / ' + QuizState.questions.length + '</div>' +
      '<div class="quiz-result-percent">' + pct + '%</div>' +
      '<p style="color:var(--text-2);margin-bottom:20px;font-weight:700">تم حفظ النتيجة</p>' +
      '<button class="btn btn-block" onclick="Quiz.reset()">اختبار جديد</button>' +
      '</div>';
  },

  reset: function() {
    QuizState.questions = [];
    QuizState.answers = [];
    QuizState.current = 0;
    U.$('quiz-setup').style.display = 'block';
    U.$('quiz-display').style.display = 'none';
    U.$('quiz-result').style.display = 'none';
  }
};
window.Quiz = Quiz;

function CardsScreen() {

var Cards = {
  loadTemplate: function(name) {
    var t = TEMPLATES[name];
    if (!t) return;
    FlashState.cards = t.map(function(c) { return { front: c.front, back: c.back, known: false }; });
    FlashState.index = 0;
    U.$('cards-setup').style.display = 'none';
    U.$('cards-display').style.display = 'block';
    this.renderCard();
    UI.toast(t.length + ' بطاقة', 'success');
  },

  generateFromText: function() {
    var textarea = U.$('cards-input-text');
    if (!textarea) return;
    var text = textarea.value.trim();
    if (!text || text.length < 100) { UI.toast('النص قصير (100+)', 'error'); return; }

    var sentences = text.split(/[.؟!؟\n]+/).map(function(s) { return s.trim(); }).filter(function(s) { return s.length >= 20; });
    if (sentences.length < 3) { UI.toast('محتاج 3 جمل على الأقل', 'error'); return; }

    var cards = [];
    var used = {};

    for (var i = 0; i < sentences.length; i++) {
      if (cards.length >= 15) break;
      var sen = sentences[i];
      var words = sen.split(/\s+/).map(function(w) { return w.replace(/[،,.!؟]/g, ''); }).filter(function(w) { return w.length >= 4; });
      if (!words.length) continue;
      words.sort(function(a, b) { return b.length - a.length; });
      var keyword = words[0];
      if (used[keyword]) continue;
      used[keyword] = true;
      cards.push({ front: 'ما معنى: ' + keyword + '؟', back: sen, known: false });
    }

    if (cards.length < 3) { UI.toast('فشل التوليد', 'error'); return; }

    FlashState.cards = cards;
    FlashState.index = 0;
    U.$('cards-setup').style.display = 'none';
    U.$('cards-display').style.display = 'block';
    this.renderCard();
    UI.toast(cards.length + ' بطاقة', 'success');
  },

  renderCard: function() {
    if (!FlashState.cards.length) return;
    var c = FlashState.cards[FlashState.index];
    U.$('fc-front').textContent = c.front;
    U.$('fc-back').textContent = c.back;
    U.$('fc-inner').style.transform = 'rotateY(0)';
    U.$('card-cur').textContent = FlashState.index + 1;
    U.$('card-tot').textContent = FlashState.cards.length;
    var known = FlashState.cards.filter(function(x) { return x.known; }).length;
    U.$('card-known').textContent = known;
  },

  flip: function() {
    var inner = U.$('fc-inner');
    inner.style.transform = inner.style.transform === 'rotateY(180deg)' ? 'rotateY(0)' : 'rotateY(180deg)';
  },

  review: function(known) {
    if (!FlashState.cards.length) return;
    FlashState.cards[FlashState.index].known = known;
    if (known) Session.addXP(1);
    this.next();
  },

  next: function() {
    if (FlashState.index < FlashState.cards.length - 1) {
      FlashState.index++;
      this.renderCard();
    } else {
      var known = FlashState.cards.filter(function(c) { return c.known; }).length;
      UI.toast('عرفت ' + known + ' من ' + FlashState.cards.length, 'success', 4000);
    }
  },

  prev: function() {
    if (FlashState.index > 0) {
      FlashState.index--;
      this.renderCard();
    }
  }
};
window.Cards = Cards;

var Profile = {
  edit: function() {
    var s = App.state.user;
    UI.modal({
      title: 'تعديل الملف',
      content: '<div class="field"><label>الاسم</label>' +
        '<input class="input" type="text" id="ep-name" value="' + U.esc(s.name) + '" maxlength="40"></div>' +
        '<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px">' +
        '<button class="btn btn-secondary" onclick="App.ui.closeAll()">إلغاء</button>' +
        '<button class="btn" onclick="Profile.save()">حفظ</button>' +
        '</div>'
    });
  },

  save: async function() {
    var name = U.$('ep-name').value.trim();
    if (!name || name.length < 2) { UI.toast('الاسم قصير', 'error'); return; }
    App.state.user.name = name;
    try { localStorage.setItem('itqan_session', JSON.stringify(App.state.user)); } catch(e) {}
    if (window.db && App.state.user.uid && App.state.user.uid.indexOf('guest') !== 0) {
      await window.db.ref('users/' + App.state.user.uid + '/name').set(name).catch(function() {});
    }
    UI.closeAll();
    UI.toast('تم الحفظ', 'success');
    Router.go('profile');
  },

  uploadAvatar: function() {
    var input = document.createElement('input');
    input.type = 'file';
    input.accept = 'image/*';
    input.onchange = function(e) {
      var file = e.target.files[0];
      if (!file) return;
      if (file.size > 5 * 1024 * 1024) { UI.toast('الصورة كبيرة (5MB max)', 'error'); return; }

      UI.toast('جاري المعالجة...', 'info', 1500);

      var img = new Image();
      var reader = new FileReader();
      reader.onload = function(ev) {
        img.onload = function() {
          var size = 200;
          var canvas = document.createElement('canvas');
          canvas.width = size;
          canvas.height = size;
          var ctx = canvas.getContext('2d');
          var minDim = Math.min(img.width, img.height);
          var sx = (img.width - minDim) / 2;
          var sy = (img.height - minDim) / 2;
          ctx.drawImage(img, sx, sy, minDim, minDim, 0, 0, size, size);

          var dataUrl = canvas.toDataURL('image/jpeg', 0.85);
          App.state.user.avatar = dataUrl;
          try { localStorage.setItem('itqan_session', JSON.stringify(App.state.user)); } catch(e) {}

          if (window.db && App.state.user.uid && App.state.user.uid.indexOf('guest') !== 0) {
            window.db.ref('users/' + App.state.user.uid + '/avatar').set(dataUrl).catch(function() {});
          }

          UI.toast('✅ تم تحديث الصورة', 'success');
          Router.go('profile');
        };
        img.onerror = function() { UI.toast('فشل تحميل الصورة', 'error'); };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    };
    input.click();
  },

  logout: function() {
    UI.confirm('تسجيل الخروج', 'هل تريد الخروج؟').then(function(ok) {
      if (!ok) return;
      Session.clear();
      UI.toast('تم الخروج', 'info');
      setTimeout(function() { Router.go('auth'); }, 200);
    });
  }
};
window.Profile = Profile;

var Admin = {
  loadStats: async function() {
    if (!window.db) return;
    try {
      var users = (await window.db.ref('users').once('value')).val() || {};
      var roomsMeta = (await window.db.ref('roomsMeta').once('value')).val() || {};
      var rooms = (await window.db.ref('rooms').once('value')).val() || {};

      var msgCount = 0;
      var onlineCount = 0;
      Object.keys(rooms).forEach(function(code) {
        var r = rooms[code];
        if (r.messages) msgCount += Object.keys(r.messages).length;
        if (r.users) onlineCount += Object.keys(r.users).length;
      });

      var setEl = function(id, val) {
        var el = U.$(id);
        if (el) el.textContent = val;
      };
      setEl('as-users', Object.keys(users).length);
      setEl('as-online', onlineCount);
      setEl('as-rooms', Object.keys(roomsMeta).length);
      setEl('as-msgs', msgCount);
    } catch(e) { console.error(e); }
  },

  tab: function(name, btn) {
    document.querySelectorAll('.admin-tab').forEach(function(t) { t.classList.remove('active'); });
    if (btn) btn.classList.add('active');
    AdminState.tab = name;
    this.loadTab(name);
  },

  loadTab: function(name) {
    var content = U.$('admin-content');
    if (!content) return;
    content.innerHTML = '<div class="admin-loading">⏳ جاري التحميل...</div>';
    this.loadStats();

    switch (name) {
      case 'users': this.loadUsers(); break;
      case 'rooms': this.loadRooms(); break;
      case 'messages': this.showMsgTab(); break;
      case 'broadcast': this.showBroadcast(); break;
      case 'danger': this.showDanger(); break;
    }
  },

  loadUsers: async function() {
    var content = U.$('admin-content');
    try {
      var snap = await window.db.ref('users').once('value');
      var users = snap.val() || {};
      var entries = Object.keys(users).map(function(uid) {
        return { uid: uid, data: users[uid] };
      }).sort(function(a, b) {
        return (b.data.createdAt || 0) - (a.data.createdAt || 0);
      });

      if (!entries.length) {
        content.innerHTML = '<div class="admin-empty">لا مستخدمين</div>';
        return;
      }

      content.innerHTML = '<div style="font-size:11px;color:var(--text3);margin-bottom:8px;font-weight:700">إجمالي: ' + entries.length + '</div>' +
        entries.map(function(item) {
          var u = item.data;
          var uid = item.uid;
          var isDev = u.role === 'developer';
          var isGuest = uid.indexOf('guest') === 0;
          var isBanned = u.banned === true;
          var badges = '';
          if (isDev) badges += ' 👑';
          if (isGuest) badges += ' 👤';
          if (isBanned) badges += ' 🚫';

          return '<div class="admin-item">' +
            '<div class="admin-item-info">' +
            '<div class="admin-item-name">' + U.esc(u.name || '?') + badges + '</div>' +
            '<div class="admin-item-meta">' + U.esc(u.email || '—') + ' • Lv.' + (u.level || 1) + '</div>' +
            '</div>' +
            '<button class="admin-btn ' + (isBanned ? 'admin-btn-info' : 'admin-btn-warning') + '" onclick="Admin.' + (isBanned ? 'unban' : 'ban') + '(\'' + uid + '\')">' + (isBanned ? '✅' : '🚫') + '</button>' +
            '<button class="admin-btn admin-btn-danger" onclick="Admin.delUser(\'' + uid + '\',\'' + U.esc(u.name || '') + '\')">🗑</button>' +
            '</div>';
        }).join('');
    } catch(e) {
      content.innerHTML = '<div class="admin-empty">فشل: ' + e.message + '</div>';
    }
  },

  ban: function(uid) {
    UI.confirm('حظر', 'حظر هذا المستخدم؟').then(function(ok) {
      if (!ok) return;
      window.db.ref('users/' + uid).update({ banned: true, bannedAt: Date.now() })
        .then(function() { UI.toast('تم الحظر', 'success'); Admin.loadUsers(); });
    });
  },

  unban: function(uid) {
    window.db.ref('users/' + uid).update({ banned: false })
      .then(function() { UI.toast('تم فك الحظر', 'success'); Admin.loadUsers(); });
  },

  delUser: function(uid, name) {
    UI.confirm('حذف', 'حذف "' + name + '"؟').then(function(ok) {
      if (!ok) return;
      window.db.ref('users/' + uid).remove()
        .then(function() { UI.toast('تم الحذف', 'success'); Admin.loadUsers(); Admin.loadStats(); });
    });
  },

  loadRooms: async function() {
    var content = U.$('admin-content');
    try {
      var meta = (await window.db.ref('roomsMeta').once('value')).val() || {};
      var rooms = (await window.db.ref('rooms').once('value')).val() || {};
      var codes = Object.keys(meta);

      if (!codes.length) { content.innerHTML = '<div class="admin-empty">لا غرف</div>'; return; }

      content.innerHTML = codes.map(function(code) {
        var r = meta[code];
        var data = rooms[code] || {};
        var msgs = data.messages ? Object.keys(data.messages).length : 0;
        var users = data.users ? Object.keys(data.users).length : 0;
        var isPrivate = !!r.password;

        return '<div class="admin-item">' +
          '<div class="admin-item-info">' +
          '<div class="admin-item-name">' + U.esc(r.name || code) + (isPrivate ? ' 🔒' : ' 🌍') + '</div>' +
          '<div class="admin-item-meta">' + U.esc(code) + ' • 💬 ' + msgs + ' • 👥 ' + users + '</div>' +
          '</div>' +
          '<button class="admin-btn admin-btn-info" onclick="Admin.enterRoom(\'' + U.esc(code) + '\')">دخول</button>' +
          '<button class="admin-btn admin-btn-warning" onclick="Admin.clearRoom(\'' + U.esc(code) + '\')">🧹</button>' +
          '<button class="admin-btn admin-btn-danger" onclick="Admin.delRoom(\'' + U.esc(code) + '\',\'' + U.esc(r.name || code) + '\')">🗑</button>' +
          '</div>';
      }).join('');
    } catch(e) {
      content.innerHTML = '<div class="admin-empty">فشل</div>';
    }
  },

  enterRoom: function(code) {
    if (window.ChatState) {
      window.ChatState.room = code;
    }
    Router.go('chat');
  },

  clearRoom: function(code) {
    UI.confirm('مسح', 'مسح رسائل ' + code + '؟').then(function(ok) {
      if (!ok) return;
      window.db.ref('rooms/' + code + '/messages').remove()
        .then(function() { UI.toast('تم المسح', 'success'); Admin.loadRooms(); Admin.loadStats(); });
    });
  },

  delRoom: function(code, name) {
    UI.confirm('حذف', 'حذف غرفة "' + name + '"؟').then(function(ok) {
      if (!ok) return;
      Promise.all([
        window.db.ref('rooms/' + code).remove(),
        window.db.ref('roomsMeta/' + code).remove()
      ]).then(function() { UI.toast('تم الحذف', 'success'); Admin.loadRooms(); Admin.loadStats(); });
    });
  },

  showMsgTab: async function() {
    var content = U.$('admin-content');
    try {
      var meta = (await window.db.ref('roomsMeta').once('value')).val() || {};
      var codes = Object.keys(meta);
      if (!codes.length) { content.innerHTML = '<div class="admin-empty">لا غرف</div>'; return; }

      content.innerHTML = '<select class="input" style="margin-bottom:12px;font-weight:700" onchange="Admin.loadMsgs(this.value)">' +
        '<option value="">-- اختر غرفة --</option>' +
        codes.map(function(c) { return '<option value="' + U.esc(c) + '">' + U.esc(meta[c].name || c) + '</option>'; }).join('') +
        '</select>' +
        '<div id="admin-msg-list"><div class="admin-empty">اختر غرفة</div></div>';
    } catch(e) { content.innerHTML = '<div class="admin-empty">فشل</div>'; }
  },

  loadMsgs: async function(code) {
    var list = U.$('admin-msg-list');
    if (!list || !code) return;
    list.innerHTML = '<div class="admin-loading">⏳...</div>';
    try {
      var snap = await window.db.ref('rooms/' + code + '/messages').limitToLast(50).once('value');
      var msgs = snap.val() || {};
      var keys = Object.keys(msgs).sort(function(a, b) { return (msgs[a].timestamp || 0) - (msgs[b].timestamp || 0); });

      if (!keys.length) { list.innerHTML = '<div class="admin-empty">لا رسائل</div>'; return; }

      list.innerHTML = keys.map(function(k) {
        var m = msgs[k];
        var text = m.type === 'image' ? '📷 صورة' : m.type === 'audio' ? '🎤 صوت' : (m.text || '').slice(0, 60);
        return '<div class="admin-item">' +
          '<div class="admin-item-info">' +
          '<div class="admin-item-name">' + U.esc(m.name || '?') + '</div>' +
          '<div class="admin-item-meta">' + U.esc(text) + '</div>' +
          '</div>' +
          '<button class="admin-btn admin-btn-danger" onclick="Admin.delMsg(\'' + code + '\',\'' + k + '\')">🗑</button>' +
          '</div>';
      }).join('');
    } catch(e) { list.innerHTML = '<div class="admin-empty">فشل</div>'; }
  },

  delMsg: function(room, id) {
    window.db.ref('rooms/' + room + '/messages/' + id).remove()
      .then(function() { Admin.loadMsgs(room); Admin.loadStats(); });
  },

  showBroadcast: function() {
    var content = U.$('admin-content');
    content.innerHTML = '<div class="field"><label>العنوان</label>' +
      '<input class="input" id="bc-title" placeholder="عنوان الإشعار"></div>' +
      '<div class="field"><label>الرسالة</label>' +
      '<textarea class="textarea" id="bc-body" rows="4" placeholder="نص الإشعار"></textarea></div>' +
      '<button class="btn btn-block" onclick="Admin.sendBroadcast()">📤 إرسال</button>';
  },

  sendBroadcast: async function() {
    var title = U.$('bc-title').value.trim();
    var body = U.$('bc-body').value.trim();
    if (!title || !body) { UI.toast('املأ الحقول', 'error'); return; }
    try {
      await window.db.ref('broadcast').set({
        title: title,
        body: body,
        from: App.state.user.name,
        timestamp: Date.now()
      });
      UI.toast('تم الإرسال', 'success');
      U.$('bc-title').value = '';
      U.$('bc-body').value = '';
    } catch(e) { UI.toast('خطأ: ' + e.message, 'error'); }
  },

  showDanger: function() {
    var content = U.$('admin-content');
    content.innerHTML = '<div style="background:var(--red-50);border:2px solid var(--red-600);border-radius:12px;padding:18px">' +
      '<div style="color:var(--red-600);font-weight:800;font-size:14px;margin-bottom:14px">⚠️ عمليات خطيرة</div>' +
      '<button class="btn btn-danger btn-block" style="margin-bottom:8px" onclick="Admin.dClearMsgs()">🗑 مسح كل رسائل الغرف</button>' +
      '<button class="btn btn-danger btn-block" style="margin-bottom:8px" onclick="Admin.dClearRooms()">🏘️ مسح كل الغرف (ما عدا GENERAL)</button>' +
      '<button class="btn btn-danger btn-block" onclick="Admin.dClearGuests()">👤 مسح كل الضيوف</button>' +
      '</div>';
  },

  dClearMsgs: function() {
    if (!confirm('مسح كل رسائل الغرف؟')) return;
    if (!confirm('متأكد 100%؟')) return;
    window.db.ref('rooms').once('value').then(function(snap) {
      var rooms = snap.val() || {};
      var promises = [];
      Object.keys(rooms).forEach(function(code) {
        if (rooms[code].messages) promises.push(window.db.ref('rooms/' + code + '/messages').remove());
      });
      return Promise.all(promises);
    }).then(function() { UI.toast('تم المسح', 'success'); Admin.loadStats(); });
  },

  dClearRooms: function() {
    if (!confirm('مسح كل الغرف (ما عدا GENERAL)؟')) return;
    window.db.ref('roomsMeta').once('value').then(function(snap) {
      var meta = snap.val() || {};
      var promises = [];
      Object.keys(meta).forEach(function(code) {
        if (code !== 'GENERAL') {
          promises.push(window.db.ref('rooms/' + code).remove());
          promises.push(window.db.ref('roomsMeta/' + code).remove());
        }
      });

  }, 3000);
}

// ═══════════════════════════════════════════════════════
// 5) AdminPanel — كل الدوال
// ═══════════════════════════════════════════════════════
var AdminPanel = {
  currentTab: 'users',
  
  open: function() {
    if (!isAdmin()) {
      toast('❌ للأدمن فقط', 'error');
      return;
    }
    if (!ensureFirebase()) {
      toast('❌ Firebase مش متصل', 'error');
      return;
    }
    
    var overlay = document.getElementById('admin-panel-overlay');
    if (overlay) overlay.classList.add('show');
    
    this.loadStats();
    this.tab('users');
  },
  
  close: function() {
    var overlay = document.getElementById('admin-panel-overlay');
    if (overlay) overlay.classList.remove('show');
  },
  
  loadStats: async function() {
    if (!window.db) return;
    
    try {
      var users = (await window.db.ref('users').once('value')).val() || {};
      var roomsMeta = (await window.db.ref('roomsMeta').once('value')).val() || {};
      var rooms = (await window.db.ref('rooms').once('value')).val() || {};
      
      var msgCount = 0;
      var onlineCount = 0;
      
      Object.keys(rooms).forEach(function(code) {
        var r = rooms[code];
        if (r.messages) msgCount += Object.keys(r.messages).length;
        if (r.users) onlineCount += Object.keys(r.users).length;
      });
      
      var set = function(id, val) {
        var el = document.getElementById(id);
        if (el) el.textContent = val;
      };
      
      set('admin-num-users', Object.keys(users).length);
      set('admin-num-online', onlineCount);
      set('admin-num-rooms', Object.keys(roomsMeta).length);
      set('admin-num-msgs', msgCount);
      
    } catch(e) {
      console.error('Stats error:', e);
    }
  },
  
  tab: function(name, btn) {
    document.querySelectorAll('.admin-tab-btn').forEach(function(t) {
      t.classList.remove('active');
    });
    if (btn) btn.classList.add('active');
    
    this.currentTab = name;
    var content = document.getElementById('admin-panel-content');
    if (!content) return;
    content.innerHTML = '<div class="admin-loading-state">⏳ جاري التحميل...</div>';
    
    var self = this;
    switch(name) {
      case 'users': this.loadUsers(); break;
      case 'rooms': this.loadRooms(); break;
      case 'messages': this.showMessagesTab(); break;
      case 'broadcast': this.showBroadcast(); break;
      case 'danger': this.showDanger(); break;
    }
  },
  
  // ═══ المستخدمون ═══
  loadUsers: async function() {
    var content = document.getElementById('admin-panel-content');
    if (!content) return;
    
    try {
      var snap = await window.db.ref('users').once('value');
      var users = snap.val() || {};
      var entries = Object.keys(users).map(function(uid) {
        return { uid: uid, data: users[uid] };
      }).sort(function(a, b) {
        return (b.data.createdAt || 0) - (a.data.createdAt || 0);
      });
      
      if (!entries.length) {
        content.innerHTML = '<div class="admin-empty-state">لا مستخدمين</div>';
        return;
      }
      
      content.innerHTML = entries.map(function(item) {
        var u = item.data;
        var uid = item.uid;
        var isDev = u.role === 'developer';
        var isGuest = uid.indexOf('guest') === 0;
        var isBanned = u.banned === true;
        var badges = '';
        if (isDev) badges += ' 👑';
        if (isGuest) badges += ' 👤';
        if (isBanned) badges += ' 🚫';
        
        return '<div class="admin-user-row">' +
          '<div class="admin-user-info">' +
          '<div class="admin-user-name">' + (u.name || '?') + badges + '</div>' +
          '<div class="admin-user-meta">' + (u.email || '—') + ' • Lv.' + (u.level || 1) + '</div>' +
          '</div>' +
          '<button class="admin-act-btn ' + (isBanned ? 'admin-act-info' : 'admin-act-warning') + '" onclick="AdminPanel.' + (isBanned ? 'unban' : 'ban') + '(\'' + uid + '\')">' + (isBanned ? '✅' : '🚫') + '</button>' +
          '<button class="admin-act-btn admin-act-danger" onclick="AdminPanel.delUser(\'' + uid + '\',\'' + (u.name || '').replace(/'/g, '') + '\')">🗑</button>' +
          '</div>';
      }).join('');
      
    } catch(e) {
      content.innerHTML = '<div class="admin-empty-state">فشل: ' + e.message + '</div>';
    }
  },
  
  ban: function(uid) {
    if (!confirm('حظر هذا المستخدم؟')) return;
    window.db.ref('users/' + uid).update({ banned: true, bannedAt: Date.now() })
      .then(function() {
        toast('✅ تم الحظر', 'success');
        AdminPanel.loadUsers();
        AdminPanel.loadStats();
      })
      .catch(function(e) { toast('❌ ' + e.message, 'error'); });
  },
  
  unban: function(uid) {
    window.db.ref('users/' + uid).update({ banned: false })
      .then(function() {
        toast('✅ تم فك الحظر', 'success');
        AdminPanel.loadUsers();
      })
      .catch(function(e) { toast('❌ ' + e.message, 'error'); });
  },
  
  delUser: function(uid, name) {
    if (!confirm('حذف "' + name + '" نهائياً؟')) return;
    if (!confirm('متأكد 100%؟')) return;
    window.db.ref('users/' + uid).remove()
      .then(function() {
        toast('✅ تم الحذف', 'success');
        AdminPanel.loadUsers();
        AdminPanel.loadStats();
      })
      .catch(function(e) { toast('❌ ' + e.message, 'error'); });
  },
  
  // ═══ الغرف ═══
  loadRooms: async function() {
    var content = document.getElementById('admin-panel-content');
    if (!content) return;
    
    try {
      var meta = (await window.db.ref('roomsMeta').once('value')).val() || {};
      var rooms = (await window.db.ref('rooms').once('value')).val() || {};
      var codes = Object.keys(meta);
      
      if (!codes.length) {
        content.innerHTML = '<div class="admin-empty-state">لا غرف</div>';
        return;
      }
      
      content.innerHTML = codes.map(function(code) {
        var r = meta[code];
        var data = rooms[code] || {};
        var msgs = data.messages ? Object.keys(data.messages).length : 0;
        var users = data.users ? Object.keys(data.users).length : 0;
        var isPrivate = !!r.password;
        
        return '<div class="admin-room-row">' +
          '<div class="admin-room-info">' +
          '<div class="admin-room-name">' + (r.name || code) + (isPrivate ? ' 🔒' : ' 🌍') + '</div>' +
          '<div class="admin-room-meta">' + code + ' • 💬 ' + msgs + ' • 👥 ' + users + '</div>' +
          '</div>' +
          '<button class="admin-act-btn admin-act-warning" onclick="AdminPanel.clearRoom(\'' + code + '\')">🧹</button>' +
          '<button class="admin-act-btn admin-act-danger" onclick="AdminPanel.delRoom(\'' + code + '\',\'' + (r.name || code).replace(/'/g, '') + '\')">🗑</button>' +
          '</div>';
      }).join('');
      
    } catch(e) {
      content.innerHTML = '<div class="admin-empty-state">فشل: ' + e.message + '</div>';
    }
  },
  
  clearRoom: function(code) {
    if (!confirm('مسح رسائل ' + code + '؟')) return;
    window.db.ref('rooms/' + code + '/messages').remove()
      .then(function() {
        toast('✅ تم المسح', 'success');
        AdminPanel.loadRooms();
        AdminPanel.loadStats();
      })
      .catch(function(e) { toast('❌ ' + e.message, 'error'); });
  },
  
  delRoom: function(code, name) {
    if (!confirm('حذف غرفة "' + name + '"؟')) return;
    Promise.all([
      window.db.ref('rooms/' + code).remove(),
      window.db.ref('roomsMeta/' + code).remove()
    ]).then(function() {
      toast('✅ تم الحذف', 'success');
      AdminPanel.loadRooms();
      AdminPanel.loadStats();
    }).catch(function(e) { toast('❌ ' + e.message, 'error'); });
  },
  
  // ═══ الرسائل ═══
  showMessagesTab: async function() {
    var content = document.getElementById('admin-panel-content');
    if (!content) return;
    
    try {
      var meta = (await window.db.ref('roomsMeta').once('value')).val() || {};
      var codes = Object.keys(meta);
      
      if (!codes.length) {
        content.innerHTML = '<div class="admin-empty-state">لا غرف</div>';
        return;
      }
      
      var options = codes.map(function(c) {
        return '<option value="' + c + '">' + (meta[c].name || c) + '</option>';
      }).join('');
      
      content.innerHTML = 
        '<select style="width:100%;padding:10px;border-radius:8px;border:1px solid #E5E7EB;font-family:inherit;font-size:14px;font-weight:700;margin-bottom:12px" onchange="AdminPanel.loadMsgs(this.value)">' +
        '<option value="">-- اختر غرفة --</option>' + options +
        '</select>' +
        '<div id="admin-msgs-list"><div class="admin-empty-state">اختر غرفة</div></div>';
      
    } catch(e) {
      content.innerHTML = '<div class="admin-empty-state">فشل</div>';
    }
  },
  
  loadMsgs: async function(code) {
    var list = document.getElementById('admin-msgs-list');
    if (!list || !code) return;
    list.innerHTML = '<div class="admin-loading-state">⏳...</div>';
    
    try {
      var snap = await window.db.ref('rooms/' + code + '/messages').limitToLast(50).once('value');
      var msgs = snap.val() || {};
      var keys = Object.keys(msgs).sort(function(a, b) {
        return (msgs[a].timestamp || 0) - (msgs[b].timestamp || 0);
      });
      
      if (!keys.length) {
        list.innerHTML = '<div class="admin-empty-state">لا رسائل</div>';
        return;
      }
      
      list.innerHTML = keys.map(function(k) {
        var m = msgs[k];
        var text = m.type === 'image' ? '📷 صورة' : m.type === 'audio' ? '🎤 صوت' : (m.text || '').slice(0, 60);
        return '<div class="admin-msg-row">' +
          '<div class="admin-msg-info">' +
          '<div class="admin-msg-name">' + (m.name || '?') + '</div>' +
          '<div class="admin-msg-meta">' + text + '</div>' +
          '</div>' +
          '<button class="admin-act-btn admin-act-danger" onclick="AdminPanel.delMsg(\'' + code + '\',\'' + k + '\')">🗑</button>' +
          '</div>';
      }).join('');
      
    } catch(e) {
      list.innerHTML = '<div class="admin-empty-state">فشل</div>';
    }
  },
  
  delMsg: function(room, id) {
    window.db.ref('rooms/' + room + '/messages/' + id).remove()
      .then(function() {
        AdminPanel.loadMsgs(room);
        AdminPanel.loadStats();
      });
  },
  
  // ═══ البث ═══
  showBroadcast: function() {
    var content = document.getElementById('admin-panel-content');
    if (!content) return;
    
    content.innerHTML = 
      '<div style="margin-bottom:12px">' +
      '<label style="font-size:13px;font-weight:700;display:block;margin-bottom:6px">العنوان</label>' +
      '<input id="bc-title" style="width:100%;padding:10px;border-radius:8px;border:1px solid #E5E7EB;font-family:inherit;font-size:14px;margin-bottom:12px" placeholder="عنوان الإشعار">' +
      '<label style="font-size:13px;font-weight:700;display:block;margin-bottom:6px">الرسالة</label>' +
      '<textarea id="bc-body" rows="4" style="width:100%;padding:10px;border-radius:8px;border:1px solid #E5E7EB;font-family:inherit;font-size:14px;resize:vertical" placeholder="نص الإشعار"></textarea>' +
      '</div>' +
      '<button onclick="AdminPanel.sendBroadcast()" style="width:100%;padding:12px;border-radius:8px;background:#059669;color:white;border:none;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit">📤 إرسال</button>';
  },
  
  sendBroadcast: async function() {
    var title = document.getElementById('bc-title').value.trim();
    var body = document.getElementById('bc-body').value.trim();
    
    if (!title || !body) {
      toast('❌ املأ الحقول', 'error');
      return;
    }
    
    try {
      await window.db.ref('broadcast').set({
        title: title,
        body: body,
        from: 'admin',
        timestamp: Date.now()
      });
      toast('✅ تم الإرسال', 'success');
      document.getElementById('bc-title').value = '';
      document.getElementById('bc-body').value = '';
    } catch(e) {
      toast('❌ ' + e.message, 'error');
    }
  },
  
  // ═══ الخطر ═══
  showDanger: function() {
    var content = document.getElementById('admin-panel-content');
    if (!content) return;
    
    content.innerHTML = 
      '<div style="background:#FEF2F2;border:2px solid #DC2626;border-radius:12px;padding:16px">' +
      '<div style="color:#DC2626;font-weight:800;font-size:14px;margin-bottom:14px">⚠️ عمليات خطيرة</div>' +
      '<button onclick="AdminPanel.dClearMsgs()" style="width:100%;padding:12px;border-radius:8px;background:#DC2626;color:white;border:none;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit;margin-bottom:8px">🗑 مسح كل رسائل الغرف</button>' +
      '<button onclick="AdminPanel.dClearRooms()" style="width:100%;padding:12px;border-radius:8px;background:#DC2626;color:white;border:none;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit;margin-bottom:8px">🏘️ مسح كل الغرف (ما عدا GENERAL)</button>' +
      '<button onclick="AdminPanel.dClearGuests()" style="width:100%;padding:12px;border-radius:8px;background:#DC2626;color:white;border:none;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit">👤 مسح كل الضيوف</button>' +
      '</div>';
  },
  
  dClearMsgs: function() {
    if (!confirm('مسح كل رسائل الغرف؟')) return;
    if (!confirm('متأكد 100%؟')) return;
    
    window.db.ref('rooms').once('value').then(function(snap) {
      var rooms = snap.val() || {};
      var promises = [];
      Object.keys(rooms).forEach(function(code) {
        if (rooms[code].messages) {
          promises.push(window.db.ref('rooms/' + code + '/messages').remove());
        }
      });
      return Promise.all(promises);
    }).then(function() {
      toast('✅ تم المسح', 'success');
      AdminPanel.loadStats();
    });
  },
  
  dClearRooms: function() {
    if (!confirm('مسح كل الغرف (ما عدا GENERAL)؟')) return;
    
    window.db.ref('roomsMeta').once('value').then(function(snap) {
      var meta = snap.val() || {};
      var promises = [];
      Object.keys(meta).forEach(function(code) {
        if (code !== 'GENERAL') {
          promises.push(window.db.ref('rooms/' + code).remove());
          promises.push(window.db.ref('roomsMeta/' + code).remove());
        }
      });
      return Promise.all(promises);
    }).then(function() {
      toast('✅ تم المسح', 'success');
      AdminPanel.loadStats();
    });
  },
  
  dClearGuests: function() {
    if (!confirm('مسح كل الضيوف؟')) return;
    
    window.db.ref('users').once('value').then(function(snap) {
      var users = snap.val() || {};
      var promises = [];
      Object.keys(users).forEach(function(uid) {
        if (uid.indexOf('guest') === 0) {
          promises.push(window.db.ref('users/' + uid).remove());
        }
      });
      return Promise.all(promises);
    }).then(function() {
      toast('✅ تم المسح', 'success');
      AdminPanel.loadStats();
    });
  }
};

window.AdminPanel = AdminPanel;

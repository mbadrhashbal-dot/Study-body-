const INDEX = {};
KB.forEach(entry => {
  entry.k.forEach(k => {
    const key = k.toLowerCase();
    if (!INDEX[key]) INDEX[key] = [];
    INDEX[key].push(entry);
  });
});

const STOP = new Set(['في','من','على','إلى','عن','مع','هذا','هذه','ذلك','التي','الذي','كان','كانت','يكون','أن','إن','لا','ما','هل','قد','كل','بعض','بعد','قبل','بين','حيث','لكن','أو','و','ثم','هو','هي','هم','نحن','أنا','أنت','كما','حتى','عند','عندما','إذا','لأن','هناك','عليه','إليه','لها','له','بها','به','منها','منه','أيضا','فيه','فيها','جميع','تم','يتم','غير','وهو','وهي','the','is','a','an','of','to','in','and','or','for']);

function normalize(s) {
  return String(s || '').toLowerCase()
    .replace(/[أإآٱ]/g, 'ا').replace(/ى/g, 'ي').replace(/ة/g, 'ه')
    .replace(/[؟?،,؛;]/g, ' ').replace(/[×✕]/g, '*').replace(/÷/g, '/')
    .replace(/\s+/g, ' ').trim();
}

function tokenize(s) { return normalize(s).split(' ').filter(w => w.length > 1 && !STOP.has(w)); }

function similarity(a, b) {
  if (a === b) return 1;
  if (Math.abs(a.length - b.length) > 3) return 0;
  const s = a.length < b.length ? a : b;
  const l = a.length < b.length ? b : a;
  let m = 0;
  for (let i = 0; i < s.length; i++) if (l.includes(s[i])) m++;
  return m / l.length;
}

function search(query) {
  const tokens = tokenize(query);
  let best = null, bestScore = 0;
  tokens.forEach(tk => {
    if (INDEX[tk]) INDEX[tk].forEach(e => { if (bestScore < 1) { bestScore = 1; best = e; } });
    Object.keys(INDEX).forEach(k => {
      const sim = similarity(tk, k);
      if (sim > 0.75 && sim > bestScore) { bestScore = sim; best = INDEX[k][0]; }
    });
  });
  return bestScore >= 0.65 ? best : null;
}

function detectIntent(text) {
  const t = normalize(text);
  if (/^(مرحبا|السلام|اهلا|هلا|hi|hello)/.test(t)) return 'greeting';
  if (/شكرا|thanks/.test(t)) return 'thanks';
  if (/الفرق بين|compare/.test(t)) return 'compare';
  if (/لخص|تلخيص|summarize/.test(t)) return 'summarize';
  if (/مثال|امثله/.test(t)) return 'example';
  if (/ليه|لماذا/.test(t)) return 'why';
  if (/ازاي|كيف/.test(t)) return 'how';
  if (/نصيحه|نصائح/.test(t)) return 'tip';
  if (/\d/.test(t) && /[+\-*/%]/.test(t)) return 'math';
  return 'definition';
}

// ═══ MATH ═══
function solveMath(text) {
  const t = normalize(text);

  const m = t.match(/(\d+(?:\.\d+)?)\s*([+\-*/])\s*(\d+(?:\.\d+)?)/);
  if (m) {
    const a = parseFloat(m[1]), op = m[2], b = parseFloat(m[3]);
    let r;
    if (op === '+') r = a + b;
    else if (op === '-') r = a - b;
    else if (op === '*') r = a * b;
    else if (b === 0) r = 'غير معرّف';
    else r = +(a / b).toFixed(4);
    return `🧮 ${a} ${op} ${b} = **${r}**`;
  }

  const pct = t.match(/(\d+(?:\.\d+)?)\s*%\s*(?:من|of)\s*(\d+(?:\.\d+)?)/);
  if (pct) {
    const a = parseFloat(pct[1]), b = parseFloat(pct[2]);
    return `📊 ${a}% من ${b}\n\n**الخطوة:** (${a} ÷ 100) × ${b} = **${a * b / 100}**`;
  }

  const eq = t.match(/(\d+)\s*[xس]\s*([+\-])\s*(\d+)\s*=\s*(\d+)/);
  if (eq) {
    const a = +eq[1], op = eq[2], b = +eq[3], c = +eq[4];
    const x = op === '+' ? (c - b) / a : (c + b) / a;
    return `📐 **${a}x ${op} ${b} = ${c}**\n\n1. ننقل ${b} للطرف التاني\n2. ${a}x = ${c - b}\n3. x = ${Math.round(x * 1000) / 1000}\n\n✅ x = **${Math.round(x * 1000) / 1000}**`;
  }

  const quad = t.match(/(-?\d*\.?\d*)\s*[xس]\s*\^?\s*2\s*([+\-])\s*(-?\d*\.?\d*)\s*[xس]\s*([+\-])\s*(-?\d+\.?\d*)\s*=\s*0/);
  if (quad) {
    let a = quad[1] === '' || quad[1] === '-' ? (quad[1] === '-' ? -1 : 1) : parseFloat(quad[1]);
    const b = (quad[2] === '-' ? -1 : 1) * (quad[3] === '' ? 1 : Math.abs(parseFloat(quad[3])));
    const c = (quad[4] === '-' ? -1 : 1) * Math.abs(parseFloat(quad[5]));
    if (a === 0) return null;
    const D = b * b - 4 * a * c;
    const fmt = n => Math.round(n * 1000) / 1000;
    if (D < 0) return `📐 **${a}x² + ${b}x + ${c} = 0**\n\n❌ Δ = ${D} (سالب)\nلا توجد حلول حقيقية.`;
    if (D === 0) return `📐 **${a}x² + ${b}x + ${c} = 0**\n\nΔ = 0\n✅ x = **${fmt(-b / (2 * a))}**`;
    const sqrtD = Math.sqrt(D);
    return `📐 **${a}x² + ${b}x + ${c} = 0**\n\nΔ = ${D}\n✅ x₁ = **${fmt((-b + sqrtD) / (2 * a))}**\nx₂ = **${fmt((-b - sqrtD) / (2 * a))}**`;
  }
  return null;
}

// ═══ COMPARE ═══
function compare(text) {
  const m = text.match(/الفرق\s+بين\s+([^\s]+)\s+(?:و|و\s)([^\s]+)/);
  if (!m) return null;
  const a = search(m[1]), b = search(m[2]);
  if (!a && !b) return null;
  const parts = [`⚖️ **الفرق بين ${m[1]} و ${m[2]}:**\n`];
  if (a) { parts.push(`🔹 **${a.t}:**\n${a.d}`); if (a.e) parts.push(`📌 ${a.e}`); }
  else parts.push(`❓ **${m[1]}:** مش موجود`);
  parts.push('');
  if (b) { parts.push(`🔸 **${b.t}:**\n${b.d}`); if (b.e) parts.push(`📌 ${b.e}`); }
  else parts.push(`❓ **${m[2]}:** مش موجود`);
  return parts.join('\n');
}

// ═══ BUILD REPLY ═══
function buildReply(entry, subIntent) {
  if (subIntent === 'why' && entry.w) return `🤔 **ليه ${entry.t}؟**\n${entry.w}`;
  if (subIntent === 'example' && entry.e) return `🌟 **مثال على ${entry.t}:**\n${entry.e}`;
  if (subIntent === 'how' && entry.e) return `🔧 **إزاي ${entry.t}؟**\n${entry.e}`;
  let out = `📖 **${entry.t}:**\n${entry.d}`;
  if (entry.w) out += `\n\n💡 **ليه؟** ${entry.w}`;
  if (entry.e) out += `\n\n🌟 **مثال:** ${entry.e}`;
  if (entry.rel && entry.rel.length) {
    const related = entry.rel.filter(r => search(r));
    if (related.length) out += `\n\n🔗 **مواضيع قريبة:** ${related.slice(0, 3).join('، ')}`;
  }
  out += `\n\n_المجال: ${entry.c}_`;
  return out;
}

// ═══ MAIN AI ═══
function AI(userMessage) {
  if (!userMessage || !userMessage.trim()) return 'اكتب سؤالك 😊';
  const intent = detectIntent(userMessage);
  Memory.askedCount++;
  Memory.add('user', userMessage);

  if (intent === 'greeting') {
    const h = new Date().getHours();
    const greet = h < 12 ? 'صباح الخير ☀️' : h < 18 ? 'أهلاً 👋' : 'مساء الخير 🌙';
    return greet + '\n\nاسألني عن أي حاجة 📚';
  }
  if (intent === 'thanks') return 'العفو! 😊';

  if (intent === 'tip') {
    const tips = ['ذاكر بومودورو — ٢٥ دقيقة تركيز + ٥ راحة', 'اشرح بصوت عالٍ', 'راجع بعد ٢٤ ساعة', 'نم ٧-٨ ساعات', 'ابعد الموبايل', 'ابدأ بالأصعب'];
    return '💡 ' + tips[Math.floor(Math.random() * tips.length)];
  }

  if (intent === 'compare') {
    const r = compare(userMessage);
    if (r) return r;
  }

  if (intent === 'math' || /[+\-*/%]/.test(userMessage)) {
    const r = solveMath(userMessage);
    if (r) return r;
  }

  const entry = search(userMessage);
  if (entry) {
    Memory.lastTopic = entry.t;
    let subIntent = 'definition';
    if (intent === 'why') subIntent = 'why';
    else if (intent === 'how') subIntent = 'how';
    else if (intent === 'example') subIntent = 'example';
    return buildReply(entry, subIntent);
  }

  return `🤔 مش لاقي إجابة محددة.

**جرّب:**
• "5 + 7" (رياضيات)
• "2x + 5 = 13" (معادلة)

}

      if (r.messages) totalMessages += Object.keys(r.messages).length;
      if (r.users) totalOnline += Object.keys(r.users).length;
    });
    const devs = Object.values(users).filter(u => u.role === 'developer').length;
    const guests = Object.keys(users).filter(uid => uid.startsWith('guest')).length;

    const content = `
      <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:8px;">
        <div class="card" style="text-align:center;padding:16px;">
          <div style="font-size:24px;font-weight:900;color:var(--brand);">${Object.keys(users).length}</div>
          <div style="font-size:11px;color:var(--text-2);font-weight:700;">مستخدمون</div>
        </div>
        <div class="card" style="text-align:center;padding:16px;">
          <div style="font-size:24px;font-weight:900;color:var(--success);">${totalOnline}</div>
          <div style="font-size:11px;color:var(--text-2);font-weight:700;">متصل الآن</div>
        </div>
        <div class="card" style="text-align:center;padding:16px;">
          <div style="font-size:24px;font-weight:900;color:var(--brand);">${Object.keys(roomsMeta).length}</div>
          <div style="font-size:11px;color:var(--text-2);font-weight:700;">غرف</div>
        </div>
        <div class="card" style="text-align:center;padding:16px;">
          <div style="font-size:24px;font-weight:900;color:var(--brand);">${totalMessages}</div>
          <div style="font-size:11px;color:var(--text-2);font-weight:700;">رسائل</div>
        </div>
        <div class="card" style="text-align:center;padding:16px;">
          <div style="font-size:24px;font-weight:900;color:#F59E0B;">${devs}</div>
          <div style="font-size:11px;color:var(--text-2);font-weight:700;">مطورون</div>
        </div>
        <div class="card" style="text-align:center;padding:16px;">
          <div style="font-size:24px;font-weight:900;color:var(--text-3);">${guests}</div>
          <div style="font-size:11px;color:var(--text-2);font-weight:700;">ضيوف</div>
        </div>
      </div>
    `;
    UI.closeAllModals();
    UI.modal({ title:'📊 إحصائيات', content });
  } catch(e) {
    UI.closeAllModals();
    UI.toast('خطأ: ' + e.message, 'error');
  }
}

async function showUsers() {
  UI.modal({ title:'👥 المستخدمون', content:'<div style="text-align:center;padding:40px;">⏳...</div>' });
  try {
    const snap = await window.db.ref('users').once('value');
    const users = snap.val() || {};
    const list = Object.entries(users).sort((a, b) => (b[1].createdAt || 0) - (a[1].createdAt || 0));

    const content = `
      <input class="input" placeholder="🔍 بحث..." oninput="Core.admin.filterUsers(this.value)" style="margin-bottom:12px;">
      <div id="admin-users-list">
        ${list.map(([uid, u]) => {
          const isDev = u.role === 'developer';
          const isGuest = uid.startsWith('guest');
          const isBanned = u.banned === true;
          return `
            <div class="admin-user-item" data-search="${U.esc((u.name || '').toLowerCase())} ${U.esc((u.email || '').toLowerCase())}"
                 style="background:var(--card-2);border-radius:10px;padding:10px;margin-bottom:8px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
              <div style="width:36px;height:36px;border-radius:50%;background:var(--grad);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;">${u.avatar || '👤'}</div>
              <div style="flex:1;min-width:140px;">
                <div style="font-weight:900;font-size:12px;">
                  ${U.esc(u.name || 'مجهول')}
                  ${isDev ? '<span style="background:#F59E0B;color:#78350F;font-size:8px;padding:1px 4px;border-radius:3px;">DEV</span>' : ''}
                  ${isGuest ? '<span style="background:#64748B;color:white;font-size:8px;padding:1px 4px;border-radius:3px;">GUEST</span>' : ''}
                  ${isBanned ? '<span style="background:#991B1B;color:white;font-size:8px;padding:1px 4px;border-radius:3px;">BANNED</span>' : ''}
                </div>
                <div style="font-size:10px;color:var(--text-3);">${U.esc(u.email || '—')} • Lv.${u.level || 1}</div>
              </div>
              <div style="display:flex;gap:4px;">
                ${isBanned
                  ? `<button onclick="Core.admin.unbanUser('${uid}')" style="background:var(--success);color:white;border:none;padding:4px 8px;border-radius:6px;font-size:11px;cursor:pointer;font-weight:700;">✅</button>`
                  : `<button onclick="Core.admin.banUser('${uid}')" style="background:var(--warning);color:#78350F;border:none;padding:4px 8px;border-radius:6px;font-size:11px;cursor:pointer;font-weight:700;">🚫</button>`
                }
                <button onclick="Core.admin.deleteUser('${uid}','${U.esc(u.name || '')}')" style="background:var(--danger);color:white;border:none;padding:4px 8px;border-radius:6px;font-size:11px;cursor:pointer;font-weight:700;">🗑</button>
              </div>
            </div>
          `;
        }).join('') || '<div style="text-align:center;padding:20px;">لا مستخدمين</div>'}
      </div>
    `;
    UI.closeAllModals();
    UI.modal({ title:'👥 المستخدمون', content });
  } catch(e) {
    UI.closeAllModals();
    UI.toast('خطأ: ' + e.message, 'error');
  }
}

function filterUsers(q) {
  const rows = document.querySelectorAll('.admin-user-item');
  const query = q.trim().toLowerCase();
  rows.forEach(r => { r.style.display = !query || r.dataset.search.includes(query) ? 'flex' : 'none'; });
}

function banUser(uid) {
  UI.confirm('🚫 حظر', 'حظر هذا المستخدم؟').then(async ok => {
    if (!ok) return;
    await window.db.ref('users/' + uid).update({ banned:true, bannedAt:Date.now() });
    UI.toast('✅ تم الحظر', 'success');
  });
}

function unbanUser(uid) {
  UI.confirm('✅ فك حظر', 'فك حظر المستخدم؟').then(async ok => {
    if (!ok) return;
    await window.db.ref('users/' + uid).update({ banned:false });
    UI.toast('✅ تم', 'success');
  });
}

function deleteUser(uid, name) {
  UI.confirm('🗑 حذف', `حذف "${name}" نهائياً؟`).then(async ok => {
    if (!ok) return;
    if (!confirm('متأكد 100%؟')) return;
    await window.db.ref('users/' + uid).remove();
    UI.toast('✅ تم الحذف', 'success');
  });
}

async function showRoomsAdmin() {
  UI.modal({ title:'🏘️ الغرف', content:'<div style="text-align:center;padding:40px;">⏳...</div>' });
  try {
    const [metaSnap, roomsSnap] = await Promise.all([
      window.db.ref('roomsMeta').once('value'),
      window.db.ref('rooms').once('value')
    ]);
    const meta = metaSnap.val() || {};
    const roomsData = roomsSnap.val() || {};
    const codes = Object.keys(meta);

    const content = codes.length ? codes.map(code => {
      const room = meta[code] || {};
      const data = roomsData[code] || {};
      const msgs = data.messages ? Object.keys(data.messages).length : 0;
      const users = data.users ? Object.keys(data.users).length : 0;
      return `
        <div style="background:var(--card-2);border-radius:10px;padding:12px;margin-bottom:8px;">
          <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;">
            <div style="width:40px;height:40px;background:var(--grad);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;">${room.emoji || '🏠'}</div>
            <div style="flex:1;">
              <div style="font-weight:900;font-size:13px;">${U.esc(room.name || code)}</div>
              <div style="font-size:10px;color:var(--text-3);"><span style="background:var(--border);padding:2px 6px;border-radius:10px;font-weight:800;">${U.esc(code)}</span> 💬 ${msgs} • 👥 ${users}</div>
            </div>
          </div>
          <div style="display:flex;gap:4px;">
            <button onclick="Core.ui.closeAllModals();Core.chat.enterRoom('${U.esc(code)}')" style="flex:1;background:var(--card);border:1px solid var(--border);padding:6px 8px;border-radius:6px;font-size:11px;cursor:pointer;font-weight:700;">🚪 دخول</button>
            <button onclick="Core.admin.clearRoomMsgs('${U.esc(code)}')" style="flex:1;background:var(--warning);color:#78350F;border:none;padding:6px 8px;border-radius:6px;font-size:11px;cursor:pointer;font-weight:700;">🧹 مسح</button>
            <button onclick="Core.admin.deleteRoom('${U.esc(code)}','${U.esc(room.name || code)}')" style="flex:1;background:var(--danger);color:white;border:none;padding:6px 8px;border-radius:6px;font-size:11px;cursor:pointer;font-weight:700;">🗑</button>
          </div>
        </div>
      `;
    }).join('') : '<div style="text-align:center;padding:20px;">لا غرف</div>';

    UI.closeAllModals();
    UI.modal({ title:'🏘️ الغرف', content });
  } catch(e) {
    UI.closeAllModals();
    UI.toast('خطأ: ' + e.message, 'error');
  }
}

function clearRoomMsgs(code) {
  UI.confirm('🧹 مسح', `مسح كل رسائل ${code}؟`).then(async ok => {
    if (!ok) return;
    await window.db.ref('rooms/' + code + '/messages').remove();
    UI.toast('✅ تم المسح', 'success');
  });
}

function deleteRoom(code, name) {
  UI.confirm('🗑 حذف', `حذف غرفة "${name}"؟`).then(async ok => {
    if (!ok) return;
    await Promise.all([
      window.db.ref('rooms/' + code).remove(),
      window.db.ref('roomsMeta/' + code).remove()
    ]);
    UI.toast('✅ تم الحذف', 'success');
  });
}

function showBroadcast() {
  UI.modal({
    title: '📢 إشعار عام',
    content: `
      <div class="field"><label>العنوان</label><input class="input" id="bc-title" placeholder="تحديث جديد"></div>
      <div class="field"><label>الرسالة</label><textarea class="textarea" id="bc-body" rows="3" placeholder="نص الإشعار..."></textarea></div>
      <div class="field">
        <label>الأيقونة</label>
        <select class="select" id="bc-icon">
          <option value="📢">📢 إشعار</option>
          <option value="🎉">🎉 احتفال</option>
          <option value="⚠️">⚠️ تحذير</option>
          <option value="🔔">🔔 تنبيه</option>
        </select>
      </div>
      <button class="btn btn-block" onclick="Core.admin.sendBroadcast()">📤 إرسال</button>

}

async function sendBroadcast() {
  const title = U.$('bc-title').value.trim();
  const body = U.$('bc-body').value.trim();
  const icon = U.$('bc-icon').value || '📢';
  if (!title || !body) return UI.toast('املأ كل الحقول', 'error');
  try {
    await window.db.ref('broadcast').set({ title, body, icon, from:S.get('session.name'), timestamp:Date.now() });
    UI.toast('✅ تم الإرسال', 'success');
    UI.closeAllModals();
  } catch(e) { UI.toast('خطأ: ' + e.message, 'error'); }
}

async function exportData() {
  UI.toast('⏳ جاري التصدير...', 'info');
  try {
    const [u, r, m] = await Promise.all([
      window.db.ref('users').once('value'),
      window.db.ref('rooms').once('value'),
      window.db.ref('roomsMeta').once('value')
    ]);
    const dump = { exportedAt:new Date().toISOString(), users:u.val() || {}, rooms:r.val() || {}, roomsMeta:m.val() || {} };
    const blob = new Blob([JSON.stringify(dump, null, 2)], { type:'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'yasedu-backup-' + Date.now() + '.json';
    a.click();
    UI.toast('✅ تم التصدير', 'success');
  } catch(e) { UI.toast('خطأ: ' + e.message, 'error'); }
}

function showDanger() {
  UI.modal({
    title: '⚠️ منطقة الخطر',
    content: `
      <div style="background:var(--danger-bg);color:#991B1B;padding:12px;border-radius:10px;margin-bottom:16px;font-size:12px;font-weight:700;">
        ⚠️ هذه الإجراءات نهائية!
      </div>
      <button class="btn btn-danger btn-block mb-2" onclick="Core.admin.dangerClearMsgs()">🗑 مسح كل الرسائل</button>
      <button class="btn btn-danger btn-block mb-2" onclick="Core.admin.dangerClearRooms()">🏘️ مسح كل الغرف (ما عدا GENERAL)</button>
      <button class="btn btn-danger btn-block mb-2" onclick="Core.admin.dangerClearGuests()">👤 مسح كل الضيوف</button>
      <button class="btn btn-danger btn-block" style="background:#7F1D1D;" onclick="Core.admin.dangerResetAll()">💣 تصفير المنصة</button>
    `
  });
}

function dangerClearMsgs() {
  UI.confirm('⚠️ مسح كل الرسائل', 'متأكد 100%؟').then(async ok => {
    if (!ok) return;
    const snap = await window.db.ref('rooms').once('value');
    const rooms = snap.val() || {};
    let count = 0;
    for (const code of Object.keys(rooms)) {
      if (rooms[code]?.messages) { await window.db.ref('rooms/' + code + '/messages').remove(); count++; }
    }
    UI.toast(`✅ مسحت ${count} غرفة`, 'success');
  });
}

function dangerClearRooms() {
  UI.confirm('⚠️ مسح كل الغرف', 'ما عدا GENERAL؟').then(async ok => {
    if (!ok) return;
    const snap = await window.db.ref('roomsMeta').once('value');
    const meta = snap.val() || {};
    let count = 0;
    for (const code of Object.keys(meta)) {
      if (code === 'GENERAL') continue;
      await Promise.all([window.db.ref('rooms/' + code).remove(), window.db.ref('roomsMeta/' + code).remove()]);
      count++;
    }
    UI.toast(`✅ مسحت ${count} غرفة`, 'success');
  });
}

function dangerClearGuests() {
  UI.confirm('⚠️ مسح الضيوف', 'مسح كل حسابات الضيوف؟').then(async ok => {
    if (!ok) return;
    const snap = await window.db.ref('users').once('value');
    const users = snap.val() || {};
    let count = 0;
    for (const uid of Object.keys(users)) {
      if (uid.startsWith('guest')) { await window.db.ref('users/' + uid).remove(); count++; }
    }
    UI.toast(`✅ مسحت ${count} ضيف`, 'success');
  });
}

function dangerResetAll() {
  UI.confirm('💣 تصفير كامل', 'هتتمسح كل حاجة ما عدا admin!').then(async ok => {
    if (!ok) return;
    if (!confirm('آخر تأكيد — متأكد 100%؟')) return;
    const usersSnap = await window.db.ref('users').once('value');
    const users = usersSnap.val() || {};
    for (const uid of Object.keys(users)) {
      if (users[uid].name === 'admin') continue;
      await window.db.ref('users/' + uid).remove();
    }
    await window.db.ref('rooms').remove();
    await window.db.ref('roomsMeta').remove();
    UI.toast('✅ تم التصفير', 'success');
    setTimeout(() => location.reload(), 1500);
  });
}

// ═══ ADMIN FAB (يظهر للأدمن فقط) ═══
function injectAdminFab() {
  if (!Session.isAdmin()) return;
  if (document.getElementById('admin-fab')) return;
  const fab = document.createElement('button');
  fab.id = 'admin-fab';
  fab.innerHTML = '👑';
  fab.title = 'لوحة التحكم';
  fab.style.cssText = 'position:fixed;bottom:140px;right:16px;width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#F59E0B,#FCD34D);color:#78350F;border:none;font-size:26px;cursor:pointer;z-index:9999;box-shadow:0 8px 24px rgba(245,158,11,.5);transition:transform .2s;';
  fab.onmouseenter = () => fab.style.transform = 'scale(1.1)';
  fab.onmouseleave = () => fab.style.transform = 'scale(1)';
  fab.onclick = () => Router.go('admin');
  document.body.appendChild(fab);
}

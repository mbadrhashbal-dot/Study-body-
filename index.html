var Quiz={mode:'',questions:[],curQ:0,score:0,attempted:[],orderPicks:[],

  genFillBlank:function(topic,count){
    var qs=[];var bases={
      math:[{q:'3 + 5 = ؟',a:'8'},{q:'10 - 4 = ؟',a:'6'},{q:'7 × 2 = ؟',a:'14'},{q:'12 ÷ 3 = ؟',a:'4'},{q:'9 + 6 = ؟',a:'15'},{q:'5 × 5 = ؟',a:'25'},{q:'20 - 7 = ؟',a:'13'},{q:'16 ÷ 4 = ؟',a:'4'}],
      science:[{q:'رمز الماء = ؟',a:'H2O'},{q:'عدد الكواكب في المجموعة الشمسية = ؟',a:'8'},{q:'أكبر كوكب = ؟',a:'المشتري'},{q:'رمز الأكسجين = ؟',a:'O'}],
      arabic:[{q:'عاصمة مصر = ؟',a:'القاهرة'},{q:'عاصمة السعودية = ؟',a:'الرياض'},{q:'أول شهر في السنة = ؟',a:'محرم'},{q:'لون النبات = ؟',a:'أخضر'}],
      english:[{q:'book = ؟ (عربي)',a:'كتاب'},{q:'student = ؟ (عربي)',a:'طالب'},{q:'teacher = ؟ (عربي)',a:'معلم'},{q:'school = ؟ (عربي)',a:'مدرسة'}]
    };
    var bank=(bases[topic]||bases.math).concat(bases[topic]||bases.math);
    for(var i=0;i<count;i++){var obj=bank[i%bank.length];qs.push({type:'fillblank',question:obj.q,answer:obj.a});}
    return qs;
  },

  genMCQ:function(topic,count){
    var qs=[];var base={
      math:[{q:'3+5؟',a:'8',w:['7','9','6']},{q:'10−4؟',a:'6',w:['5','7','4']},{q:'7×2؟',a:'14',w:['12','16','10']}],
      science:[{q:'عدد الكواكب؟',a:'8',w:['7','9','10']},{q:'رمز الماء؟',a:'H₂O',w:['O₂','CO₂','NaCl']},{q:'أسرع؟',a:'الضوء',w:['الصوت','السيارة','الطائرة']}],
      arabic:[{q:'عاصمة مصر؟',a:'القاهرة',w:['بغداد','بيروت','الخرطوم']},{q:'أول شهر؟',a:'محرم',w:['رمضان','شوال','رجب']}],
      english:[{q:'book=?',a:'كتاب',w:['قلم','دفتر','طاولة']},{q:'student=?',a:'طالب',w:['معلم','صف','مدرسة']}]
    };
    var bank=(base[topic]||base.math).concat(base[topic]||base.math);
    for(var i=0;i<count;i++){
      var obj=bank[i%bank.length];var opts=[obj.a].concat(obj.w);
      for(var j=opts.length-1;j>0;j--){var k=Math.floor(Math.random()*(j+1));var tmp=opts[j];opts[j]=opts[k];opts[k]=tmp;}
      qs.push({type:'mcq',question:obj.q,answer:obj.a,options:opts});
    }
    return qs;
  },

  genTrueFalse:function(topic,count){
    var qs=[];var bank={
      math:[{q:'3+5=8',a:true},{q:'10−4=5',a:false},{q:'7×2=14',a:true},{q:'12÷3=3',a:false}],
      science:[{q:'الماء H₂O',a:true},{q:'الأرض أكبر من المشتري',a:false},{q:'الصوت أسرع من الضوء',a:false}],
      arabic:[{q:'عاصمة مصر القاهرة',a:true},{q:'أول شهر رمضان',a:false}],
      english:[{q:'book = كتاب',a:true},{q:'student = معلم',a:false}]
    };
    var b=(bank[topic]||bank.math).concat(bank[topic]||bank.math);
    for(var i=0;i<count;i++){var item=b[i%b.length];qs.push({type:'truefalse',question:item.q,answer:item.a});}
    return qs;
  },

  genMatch:function(topic,count){
    var qs=[];var pairs={
      math:[{l:'3+5',r:'8'},{l:'10−4',r:'6'},{l:'7×2',r:'14'},{l:'12÷3',r:'4'}],
      science:[{l:'H₂O',r:'ماء'},{l:'O₂',r:'أكسجين'},{l:'المشتري',r:'أكبر كوكب'},{l:'الضوء',r:'أسرع'}],
      arabic:[{l:'مصر',r:'القاهرة'},{l:'السعودية',r:'الرياض'},{l:'فرنسا',r:'باريس'}],
      english:[{l:'book',r:'كتاب'},{l:'student',r:'طالب'},{l:'teacher',r:'معلم'}]
    };
    var p=(pairs[topic]||pairs.math).concat(pairs[topic]||pairs.math);
    for(var i=0;i<count;i++){
      var slice=p.slice(i*4,(i+1)*4);if(slice.length<2)slice=p.slice(0,4);
      var leftCol=slice.map(function(x){return x.l;});var rightCol=slice.map(function(x){return x.r;});
      for(var j=rightCol.length-1;j>0;j--){var k=Math.floor(Math.random()*(j+1));var tmp=rightCol[j];rightCol[j]=rightCol[k];rightCol[k]=tmp;}
      qs.push({type:'match',question:'طابق',pairs:slice.map(function(x){return{left:x.l,right:x.r};}),leftOptions:leftCol,rightOptions:rightCol});
    }
    return qs;
  },

  genOrder:function(topic,count){
    var qs=[];var seqs={
      math:[[1,2,3,4,5],[10,20,30,40,50],[2,4,6,8,10]],
      science:[['بذرة','شتلة','نبات','زهرة'],['صلب','سائل','غاز','بلازما']],
      arabic:[['أ','ب','ج','د'],['الأول','الثاني','الثالث','الرابع']],
      english:[['a','b','c','d'],['first','second','third','fourth']]
    };
    var s=(seqs[topic]||seqs.math).concat(seqs[topic]||seqs.math);
    for(var i=0;i<count;i++){
      var arr=s[i%s.length].slice();var shuffled=arr.slice();
      for(var j=shuffled.length-1;j>0;j--){var k=Math.floor(Math.random()*(j+1));var tmp=shuffled[j];shuffled[j]=shuffled[k];shuffled[k]=tmp;}
      qs.push({type:'order',question:'رتّب بالترتيب الصحيح',items:shuffled,correctOrder:arr});
    }
    return qs;
  },

  genExplain:function(topic,count){
    var qs=[];var prompts={
      math:['اشرح: كيف نحسب مساحة المربع؟','اشرح: ما الفرق بين الجمع والضرب؟','اشرح: ما قانون المحيط للمستطيل؟'],
      science:['اشرح: ما دورة الماء؟','اشرح: لماذا نرى الألوان؟','اشرح: كيف يطير الطائر؟'],
      arabic:['اشرح: ما الفاعل في الجملة؟','اشرح: ما أنواع الجمل؟','اشرح: ما الفرق بين الهمزة والألف؟'],
      english:['Explain: What is a verb?','Explain: What is the difference between present and past tense?','Explain: What is a noun?']
    };
    var p=(prompts[topic]||prompts.math).concat(prompts[topic]||prompts.math);
    for(var i=0;i<count;i++){qs.push({type:'explain',question:p[i%p.length],answer:''});}
    return qs;
  },

  detectTopic:function(text){
    var t=(text||'').toLowerCase();
    if(/فيزياء|نيوتن|طاقة|سرعة|ضوء|صوت|كهرباء/.test(t))return'science';
    if(/كيمياء|ذرة|حمض|عنصر|تفاعل/.test(t))return'science';
    if(/أحياء|خلية|dna|نبات|حيوان/.test(t))return'science';
    if(/عربي|نحو|فاعل|فعل|مبتدأ|لغة/.test(t))return'arabic';
    if(/english|verb|noun|tense/.test(t))return'english';
    if(/رياضيات|جمع|طرح|ضرب|قسمة|معادلة/.test(t))return'math';
    return'math';
  },

  generate:function(){
    var textEl=U.$('quiz-text');
    var text=textEl?textEl.value.trim():'';
    
    if(!text||text.length<80){
      UI.toast('الصق نصاً تعليمياً (80 حرف على الأقل)','error');
      var inp=U.$('quiz-text');
      if(inp)inp.focus();
      return;
    }
    
    // استخراج الموضوع
    var topic=Quiz.detectTopic(text);
    
    // المتابعة مع الموضوع الصحيح
    Quiz.startFromText(text,topic);
  },

  startFromText:function(text,topic){
    if(!Session.isLoggedIn()){UI.toast('سجّل دخول أولاً','error');setTimeout(function(){Router.go('auth');},600);return;}
    
    var s=App.state.user;
    var plan=s.plan||'free';
    var limit=App.plans[plan].quizLimit;
    var slider=U.$('quiz-count');var count=slider?parseInt(slider.value):5;
    if(count>limit){UI.toast('الحد الأقصى: '+limit+' سؤال','error');return;}
    
    var typeSelect=U.$('quiz-type-sel');var qtype=typeSelect?typeSelect.value:'fillblank';
    var allowedTypes=App.plans[plan].quizTypes||[];
    if(allowedTypes.indexOf(qtype)===-1){UI.toast('هذا النوع متاح لخطة أعلى','error');return;}
    
    Quiz.mode='auto';Quiz.curQ=0;Quiz.score=0;Quiz.attempted=[];Quiz.orderPicks=[];
    
    // توليد أسئلة من النص والموضوع
    var qs=Quiz.genFromText(text,count,qtype,topic);
    if(!qs){return;}
    
    Quiz.questions=qs;
    U.$('quiz-setup').style.display='none';U.$('quiz-run').style.display='block';
    Quiz.renderQuestion();
  },

  genFromText:function(text,count,qtype,topic){
    if(!text||text.length<80){
      UI.toast('النص قصير (80 حرف على الأقل)','error');
      return null;
    }
    
    // إذا كان النص قصيراً جداً، استخدم banks ثابتة
    if(text.length<120){
      var genMap={fillblank:Quiz.genFillBlank,mcq:Quiz.genMCQ,truefalse:Quiz.genTrueFalse,match:Quiz.genMatch,order:Quiz.genOrder,explain:Quiz.genExplain};
      var gen=genMap[qtype]||Quiz.genFillBlank;
      return gen(topic,count);
    }
    
    // توليد أسئلة من النص
    var sentences=text.split(/[.؟!؟\n]+/).map(function(s){return s.trim();}).filter(function(s){return s.length>=20;});
    if(sentences.length<3){
      UI.toast('النص لا يحتوي على جمل كافية','error');
      return null;
    }
    
    var qs=[];
    
    // لكل نوع سؤال طريقة توليد مختلفة
    if(qtype==='fillblank'){
      for(var i=0;i<sentences.length && qs.length<count;i++){
        var sen=sentences[i];
        var words=sen.split(/\s+/).map(function(w){return w.replace(/[،,.!؟]/g,'');}).filter(function(w){return w.length>=4;});
        if(!words.length)continue;
        words.sort(function(a,b){return b.length-a.length;});
        var keyword=words[0];
        qs.push({type:'fillblank',question:sen.replace(keyword,'______'),answer:keyword});
      }
    }
    else if(qtype==='mcq'){
      var genMap={fillblank:Quiz.genFillBlank,mcq:Quiz.genMCQ,truefalse:Quiz.genTrueFalse,match:Quiz.genMatch,order:Quiz.genOrder,explain:Quiz.genExplain};
      var gen=genMap[qtype];
      qs=gen(topic,count);
    }
    else{
      // للأنواع الأخرى استخدم banks ثابتة
      var genMap={fillblank:Quiz.genFillBlank,mcq:Quiz.genMCQ,truefalse:Quiz.genTrueFalse,match:Quiz.genMatch,order:Quiz.genOrder,explain:Quiz.genExplain};
      var gen=genMap[qtype];
      qs=gen(topic,count);
    }
    
    if(qs.length<3){
      UI.toast('فشل التوليد — جرب نصاً أطول أو نوع سؤال مختلف','error');
      return null;
    }
    
    return qs;
  },

  setMode:function(mode){
    if(mode==='manual'){
      var plan=App.state.user.plan;
      if(plan==='free'){
        UI.toast('الوضع اليدوي متاح للخطة Pro+ فقط','error');
        Plans.show();
        return;
      }
      U.$('quiz-auto-panel').style.display='none';
      U.$('quiz-manual-panel').style.display='block';
      U.$('quiz-mode-auto').className='btn btn-sm btn-secondary';
      U.$('quiz-mode-manual').className='btn btn-sm';
    }else{
      U.$('quiz-auto-panel').style.display='block';
      U.$('quiz-manual-panel').style.display='none';
      U.$('quiz-mode-auto').className='btn btn-sm';
      U.$('quiz-mode-manual').className='btn btn-sm btn-secondary';
    }
  },

  pickPDF:function(){
    // تحقق من الخطة أولاً
    var plan=App.state.user.plan;
    if(plan==='free'){
      UI.toast('ميزة PDF متاحة للخطط Pro و Premium','error');
      Plans.show();
      return;
    }
    
    var input=document.createElement('input');
    input.type='file';
    input.accept='.pdf';
    input.onchange=function(e){
      var file=e.target.files[0];
      if(!file)return;
      
      if(file.size>20*1024*1024){ // 20MB
        UI.toast('حجم الملف كبير جداً (الحد 20MB)','error');
        return;
      }
      
      if(file.type!=='application/pdf'){
        UI.toast('الرجاء اختيار ملف PDF فقط','error');
        return;
      }
      
      UI.toast('جاري قراءة الملف...','info',2000);
      
      // في الإصدار الحالي، سنقوم بقراءة النص من PDF (الوظيفة الحقيقية قيد التطوير)
      var reader=new FileReader();
      reader.onload=function(ev){
        try{
          // هذا مثال بسيط - في الإصدار الكامل سيتم استخدام PDF.js لقراءة النص
          var text='نص مستخرج من ملف PDF (وضع تجريبي)';
          
          // ضع النص في textarea
          var textarea=U.$('quiz-text');
          if(textarea){
            textarea.value='ملف PDF: '+file.name+'\n\n'+text;
            UI.toast('تم تحميل الملف: '+file.name,'success');
          }
        }catch(err){
          UI.toast('فشل قراءة الملف: '+err.message,'error');
        }
      };
      reader.onerror=function(){UI.toast('خطأ في قراءة الملف','error');};
      reader.readAsArrayBuffer(file);
    };
    input.click();
  },

  addManualQ:function(){
    var plan=App.state.user.plan;
    if(plan==='free'){
      UI.toast('الوضع اليدوي متاح للخطة Pro+ فقط','error');
      Plans.show();
      return;
    }
    
    var list=U.$('manual-questions-list');
    if(!list)return;
    
    var qId='mq_'+Date.now();
    var qHTML='<div class="q-builder-item" id="'+qId+'">'+
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">'+
      '<div class="q-builder-label">سؤال جديد</div>'+
      '<button class="btn btn-sm btn-danger" onclick="Quiz.removeManualQ(\''+qId+'\')">🗑</button>'+
      '</div>'+
      '<input class="input" type="text" placeholder="نص السؤال" id="'+qId+'_q" style="margin-bottom:8px">'+
      '<select class="input" id="'+qId+'_type" style="margin-bottom:8px">'+
      '<option value="mcq">اختيار متعدد</option>'+
      '<option value="fillblank">ملء الفراغ</option>'+
      '<option value="truefalse">صح/خطأ</option>'+
      '</select>'+
      '<div id="'+qId+'_opts" style="display:none">'+
      '<input class="input" placeholder="الاختيار 1" style="margin-bottom:4px">'+
      '<input class="input" placeholder="الاختيار 2" style="margin-bottom:4px">'+
      '<input class="input" placeholder="الاختيار 3" style="margin-bottom:4px">'+
      '<input class="input" placeholder="الاختيار 4" style="margin-bottom:4px">'+
      '<input class="input" placeholder="الإجابة الصحيحة" style="margin-bottom:4px">'+
      '</div>'+
      '</div>';
    
    list.insertAdjacentHTML('beforeend',qHTML);
    
    // إظهار/إخفاء خيارات MCQ
    var typeSelect=U.$(qId+'_type');
    if(typeSelect){
      typeSelect.onchange=function(){
        var opts=U.$(qId+'_opts');
        if(opts)opts.style.display=this.value==='mcq'?'block':'none';
      };
    }
  },

  removeManualQ:function(id){
    var el=U.$(id);
    if(el&&confirm('حذف هذا السؤال؟'))el.remove();
  },

  startManual:function(){
    var plan=App.state.user.plan;
    if(plan==='free'){
      UI.toast('الوضع اليدوي متاح للخطة Pro+ فقط','error');
      Plans.show();
      return;
    }
    
    // جمع الأسئلة اليدوية
    var qItems=U.$$('.q-builder-item');
    var questions=[];
    
    qItems.forEach(function(item){
      var id=item.id;
      var q=U.$(id+'_q');
      var type=U.$(id+'_type');
      
      if(q&&q.value.trim()&&type){
        var question={
          type:type.value,
          question:q.value.trim(),
          answer:'إجابة' // في الإصدار الكامل يتم جمع الإجابات من الحقول
        };
        
        if(type.value==='mcq'){
          // جمع خيارات MCQ
          var opts=[];
          for(var i=1;i<=4;i++){
            var opt=U.$(id+'_opts_input_'+i);
            if(opt&&opt.value.trim())opts.push(opt.value.trim());
          }
          if(opts.length>=2){
            question.options=opts;
            question.answer=opts[0]; // في الإصدار الكامل: answer من حقل منفصل
          }
        }
        
        questions.push(question);
      }
    });
    
    if(questions.length===0){
      UI.toast('أضف سؤالاً واحداً على الأقل','error');
      return;
    }
    
    Quiz.mode='manual';Quiz.curQ=0;Quiz.score=0;Quiz.attempted=[];Quiz.orderPicks=[];
    Quiz.questions=questions;
    U.$('quiz-setup').style.display='none';U.$('quiz-run').style.display='block';
    Quiz.renderQuestion();
  },

  start:function(topic){
    if(!Session.isLoggedIn()){UI.toast('سجّل دخول أولاً','error');setTimeout(function(){Router.go('auth');},600);return;}
    var s=App.state.user;
    var plan=s.plan||'free';
    var limit=App.plans[plan].quizLimit;
    var slider=U.$('quiz-count');var count=slider?parseInt(slider.value):5;
    if(count>limit){UI.toast('الحد الأقصى: '+limit+' سؤال','error');return;}
    var typeSelect=U.$('quiz-type-sel');var qtype=typeSelect?typeSelect.value:'fillblank';
    var allowedTypes=App.plans[plan].quizTypes||[];
    if(allowedTypes.indexOf(qtype)===-1){UI.toast('هذا النوع متاح لخطة أعلى','error');return;}
    Quiz.mode='auto';Quiz.curQ=0;Quiz.score=0;Quiz.attempted=[];Quiz.orderPicks=[];
    var genMap={fillblank:Quiz.genFillBlank,mcq:Quiz.genMCQ,truefalse:Quiz.genTrueFalse,match:Quiz.genMatch,order:Quiz.genOrder,explain:Quiz.genExplain};
    var gen=genMap[qtype]||Quiz.genFillBlank;Quiz.questions=gen(topic,count);
    U.$('quiz-setup').style.display='none';U.$('quiz-run').style.display='block';
    Quiz.renderQuestion();
  },

  renderQuestion:function(){
    var q=Quiz.questions[Quiz.curQ];if(!q){Quiz.showResult();return;}
    var qEl=U.$('quiz-question');var aEl=U.$('quiz-answer');
    if(!qEl||!aEl){console.error('quiz-question or quiz-answer not found');return;}
    // progress bar
    var pct=Math.round((Quiz.curQ/Quiz.questions.length)*100);
    var progressHTML='<div style="height:4px;background:var(--p-100);border-radius:99px;overflow:hidden;margin-bottom:14px"><div style="height:100%;width:'+pct+'%;background:var(--brand);transition:width .3s;border-radius:99px"></div></div>';
    qEl.innerHTML=progressHTML+'<div style="font-size:12px;color:var(--text-3);font-weight:700;margin-bottom:8px">سؤال '+(Quiz.curQ+1)+' من '+Quiz.questions.length+'</div><div style="font-size:16px;font-weight:900;line-height:1.5">'+U.esc(q.question)+'</div>';
    if(q.type==='fillblank'){aEl.innerHTML='<div style="margin-top:14px"><input class="input" type="text" id="quiz-input" placeholder="اكتب الإجابة..." onkeydown="if(event.key===\'Enter\')Quiz.checkAnswer()" style="margin-bottom:10px"><button class="btn btn-block" onclick="Quiz.checkAnswer()">✅ تأكيد</button></div>';}
    else if(q.type==='mcq'){aEl.innerHTML='<div style="margin-top:14px">'+q.options.map(function(opt){return'<button class="quiz-option" onclick="Quiz.checkMCQ(\''+U.esc(opt)+'\')">'+U.esc(opt)+'</button>';}).join('')+'</div>';}
    else if(q.type==='truefalse'){aEl.innerHTML='<div style="display:flex;gap:10px;margin-top:14px"><button class="quiz-option" onclick="Quiz.checkTrueFalse(true)" style="flex:1;background:var(--green-soft);color:var(--green);border-color:var(--green)">✓ صح</button><button class="quiz-option" onclick="Quiz.checkTrueFalse(false)" style="flex:1;background:var(--red-soft);color:var(--red);border-color:var(--red)">✗ خطأ</button></div>';}
    else if(q.type==='match'){Quiz._renderMatch(q,aEl);}
    else if(q.type==='order'){Quiz._renderOrder(q,aEl);}
    else if(q.type==='explain'){aEl.innerHTML='<div style="margin-top:14px"><textarea class="textarea" id="quiz-explain-input" rows="5" placeholder="اكتب شرحك هنا..." style="margin-bottom:10px"></textarea><button class="btn btn-block" onclick="Quiz.submitExplain()">إرسال الشرح</button></div>';}
    setTimeout(function(){var inp=U.$('quiz-input');if(inp)inp.focus();},50);
  },

  _renderMatch:function(q,aEl){
    aEl.innerHTML='<div style="font-size:12px;color:var(--text-3);margin-bottom:8px;font-weight:700">انقر على عمود الأيمن ثم الأيسر للمطابقة</div>'+
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px" id="match-grid">'+
    '<div>'+q.leftOptions.map(function(l,i){return'<button class="quiz-option" id="match-L'+i+'" onclick="Quiz.pickMatch(\'L\','+i+',\''+U.esc(l)+'\')">'+U.esc(l)+'</button>';}).join('')+'</div>'+
    '<div>'+q.rightOptions.map(function(r,i){return'<button class="quiz-option" id="match-R'+i+'" onclick="Quiz.pickMatch(\'R\','+i+',\''+U.esc(r)+'\')">'+U.esc(r)+'</button>';}).join('')+'</div>'+
    '</div>'+
    '<button class="btn btn-block" style="margin-top:10px" onclick="Quiz.submitMatch()">تأكيد المطابقة</button>';
    Quiz.matchPicks={left:null,right:null,pairs:[]};
  },

  pickMatch:function(side,idx,val){
    if(!Quiz.matchPicks)Quiz.matchPicks={left:null,right:null,pairs:[]};
    if(side==='L'){Quiz.matchPicks.left={idx:idx,val:val};}
    else{Quiz.matchPicks.right={idx:idx,val:val};}
    if(Quiz.matchPicks.left&&Quiz.matchPicks.right){
      Quiz.matchPicks.pairs.push({l:Quiz.matchPicks.left.val,r:Quiz.matchPicks.right.val});
      U.$('match-L'+Quiz.matchPicks.left.idx).style.opacity='0.3';
      U.$('match-R'+Quiz.matchPicks.right.idx).style.opacity='0.3';
      Quiz.matchPicks.left=null;Quiz.matchPicks.right=null;
    }
  },

  submitMatch:function(){
    var q=Quiz.questions[Quiz.curQ];if(!Quiz.matchPicks||!Quiz.matchPicks.pairs.length){UI.toast('قم بالمطابقة أولاً','error');return;}
    var correct=0;
    for(var i=0;i<Quiz.matchPicks.pairs.length;i++){
      var p=Quiz.matchPicks.pairs[i];
      for(var j=0;j<q.pairs.length;j++){if(q.pairs[j].left===p.l&&q.pairs[j].right===p.r){correct++;break;}}
    }
    var isCorrect=correct===q.pairs.length;Quiz.attempted.push({correct:isCorrect,type:'match'});
    if(isCorrect){Quiz.score++;UI.toast('✅ ممتاز!','success',1500);Session.addXP(2);}
    else{UI.toast('❌ خطأ — المطابقة ناقصة','error',2000);}
    setTimeout(function(){Quiz.curQ++;Quiz.renderQuestion();},isCorrect?1600:2100);
  },

  _renderOrder:function(q,aEl){
    aEl.innerHTML='<div style="font-size:12px;color:var(--text-3);margin-bottom:8px;font-weight:700">انقر العناصر بالترتيب الصحيح</div>'+
    '<div id="order-items" style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px">'+
    q.items.map(function(it,i){return'<button class="quiz-option" id="order-'+i+'" onclick="Quiz.pickOrder('+i+',\''+U.esc(it)+'\')">'+U.esc(it)+'</button>';}).join('')+
    '</div>'+
    '<div style="font-size:12px;font-weight:700;margin-bottom:6px">ترتيبك:</div>'+
    '<div id="order-picked" style="min-height:40px;padding:10px;background:var(--p-50);border-radius:8px;font-size:14px;font-weight:800"></div>'+
    '<button class="btn btn-block" style="margin-top:10px" onclick="Quiz.submitOrder()">تأكيد الترتيب</button>';
    Quiz.orderPicks=[];
  },

  pickOrder:function(idx,val){
    if(Quiz.orderPicks.includes(val))return;
    Quiz.orderPicks.push(val);
    U.$('order-'+idx).style.opacity='0.3';
    U.$('order-picked').textContent=Quiz.orderPicks.join(' → ');
  },

  submitOrder:function(){
    var q=Quiz.questions[Quiz.curQ];
    if(Quiz.orderPicks.length!==q.correctOrder.length){UI.toast('قم بترتيب كل العناصر','error');return;}
    var isCorrect=JSON.stringify(Quiz.orderPicks)===JSON.stringify(q.correctOrder);
    Quiz.attempted.push({correct:isCorrect,type:'order'});
    if(isCorrect){Quiz.score++;UI.toast('✅ ترتيب صحيح!','success',1500);Session.addXP(2);}
    else{UI.toast('❌ خطأ — الترتيب: '+q.correctOrder.join(' → '),'error',2500);}
    setTimeout(function(){Quiz.curQ++;Quiz.renderQuestion();},isCorrect?1600:2600);
  },

  submitExplain:function(){
    var input=U.$('quiz-explain-input');if(!input)return;
    var text=input.value.trim();if(!text||text.length<10){UI.toast('الشرح قصير (10+ حرف)','error');return;}
    var q=Quiz.questions[Quiz.curQ];q.answer=text;
    var isGood=text.length>=20;Quiz.attempted.push({correct:isGood,type:'explain'});
    if(isGood){Quiz.score++;UI.toast('✅ شرح جيد!','success',1500);Session.addXP(3);}
    else{UI.toast('شرح مقبول لكن يمكن تحسينه','info',2000);}
    setTimeout(function(){Quiz.curQ++;Quiz.renderQuestion();},isGood?1600:2100);
  },

  checkAnswer:function(){
    var input=U.$('quiz-input');if(!input)return;
    var ans=input.value.trim().toLowerCase();var q=Quiz.questions[Quiz.curQ];
    var correct=String(q.answer).toLowerCase();var isCorrect=ans===correct;
    Quiz.attempted.push({correct:isCorrect,type:'fillblank'});
    if(isCorrect){Quiz.score++;UI.toast('✅ صحيح!','success',1500);Session.addXP(1);}
    else{UI.toast('❌ خطأ — الإجابة: '+q.answer,'error',2000);}
    setTimeout(function(){Quiz.curQ++;Quiz.renderQuestion();},isCorrect?1600:2100);
  },

  checkMCQ:function(selected){
    var q=Quiz.questions[Quiz.curQ];var isCorrect=selected===q.answer;
    Quiz.attempted.push({correct:isCorrect,type:'mcq'});
    if(isCorrect){Quiz.score++;UI.toast('✅ صحيح!','success',1500);Session.addXP(1);}
    else{UI.toast('❌ خطأ — الإجابة: '+q.answer,'error',2000);}
    setTimeout(function(){Quiz.curQ++;Quiz.renderQuestion();},isCorrect?1600:2100);
  },

  checkTrueFalse:function(selected){
    var q=Quiz.questions[Quiz.curQ];var isCorrect=selected===q.answer;
    Quiz.attempted.push({correct:isCorrect,type:'truefalse'});
    if(isCorrect){Quiz.score++;UI.toast('✅ صحيح!','success',1500);Session.addXP(1);}
    else{UI.toast('❌ خطأ — الإجابة: '+(q.answer?'صح':'خطأ'),'error',2000);}
    setTimeout(function(){Quiz.curQ++;Quiz.renderQuestion();},isCorrect?1600:2100);
  },

  showResult:function(){
    U.$('quiz-run').style.display='none';U.$('quiz-result').style.display='block';
    var percent=Math.round((Quiz.score/Quiz.questions.length)*100);
    var grade=percent>=90?'ممتاز':percent>=70?'جيد جداً':percent>=50?'جيد':'يحتاج تحسين';
    var emoji=percent>=90?'🏆':percent>=70?'🎉':percent>=50?'👍':'💪';
    U.$('quiz-score').textContent=Quiz.score+' / '+Quiz.questions.length;
    U.$('quiz-percent').textContent=percent+'%';
    U.$('quiz-grade').textContent=emoji+' '+grade;
    var analysis='<div style="font-size:13px;font-weight:700;margin:12px 0 8px">تحليل الأداء:</div>';
    var types={};Quiz.attempted.forEach(function(a){if(!types[a.type])types[a.type]={correct:0,total:0};types[a.type].total++;if(a.correct)types[a.type].correct++;});
    var typeLabels={fillblank:'ملء الفراغ',mcq:'اختيار متعدد',truefalse:'صح/خطأ',match:'مطابقة',order:'ترتيب',explain:'شرح'};
    for(var t in types){analysis+='<div style="font-size:12px;color:var(--text-2);margin-bottom:4px">'+typeLabels[t]+': '+types[t].correct+'/'+types[t].total+'</div>';}
    U.$('quiz-analysis').innerHTML=analysis;
    var hist=[];try{hist=JSON.parse(localStorage.getItem('yasedu_quizHistory')||'[]');}catch(e){}
    hist.push({mode:Quiz.mode,score:Quiz.score,total:Quiz.questions.length,percent:percent,date:new Date().toISOString()});
    try{localStorage.setItem('yasedu_quizHistory',JSON.stringify(hist.slice(-20)));}catch(e){}
  },

  reset:function(){Quiz.mode='';Quiz.questions=[];Quiz.curQ=0;Quiz.score=0;Quiz.attempted=[];Quiz.orderPicks=[];U.$('quiz-setup').style.display='block';U.$('quiz-run').style.display='none';U.$('quiz-result').style.display='none';}
};
window.Quiz=Quiz;

var Cards={
  loadTemplate:function(name){
    var t=TEMPLATES[name];if(!t)return;
    FlashState.cards=t.map(function(c){return{front:c.front,back:c.back,known:false};});FlashState.index=0;
    U.$('cards-setup').style.display='none';U.$('cards-display').style.display='block';
    Cards.renderCard();UI.toast(t.length+' بطاقة جاهزة 🃏','success');
  },
  generateFromText:function(){
    var textarea=U.$('cards-input-text');if(!textarea)return;
    var text=textarea.value.trim();if(!text||text.length<100){UI.toast('النص قصير (100+)','error');return;}
    var sentences=text.split(/[.؟!؟\n]+/).map(function(s){return s.trim();}).filter(function(s){return s.length>=20;});
    if(sentences.length<3){UI.toast('محتاج 3 جمل على الأقل','error');return;}
    var cards=[];var used={};
    for(var i=0;i<sentences.length;i++){
      if(cards.length>=15)break;
      var sen=sentences[i];
      var words=sen.split(/\s+/).map(function(w){return w.replace(/[،,.!؟]/g,'');}).filter(function(w){return w.length>=4;});
      if(!words.length)continue;
      words.sort(function(a,b){return b.length-a.length;});
      var keyword=words[0];if(used[keyword])continue;used[keyword]=true;
      cards.push({front:'ما معنى / تعريف: '+keyword+'؟',back:sen,known:false});
    }
    if(cards.length<3){UI.toast('فشل التوليد — جرب نصاً أطول','error');return;}
    FlashState.cards=cards;FlashState.index=0;
    U.$('cards-setup').style.display='none';U.$('cards-display').style.display='block';
    Cards.renderCard();UI.toast(cards.length+' بطاقة جاهزة 🃏','success');
  },
  renderCard:function(){
    if(!FlashState.cards.length)return;
    var c=FlashState.cards[FlashState.index];
    var front=U.$('fc-front-text');var back=U.$('fc-back-text');
    if(front)front.textContent=c.front;if(back)back.textContent=c.back;
    U.$('fc-inner').style.transform='rotateY(0)';
    U.$('card-cur').textContent=FlashState.index+1;U.$('card-tot').textContent=FlashState.cards.length;
    U.$('card-known').textContent=FlashState.cards.filter(function(x){return x.known;}).length;
  },
  flip:function(){var inner=U.$('fc-inner');inner.style.transform=inner.style.transform==='rotateY(180deg)'?'rotateY(0)':'rotateY(180deg)';},
  review:function(known){if(!FlashState.cards.length)return;FlashState.cards[FlashState.index].known=known;if(known)Session.addXP(1);Cards.next();},
  next:function(){
    if(FlashState.index<FlashState.cards.length-1){FlashState.index++;Cards.renderCard();}
    else{var known=FlashState.cards.filter(function(c){return c.known;}).length;UI.toast('✅ عرفت '+known+' من '+FlashState.cards.length,'success',4000);}
  },
  prev:function(){if(FlashState.index>0){FlashState.index--;Cards.renderCard();}},
  reset:function(){FlashState.cards=[];FlashState.index=0;U.$('cards-setup').style.display='block';U.$('cards-display').style.display='none';}
};
window.Cards=Cards;

Router.register('bot',BotScreen);
Router.register('quiz',QuizScreen);
Router.register('cards',CardsScreen);
console.log('✓ Bot + Quiz + Cards');
})();
</script>

function AdminScreen_Load(tab){
  AdminStats_Load();
  switch(tab){
    case'users':Admin.loadUsers();break;
    case'rooms':Admin.loadRooms();break;
    case'messages':Admin.showMsgTab();break;
    case'codes':Admin.showCodes();break;
    case'broadcast':Admin.showBroadcast();break;
    case'danger':Admin.showDanger();break;
  }

async function AdminStats_Load(){
  if(!window.db)return;
  try{
    var users=(await window.db.ref('users').once('value')).val()||{};
    var roomsMeta=(await window.db.ref('roomsMeta').once('value')).val()||{};
    var rooms=(await window.db.ref('rooms').once('value')).val()||{};
    var msgCount=0,onlineCount=0;
    Object.keys(rooms).forEach(function(code){var r=rooms[code];if(r.messages)msgCount+=Object.keys(r.messages).length;if(r.users)onlineCount+=Object.keys(r.users).length;});
    var setEl=function(id,val){var el=U.$(id);if(el)el.textContent=val;};
    setEl('as-users',Object.keys(users).length);setEl('as-online',onlineCount);setEl('as-rooms',Object.keys(roomsMeta).length);setEl('as-msgs',msgCount);
  }catch(e){}
}

var Admin={
  tab:function(name,btn){document.querySelectorAll('.admin-tab').forEach(function(t){t.classList.remove('active');});if(btn)btn.classList.add('active');AdminState.tab=name;var content=U.$('admin-content');if(content)content.innerHTML='<div class="admin-loading">⏳ جاري التحميل...</div>';AdminStats_Load();AdminScreen_Load(name);},
  loadUsers:async function(){
    var content=U.$('admin-content');
    try{
      var snap=await window.db.ref('users').once('value');var users=snap.val()||{};
      var entries=Object.keys(users).map(function(uid){return{uid:uid,data:users[uid]};}).sort(function(a,b){return(b.data.createdAt||0)-(a.data.createdAt||0);});
      if(!entries.length){content.innerHTML='<div class="admin-empty">لا مستخدمين</div>';return;}
      content.innerHTML='<div style="font-size:11px;color:var(--text-3);margin-bottom:8px;font-weight:700">إجمالي: '+entries.length+'</div>'+
      entries.map(function(item){
        var u=item.data;var uid=item.uid;
        var badges='';if(u.role==='developer')badges+=' 👑';if(uid.indexOf('guest')===0)badges+=' 👤';if(u.banned)badges+=' 🚫';
        return'<div class="admin-item"><div class="admin-item-info"><div class="admin-item-name">'+U.esc(u.name||'?')+badges+'</div><div class="admin-item-meta">'+U.esc(u.email||'—')+' • Lv.'+( u.level||1)+' • '+App.planPill(u.plan||'free')+'</div></div>'+
        '<button class="admin-btn '+(u.banned?'admin-btn-info':'admin-btn-warning')+'" onclick="Admin.'+(u.banned?'unban':'ban')+'(\''+uid+'\')">'+(u.banned?'✅':'🚫')+'</button>'+
        '<button class="admin-btn admin-btn-danger" onclick="Admin.delUser(\''+uid+'\',\''+U.esc(u.name||'')+'\')">🗑</button>'+
        '</div>';
      }).join('');
    }catch(e){content.innerHTML='<div class="admin-empty">فشل: '+e.message+'</div>';}
  },
  ban:function(uid){UI.confirm('حظر','حظر هذا المستخدم؟').then(function(ok){if(!ok)return;window.db.ref('users/'+uid).update({banned:true,bannedAt:Date.now()}).then(function(){UI.toast('تم الحظر','success');Admin.loadUsers();});});},
  unban:function(uid){window.db.ref('users/'+uid).update({banned:false}).then(function(){UI.toast('تم فك الحظر','success');Admin.loadUsers();});},
  delUser:function(uid,name){UI.confirm('حذف','حذف "'+name+'"؟').then(function(ok){if(!ok)return;window.db.ref('users/'+uid).remove().then(function(){UI.toast('تم الحذف','success');Admin.loadUsers();AdminStats_Load();});});},
  loadRooms:async function(){
    var content=U.$('admin-content');
    try{
      var meta=(await window.db.ref('roomsMeta').once('value')).val()||{};
      var rooms=(await window.db.ref('rooms').once('value')).val()||{};
      var codes=Object.keys(meta);
      if(!codes.length){content.innerHTML='<div class="admin-empty">لا غرف</div>';return;}
      content.innerHTML=codes.map(function(code){var r=meta[code];var data=rooms[code]||{};var msgs=data.messages?Object.keys(data.messages).length:0;var users=data.users?Object.keys(data.users).length:0;return'<div class="admin-item"><div class="admin-item-info"><div class="admin-item-name">'+U.esc(r.name||code)+(r.password?' 🔒':' 🌍')+'</div><div class="admin-item-meta">'+U.esc(code)+' • 💬 '+msgs+' • 👥 '+users+'</div></div><button class="admin-btn admin-btn-info" onclick="Admin.enterRoom(\''+U.esc(code)+'\')">دخول</button><button class="admin-btn admin-btn-warning" onclick="Admin.clearRoom(\''+U.esc(code)+'\')">🧹</button><button class="admin-btn admin-btn-danger" onclick="Admin.delRoom(\''+U.esc(code)+'\',\''+U.esc(r.name||code)+'\')">🗑</button></div>';}).join('');
    }catch(e){content.innerHTML='<div class="admin-empty">فشل</div>';}

    var chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    var prefix=plan==='premium'?'PREM':'PRO';
    var rand='';for(var i=0;i<6;i++)rand+=chars[Math.floor(Math.random()*chars.length)];
    var code=prefix+rand;
    try{
      await window.db.ref('codes/'+code).set({plan:plan,created:Date.now(),used:false,createdBy:window.App?window.App.state.user.uid:'admin'});
      var el=document.getElementById('ap-gen-code');var btn=document.getElementById('ap-copy-btn');
      if(el){el.textContent=code;el.style.display='block';}if(btn)btn.style.display='block';
      toast('تم إنشاء: '+code,'success');AdminPanel.loadCodesInPanel();
    }catch(e){toast('خطأ: '+e.message,'error');}
  },
  copyCode:function(){var el=document.getElementById('ap-gen-code');if(el&&navigator.clipboard)navigator.clipboard.writeText(el.textContent).then(function(){toast('تم النسخ','success');});},
  loadCodesInPanel:async function(){
    var list=document.getElementById('ap-codes-list');if(!list)return;
    try{
      var snap=await window.db.ref('codes').once('value');var codes=snap.val()||{};var keys=Object.keys(codes);
      if(!keys.length){list.innerHTML='<div style="text-align:center;padding:20px;color:var(--text-3)">لا أكواد</div>';return;}
      list.innerHTML=keys.sort(function(a,b){return(codes[b].created||0)-(codes[a].created||0);}).slice(0,20).map(function(k){var cd=codes[k];return'<div style="display:flex;align-items:center;gap:8px;padding:8px;border-bottom:1px solid var(--border)"><div style="font-family:monospace;font-weight:800;flex:1;letter-spacing:1px">'+escHtml(k)+'</div><span style="font-size:11px;font-weight:700;color:'+(cd.plan==='premium'?'var(--gold-dark)':'var(--brand)')+'">'+escHtml(cd.plan||'pro')+'</span><span style="font-size:11px;color:'+(cd.used?'var(--red)':'var(--green)')+';font-weight:700">'+(cd.used?'مستخدم':'متاح')+'</span><button onclick="AdminPanel.delCode(\''+k+'\')" style="background:var(--red);color:#fff;border:none;border-radius:5px;padding:3px 8px;font-size:11px;cursor:pointer">🗑</button></div>';}).join('');
    }catch(e){list.innerHTML='<div style="color:var(--red)">فشل</div>';}
  },
  delCode:function(code){if(!confirm('حذف الكود "'+code+'"؟'))return;window.db.ref('codes/'+code).remove().then(function(){toast('تم الحذف','success');AdminPanel.loadCodesInPanel();});},
  showBroadcast:function(){
    var c=document.getElementById('admin-panel-content');if(!c)return;
    c.innerHTML='<div class="field"><label style="font-size:13px;font-weight:700;display:block;margin-bottom:6px">العنوان</label><input id="ap-bc-title" style="width:100%;padding:10px;border-radius:8px;border:1px solid var(--border);font-family:inherit;font-size:14px;margin-bottom:12px;background:var(--surface);color:var(--text)" placeholder="عنوان الإشعار"></div><div class="field"><label style="font-size:13px;font-weight:700;display:block;margin-bottom:6px">الرسالة</label><textarea id="ap-bc-body" rows="4" style="width:100%;padding:10px;border-radius:8px;border:1px solid var(--border);font-family:inherit;font-size:14px;resize:vertical;background:var(--surface);color:var(--text)" placeholder="نص الإشعار"></textarea></div><button onclick="AdminPanel.sendBC()" style="width:100%;padding:12px;border-radius:8px;background:var(--brand);color:#fff;border:none;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit">📤 إرسال للجميع</button>';
  },
  sendBC:async function(){
    var title=document.getElementById('ap-bc-title').value.trim();var body=document.getElementById('ap-bc-body').value.trim();
    if(!title||!body){toast('❌ املأ الحقول','error');return;}
    try{await window.db.ref('broadcast').set({title:title,body:body,from:'admin',timestamp:Date.now()});toast('✅ تم الإرسال','success');document.getElementById('ap-bc-title').value='';document.getElementById('ap-bc-body').value='';}
    catch(e){toast('❌ '+e.message,'error');}
  },
  showDanger:function(){
    var c=document.getElementById('admin-panel-content');if(!c)return;
    c.innerHTML='<div style="background:var(--red-soft);border:2px solid var(--red);border-radius:12px;padding:16px"><div style="color:var(--red);font-weight:800;font-size:14px;margin-bottom:14px">⚠️ عمليات خطيرة</div><button onclick="AdminPanel.dClearMsgs()" style="width:100%;padding:12px;border-radius:8px;background:var(--red);color:#fff;border:none;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit;margin-bottom:8px">🗑 مسح كل رسائل الغرف</button><button onclick="AdminPanel.dClearRooms()" style="width:100%;padding:12px;border-radius:8px;background:var(--red);color:#fff;border:none;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit;margin-bottom:8px">🏘️ مسح كل الغرف (ما عدا GENERAL)</button><button onclick="AdminPanel.dClearGuests()" style="width:100%;padding:12px;border-radius:8px;background:var(--red);color:#fff;border:none;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit">👤 مسح كل الضيوف</button></div>';
  },
  dClearMsgs:function(){if(!confirm('مسح كل رسائل الغرف؟'))return;if(!confirm('متأكد 100%؟'))return;window.db.ref('rooms').once('value').then(function(snap){var rooms=snap.val()||{};var p=[];Object.keys(rooms).forEach(function(c){if(rooms[c].messages)p.push(window.db.ref('rooms/'+c+'/messages').remove());});return Promise.all(p);}).then(function(){toast('✅ تم المسح','success');AdminPanel.loadStats();});},
  dClearRooms:function(){if(!confirm('مسح كل الغرف (ما عدا GENERAL)؟'))return;window.db.ref('roomsMeta').once('value').then(function(snap){var meta=snap.val()||{};var p=[];Object.keys(meta).forEach(function(c){if(c!=='GENERAL'){p.push(window.db.ref('rooms/'+c).remove());p.push(window.db.ref('roomsMeta/'+c).remove());}});return Promise.all(p);}).then(function(){toast('✅ تم المسح','success');AdminPanel.loadStats();});},
  dClearGuests:function(){if(!confirm('مسح كل الضيوف؟'))return;window.db.ref('users').once('value').then(function(snap){var users=snap.val()||{};var p=[];Object.keys(users).forEach(function(uid){if(uid.indexOf('guest')===0)p.push(window.db.ref('users/'+uid).remove());});return Promise.all(p);}).then(function(){toast('✅ تم المسح','success');AdminPanel.loadStats();});}
};
window.AdminPanel=AdminPanel;

function escHtml(s){var d=document.createElement('div');d.textContent=String(s==null?'':s);return d.innerHTML;}

// Update FAB periodically
setInterval(updateFab,1000);setTimeout(updateFab,500);
window.addEventListener('storage',function(e){if(e.key==='yasedu_session')updateFab();});

console.log('✅ Admin FAB + Panel Ready');
})();
</script>
</body>
</html>

<style>
/* ═══════════════════════════════════════════════════════
   YasEdu v6 — Design System
   ═══════════════════════════════════════════════════════ */
:root {
  --brand: #4F46E5;
  --brand-dark: #4338CA;
  --brand-light: #818CF8;
  --brand-soft: #EEF2FF;
  --accent: #F59E0B;
  --bg: #F8FAFC;
  --card: #FFFFFF;
  --card-2: #F8FAFC;
  --card-3: #F1F5F9;
  --text: #0F172A;
  --text-2: #475569;
  --text-3: #94A3B8;
  --border: #E2E8F0;
  --border-2: #CBD5E1;
  --success: #10B981;
  --success-bg: #D1FAE5;
  --danger: #EF4444;
  --danger-bg: #FEE2E2;
  --warning: #F59E0B;
  --warning-bg: #FEF3C7;
  --info: #3B82F6;
  --info-bg: #DBEAFE;
  --grad: linear-gradient(135deg, #4F46E5 0%, #7C3AED 50%, #A855F7 100%);
  --grad-gold: linear-gradient(135deg, #F59E0B 0%, #FCD34D 100%);
  --grad-danger: linear-gradient(135deg, #EF4444 0%, #F87171 100%);
  --grad-success: linear-gradient(135deg, #10B981 0%, #34D399 100%);
  --r: 12px;
  --r-lg: 16px;
  --r-xl: 24px;
  --r-full: 9999px;
  --shadow-xs: 0 1px 2px rgba(15,23,42,.05);
  --shadow-sm: 0 2px 8px rgba(15,23,42,.06);
  --shadow: 0 4px 16px rgba(15,23,42,.08);
  --shadow-lg: 0 12px 32px rgba(15,23,42,.12);
  --shadow-xl: 0 24px 64px rgba(79,70,229,.25);
  --font: 'Cairo', 'Segoe UI', system-ui, sans-serif;
  --t: .2s cubic-bezier(.4,0,.2,1);
  --t-spring: .3s cubic-bezier(.34,1.56,.64,1);
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
[data-theme="dark"] {
  --bg: #0F172A;
  --card: #1E293B;
  --card-2: #334155;
  --card-3: #475569;
  --text: #F1F5F9;
  --text-2: #CBD5E1;
  --text-3: #64748B;
  --border: #334155;
  --border-2: #475569;
  --brand-soft: #3730A3;
}
[data-palette="ocean"]   { --brand:#0EA5E9; --brand-dark:#0284C7; --grad:linear-gradient(135deg,#0EA5E9,#06B6D4,#22D3EE); }
[data-palette="sunset"]  { --brand:#F97316; --brand-dark:#EA580C; --grad:linear-gradient(135deg,#F97316,#EF4444,#F59E0B); }
[data-palette="forest"]  { --brand:#059669; --brand-dark:#047857; --grad:linear-gradient(135deg,#059669,#10B981,#34D399); }
[data-palette="royal"]   { --brand:#7C3AED; --brand-dark:#6D28D9; --grad:linear-gradient(135deg,#7C3AED,#A855F7,#EC4899); }

*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html { font-size:16px; -webkit-text-size-adjust:100%; scroll-behavior:smooth; }
body { font-family:var(--font); background:var(--bg); color:var(--text); min-height:100dvh; line-height:1.6; overflow-x:hidden; transition: background var(--t), color var(--t); }
img { max-width:100%; display:block; height:auto; }
button, input, textarea, select { font-family:inherit; font-size:inherit; color:inherit; }
button { cursor:pointer; background:none; border:none; }
::selection { background:var(--brand); color:white; }

h1,h2,h3,h4 { font-weight:900; line-height:1.3; }
h1 { font-size:clamp(22px,4vw + 12px,32px); }
h2 { font-size:clamp(18px,2.5vw + 10px,24px); }
h3 { font-size:clamp(16px,2vw + 9px,20px); }
.text-sm { font-size:13px; }
.text-xs { font-size:11px; }
.text-muted { color:var(--text-2); }
.text-faint { color:var(--text-3); }
.text-center { text-align:center; }

.btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:12px 24px; border-radius:var(--r); font-weight:800; font-size:14px; background:var(--grad); color:white; box-shadow:var(--shadow-sm); transition:all var(--t-spring); white-space:nowrap; }
.btn:hover { transform:translateY(-2px); box-shadow:var(--shadow-lg); }
.btn:active { transform:scale(.97); }
.btn:disabled { opacity:.5; cursor:not-allowed; transform:none!important; box-shadow:none!important; }
.btn-block { width:100%; }
.btn-sm { padding:8px 16px; font-size:13px; border-radius:10px; }
.btn-lg { padding:16px 32px; font-size:16px; border-radius:var(--r-lg); }
.btn-light { background:var(--card-2); color:var(--text); border:1px solid var(--border); box-shadow:none; }
.btn-light:hover { background:var(--card-3); border-color:var(--brand-light); }
.btn-danger { background:var(--grad-danger); }
.btn-success { background:var(--grad-success); }
.btn-gold { background:var(--grad-gold); color:#78350F; }
.btn-icon { width:42px; height:42px; padding:0; border-radius:var(--r); font-size:18px; background:var(--card-2); color:var(--text-2); display:inline-flex; align-items:center; justify-content:center; transition:all var(--t-spring); }
.btn-icon:hover { background:var(--brand); color:white; transform:scale(1.05); }
.btn-icon:active { transform:scale(.92); }

.input, .textarea, .select { width:100%; padding:12px 16px; border-radius:var(--r); font-size:16px; background:var(--card-2); border:2px solid var(--border); color:var(--text); transition:all var(--t); }
.input:focus, .textarea:focus, .select:focus { outline:none; border-color:var(--brand); background:var(--card); box-shadow:0 0 0 4px rgba(79,70,229,.1); }
.input::placeholder, .textarea::placeholder { color:var(--text-3); }
.textarea { resize:vertical; min-height:100px; font-family:inherit; }
.field { display:flex; flex-direction:column; gap:8px; margin-bottom:16px; }
.field label { font-size:13px; font-weight:800; color:var(--text-2); }
.field-password { position:relative; }
.pw-toggle { position:absolute; left:12px; top:calc(50% + 10px); transform:translateY(-50%); background:none; border:none; font-size:18px; cursor:pointer; color:var(--text-3); padding:4px; }

.card { background:var(--card); border-radius:var(--r-lg); padding:20px; border:1px solid var(--border); box-shadow:var(--shadow-sm); transition:all var(--t-spring); }
.card-hover:hover { transform:translateY(-3px); box-shadow:var(--shadow-lg); border-color:var(--brand-light); }
.grid { display:grid; gap:16px; }
.grid-2 { grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); }
.grid-3 { grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); }
.grid-4 { grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); }

#splash { position:fixed; inset:0; background:var(--grad); display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:99999; transition:opacity .5s, visibility .5s; }
#splash.hide { opacity:0; visibility:hidden; pointer-events:none; }
.splash-logo { width:100px; height:100px; background:rgba(255,255,255,.2); border-radius:28px; display:flex; align-items:center; justify-content:center; font-size:42px; font-weight:900; color:white; border:2px solid rgba(255,255,255,.3); animation:splashIn .8s cubic-bezier(.34,1.56,.64,1); box-shadow:0 20px 60px rgba(0,0,0,.3); }
@keyframes splashIn { 0%{transform:scale(.3) rotate(-180deg);opacity:0;} 100%{transform:scale(1) rotate(0);opacity:1;} }
.splash-title { margin-top:24px; color:white; font-size:32px; font-weight:900; letter-spacing:-1px; }
.splash-sub { margin-top:6px; color:rgba(255,255,255,.85); font-size:14px; font-weight:700; }
.splash-loader { margin-top:32px; width:180px; height:4px; background:rgba(255,255,255,.2); border-radius:2px; overflow:hidden; }
.splash-loader-bar { height:100%; background:white; border-radius:2px; width:0; animation:load 1.5s ease-in-out forwards; }
@keyframes load { 0%{width:0;} 100%{width:100%;} }

.modal { position:fixed; inset:0; background:rgba(15,23,42,.7); display:flex; align-items:center; justify-content:center; z-index:9999; padding:16px; animation:fadeIn .2s ease; }
@keyframes fadeIn { from{opacity:0;} to{opacity:1;} }
.modal-content { background:var(--card); border-radius:var(--r-xl); padding:24px; max-width:500px; width:100%; max-height:88vh; overflow-y:auto; box-shadow:var(--shadow-xl); animation:modalIn .3s cubic-bezier(.34,1.56,.64,1); }
@keyframes modalIn { from{transform:scale(.92) translateY(30px);opacity:0;} to{transform:scale(1) translateY(0);opacity:1;} }
.modal-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; gap:12px; }
.modal-title { font-size:18px; font-weight:900; flex:1; }
.modal-close { width:36px; height:36px; border-radius:50%; background:var(--card-2); color:var(--text-2); font-size:16px; transition:all var(--t); flex-shrink:0; }
.modal-close:hover { background:var(--danger-bg); color:var(--danger); }

#toast-root { position:fixed; bottom:calc(24px + var(--safe-bottom)); left:50%; transform:translateX(-50%); z-index:99999; display:flex; flex-direction:column; gap:8px; align-items:center; pointer-events:none; max-width:calc(100% - 32px); }
.toast { padding:12px 20px; border-radius:var(--r); background:var(--text); color:var(--bg); font-size:13px; font-weight:800; box-shadow:var(--shadow-lg); opacity:0; transform:translateY(20px); transition:all .3s; pointer-events:auto; max-width:100%; text-align:center; }
.toast.show { opacity:1; transform:translateY(0); }
.toast.success { background:var(--success); color:white; }
.toast.error { background:var(--danger); color:white; }
.toast.warning { background:var(--warning); color:#78350F; }
.toast.info { background:var(--info); color:white; }

.spinner { display:inline-block; width:16px; height:16px; border:2px solid rgba(255,255,255,.3); border-radius:50%; border-top-color:white; animation:spin .7s linear infinite; vertical-align:middle; }
@keyframes spin { to{transform:rotate(360deg);} }

.hidden { display:none!important; }
.flex { display:flex; }
.items-center { align-items:center; }
.justify-center { justify-content:center; }
.justify-between { justify-content:space-between; }
.gap-2 { gap:8px; }
.gap-3 { gap:12px; }
.gap-4 { gap:16px; }
.mb-2 { margin-bottom:8px; }
.mb-3 { margin-bottom:12px; }
.mb-4 { margin-bottom:16px; }
.mt-2 { margin-top:8px; }
.mt-4 { margin-top:16px; }

.app-shell { min-height:100dvh; display:flex; flex-direction:column; }
.app-header { position:sticky; top:0; z-index:100; background:var(--card); border-bottom:1px solid var(--border); padding:12px 20px; padding-top:max(12px,var(--safe-top)); display:flex; align-items:center; gap:12px; box-shadow:var(--shadow-sm); }
.header-brand { display:flex; align-items:center; gap:10px; flex-shrink:0; }
.header-logo { width:36px; height:36px; background:var(--grad); border-radius:10px; display:flex; align-items:center; justify-content:center; color:white; font-weight:900; font-size:15px; box-shadow:var(--shadow-sm); }
.header-text { display:flex; flex-direction:column; line-height:1.2; }
.header-title { font-size:15px; font-weight:900; color:var(--text); }
.header-sub { font-size:10px; color:var(--text-3); font-weight:700; }
.header-spacer { flex:1; }
.header-actions { display:flex; align-items:center; gap:8px; }
.user-chip { display:flex; align-items:center; gap:8px; padding:4px 12px 4px 4px; border-radius:var(--r-full); background:var(--card-2); border:1px solid var(--border); cursor:pointer; transition:all var(--t); }
.user-chip:hover { background:var(--card-3); border-color:var(--brand-light); }
.user-avatar { width:32px; height:32px; border-radius:50%; background:var(--grad); color:white; display:flex; align-items:center; justify-content:center; font-size:15px; font-weight:800; flex-shrink:0; }
.user-info { display:flex; flex-direction:column; line-height:1.2; }
.user-name { font-size:12px; font-weight:800; color:var(--text); max-width:80px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.user-level { font-size:10px; color:var(--text-3); font-weight:700; }
.app-main { flex:1; max-width:1200px; margin:0 auto; width:100%; padding:20px; padding-bottom:calc(24px + var(--safe-bottom)); }

.bottom-nav { position:fixed; bottom:0; left:0; right:0; background:var(--card); border-top:1px solid var(--border); padding:6px 8px; padding-bottom:max(6px,var(--safe-bottom)); display:flex; justify-content:space-around; z-index:99; box-shadow:0 -4px 20px rgba(15,23,42,.06); }
.nav-item { flex:1; display:flex; flex-direction:column; align-items:center; gap:2px; padding:8px 4px; border-radius:var(--r); cursor:pointer; transition:all var(--t); color:var(--text-3); font-size:10px; font-weight:800; border:none; background:none; }
.nav-item-icon { font-size:20px; line-height:1; transition:transform var(--t); }
.nav-item.active { color:var(--brand); background:var(--brand-soft); }
.nav-item.active .nav-item-icon { transform:scale(1.15); }

@media (min-width:1024px) {
  .bottom-nav { display:none; }
}

@media (max-width:768px) {
  .app-main { padding:12px; padding-bottom:calc(80px + var(--safe-bottom)); }
  .app-header { padding:8px 12px; padding-top:max(8px,var(--safe-top)); }
  .header-text { display:none; }
  .header-logo { width:32px; height:32px; font-size:13px; }
  .user-info { display:none; }
  .user-chip { padding:3px; }
  .btn { padding:10px 18px; font-size:13px; min-height:40px; }
  .btn-sm { padding:7px 12px; font-size:12px; min-height:34px; }
  .btn-icon { width:38px; height:38px; font-size:16px; }
  .card { padding:16px; }
  .modal { align-items:flex-end; padding:8px; }
  .modal-content { max-width:100%; border-radius:var(--r-lg) var(--r-lg) 0 0; max-height:92dvh; padding:20px 16px; padding-bottom:max(20px,var(--safe-bottom)); }
  #toast-root { bottom:calc(90px + var(--safe-bottom)); }
  .grid-2, .grid-3, .grid-4 { grid-template-columns:1fr; }
  .nav-item { font-size:9px; padding:6px 2px; }
  .nav-item-icon { font-size:18px; }
}

@media (prefers-reduced-motion:reduce) {
  *, *::before, *::after { animation-duration:.01ms!important; transition-duration:.01ms!important; }
}

::-webkit-scrollbar { width:8px; height:8px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:var(--border-2); border-radius:4px; }
::-webkit-scrollbar-thumb:hover { background:var(--text-3); }
</style>
</head>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

<script>
/* ═══════════════════════════════════════════════════════
   YasEdu v6 — Core (الجزء 1 من 5)
   ═══════════════════════════════════════════════════════ */
(function(){
'use strict';

// ═══ CONFIG ═══
const CONFIG = {
  version: '6.0.0',
  name: 'YasEdu',
  firebase: {
    apiKey: "AIzaSyBU4LQ6TKX5Vn9uiQKr-tFrmTj6H8eoZRA",
    authDomain: "aaaa-c3572.firebaseapp.com",
    databaseURL: "https://aaaa-c3572-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "aaaa-c3572",
    storageBucket: "aaaa-c3572.firebasestorage.app",
    messagingSenderId: "374251579590",
    appId: "1:374251579590:web:083c379107735906380fc7"
  },
  keys: { session:'v6_session', stats:'v6_stats', theme:'v6_theme', palette:'v6_palette' }
};

// ═══ STATE ═══
const State = {
  _data: {
    session: { uid:null, name:'', email:'', avatar:'👤', role:'member' },
    stats: { xp:0, level:1, streak:0 },
    ui: { screen:'auth', theme:'light', palette:'default' }
  },
  _listeners: [],
  get(p) { return p.split('.').reduce((o,k)=>o?.[k], this._data); },
  set(p, v) {
    const keys = p.split('.');
    const last = keys.pop();
    let t = this._data;
    keys.forEach(k => { if (!t[k]) t[k] = {}; t = t[k]; });
    t[last] = v;
    this._notify(p, v);
  },
  update(p, patch) { this.set(p, { ...this.get(p), ...patch }); },
  onChange(fn) { this._listeners.push(fn); return () => { const i = this._listeners.indexOf(fn); if (i > -1) this._listeners.splice(i, 1); }; },
  _notify(p, v) { this._listeners.forEach(fn => { try { fn(p, v); } catch(e) {} }); }
};

// ═══ UTILS ═══
const U = {
  $: (id) => document.getElementById(id),
  $$: (sel) => document.querySelectorAll(sel),
  el(tag, attrs = {}, ...children) {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (k === 'class') e.className = v;
      else if (k === 'style' && typeof v === 'object') Object.assign(e.style, v);
      else if (k.startsWith('on') && typeof v === 'function') e.addEventListener(k.slice(2), v);
      else if (k === 'html') e.innerHTML = v;
      else if (k === 'text') e.textContent = v;
      else if (v === true) e.setAttribute(k, '');
      else if (v !== false && v != null) e.setAttribute(k, v);
    }
    children.flat().forEach(c => { if (c == null || c === false) return; e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return e;
  },
  esc(t) { const d = document.createElement('div'); d.textContent = String(t ?? ''); return d.innerHTML; },
  genId(p = 'id') { return p + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); },
  fmtTime(ts) { try { return new Date(ts).toLocaleTimeString('ar-EG', { hour:'2-digit', minute:'2-digit' }); } catch(e) { return ''; } },
  fmtDate(ts) { try { return new Date(ts).toLocaleDateString('ar-EG'); } catch(e) { return ''; } },
  ls: {
    get(k, d = null) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch(e) { return false; } },
    del(k) { try { localStorage.removeItem(k); } catch(e) {} }
  },
  haptic(ms = 10) { try { if (navigator.vibrate) navigator.vibrate(ms); } catch(e) {} },
  _audioCtx: null,
  sound(type = 'success') {
    try {
      if (!this._audioCtx) this._audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const ctx = this._audioCtx;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      const freqs = { success:[523,659,784], error:[300,200], xp:[659,880], click:[600], notify:[800,1000] };
      const notes = freqs[type] || freqs.success;
      gain.gain.setValueAtTime(0.08, ctx.currentTime);
      notes.forEach((f,i) => osc.frequency.setValueAtTime(f, ctx.currentTime + i * 0.08));
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + notes.length * 0.08);
      osc.start(ctx.currentTime);
      osc.stop(ctx.currentTime + notes.length * 0.08);
    } catch(e) {}
  },
  async sha256(text) {
    const buf = new TextEncoder().encode(text);
    const hash = await crypto.subtle.digest('SHA-256', buf);
    return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
  },
  genSalt() { return Math.random().toString(36).slice(2, 10) + Date.now().toString(36); },
  async hashPw(pw, salt) { return this.sha256(salt + '::' + pw + '::yasedu_v6'); }
};

// ═══ UI ═══
const UI = {
  toast(msg, type = 'info', dur = 3000) {
    const root = U.$('toast-root');
    if (!root) return;
    const icons = { success:'✅', error:'❌', warning:'⚠️', info:'ℹ️' };
    const el = U.el('div', { class:'toast ' + type }, (icons[type] || '') + ' ' + msg);
    root.appendChild(el);
    requestAnimationFrame(() => el.classList.add('show'));
    setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 300); }, dur);
  },
  modal({ id = U.genId('modal'), title, content, onClose } = {}) {
    const root = U.$('modal-root');
    if (!root) return null;
    const existing = U.$('modal-' + id);
    if (existing) existing.remove();
    const modal = U.el('div', { class:'modal', id:'modal-' + id });
    const contentEl = U.el('div', { class:'modal-content' });
    if (title) {
      const header = U.el('div', { class:'modal-header' });
      header.appendChild(U.el('div', { class:'modal-title' }, title));
      const closeBtn = U.el('button', { class:'modal-close', type:'button' }, '✕');
      closeBtn.onclick = () => this.closeModal(id, onClose);
      header.appendChild(closeBtn);
      contentEl.appendChild(header);
    }
    if (typeof content === 'string') contentEl.insertAdjacentHTML('beforeend', content);
    else if (content instanceof Node) contentEl.appendChild(content);
    modal.appendChild(contentEl);
    modal.onclick = (e) => { if (e.target === modal) this.closeModal(id, onClose); };
    root.appendChild(modal);
    return { id, el: modal, content: contentEl };
  },
  closeModal(id, cb) {
    const m = U.$('modal-' + id);
    if (m) { m.style.opacity = '0'; setTimeout(() => { m.remove(); if (typeof cb === 'function') cb(); }, 200); }
  },
  closeAllModals() { U.$$('.modal').forEach(m => m.remove()); },
  confirm(title, message) {
    return new Promise((resolve) => {
      const modal = this.modal({
        title,
        content: `
          <p style="margin-bottom:16px;color:var(--text-2);font-size:14px;">${U.esc(message)}</p>
          <div style="display:flex;gap:8px;">
            <button class="btn btn-danger btn-block" id="confirm-yes">نعم</button>
            <button class="btn btn-light btn-block" id="confirm-no">إلغاء</button>
          </div>
        `,
        onClose: () => resolve(false)
      });
      if (!modal) return resolve(false);
      modal.content.querySelector('#confirm-yes').onclick = () => { this.closeModal(modal.id); resolve(true); };
      modal.content.querySelector('#confirm-no').onclick = () => { this.closeModal(modal.id); resolve(false); };
    });
  }
};

// ═══ THEME ═══
const Theme = {
  init() {
    const saved = U.ls.get(CONFIG.keys.theme, null);
    const palette = U.ls.get(CONFIG.keys.palette, 'default');
    let theme = saved;
    if (!theme) { const h = new Date().getHours(); theme = (h >= 18 || h < 6) ? 'dark' : 'light'; }
    this.set(theme, palette);
  },
  set(theme, palette) {
    document.body.setAttribute('data-theme', theme);
    document.body.setAttribute('data-palette', palette || 'default');
    U.ls.set(CONFIG.keys.theme, theme);
    if (palette) U.ls.set(CONFIG.keys.palette, palette);
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', theme === 'dark' ? '#0F172A' : '#4F46E5');
    State.set('ui.theme', theme);
    State.set('ui.palette', palette || 'default');
  },
  toggle() {
    const current = document.body.getAttribute('data-theme');
    const next = current === 'dark' ? 'light' : 'dark';
    this.set(next, document.body.getAttribute('data-palette'));
    U.haptic(8);
    return next;
  },
  setPalette(palette) { this.set(document.body.getAttribute('data-theme') || 'light', palette); },
  isDark() { return document.body.getAttribute('data-theme') === 'dark'; }
};

// ═══ SESSION ═══
const Session = {
  save(user) {
    State.set('session', { uid:user.uid, name:user.name, email:user.email || '', avatar:user.avatar || '👤', role:user.role || 'member' });
    State.set('stats', { xp:user.xp || 0, level:user.level || 1, streak:user.streak || 0 });
    U.ls.set(CONFIG.keys.session, State.get('session'));
    U.ls.set(CONFIG.keys.stats, State.get('stats'));
  },
  load() {
    const saved = U.ls.get(CONFIG.keys.session, null);
    if (!saved || !saved.uid) return false;
    State.set('session', saved);
    State.set('stats', U.ls.get(CONFIG.keys.stats, { xp:0, level:1, streak:0 }));
    return true;
  },
  clear() {
    State.set('session', { uid:null, name:'', email:'', avatar:'👤', role:'member' });
    State.set('stats', { xp:0, level:1, streak:0 });
    U.ls.del(CONFIG.keys.session);
    U.ls.del(CONFIG.keys.stats);
  },
  isLoggedIn() { return !!State.get('session.uid'); },
  isAdmin() {
    const s = State.get('session');
    return s.role === 'developer' || s.name === 'admin' || (s.uid || '').startsWith('admin_');
  },
  addXP(amount) {
    const stats = State.get('stats');
    stats.xp += amount;
    const thresholds = [0,100,250,500,900,1400,2000,2800,3800,5000,6500,8300,10500,13000,16000,19500,23500,28000,33000,40000];
    let newLevel = 1;
    for (let i = thresholds.length - 1; i >= 0; i--) { if (stats.xp >= thresholds[i]) { newLevel = i + 1; break; } }
    const leveledUp = newLevel > stats.level;
    stats.level = newLevel;
    State.set('stats', stats);
    U.ls.set(CONFIG.keys.stats, stats);
    if (leveledUp) {
      UI.toast('🎉 وصلت للمستوى ' + newLevel + '!', 'success', 4000);
      U.sound('xp');
      U.haptic(30);
    }
    if (State.get('session.uid') && !State.get('session.uid').startsWith('guest') && window.db) {
      window.db.ref('users/' + State.get('session.uid')).update({ xp:stats.xp, level:stats.level, lastActive:Date.now() }).catch(() => {});
    }
  }
};

// ═══ ROUTER ═══
const Router = {
  _routes: {},
  _current: null,
  _hooks: [],
  register(name, renderFn) { this._routes[name] = { render: renderFn }; },
  beforeNavigate(fn) { this._hooks.push(fn); },
  go(name, params = {}) {
    for (const hook of this._hooks) { if (hook(name, params) === false) return false; }
    const route = this._routes[name];
    if (!route) { console.warn('Route not found:', name); return false; }
    State.set('ui.screen', name);
    this._current = name;
    const appRoot = U.$('app-root');
    if (!appRoot) return false;
    try {
      const result = route.render(params);
      if (typeof result === 'string') appRoot.innerHTML = result;
      else if (result instanceof Node) { appRoot.innerHTML = ''; appRoot.appendChild(result); }
      try { history.replaceState({}, '', '#' + name); } catch(e) {}
      window.scrollTo({ top:0, behavior:'instant' });
    } catch(e) {
      console.error('Render error:', name, e);
      UI.toast('خطأ في العرض: ' + e.message, 'error');
    }
    return true;
  },
  current() { return this._current; }
};

// ═══ FIREBASE ═══
let db = null;
function initFirebase() {
  try {
    if (typeof firebase === 'undefined') { console.warn('[Firebase] SDK مش محمّل'); return false; }
    if (!firebase.apps.length) firebase.initializeApp(CONFIG.firebase);
    db = firebase.database();
    window.db = db;
    return true;
  } catch(e) { console.error('[Firebase] Init error:', e); return false; }
}

function renderBottomNav(active) {

}

// ═══ EXPORT ═══
window.Core = {

  utils: U,

  theme: Theme,

};

function init() {

}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
else init();

console.log('%c✅ Core Loaded (1/5)', 'color:#10B981;font-weight:bold;');
console.log('   State | Utils | UI | Theme | Session | Router | Firebase');
console.log('   جرّب: window.Core.state.get("session")');

})();

// ═══ AUTH ACTIONS ═══
const Auth = {
  switchTab(tab) {
    U.$$('.auth-tab').forEach(t => {
      const isActive = t.dataset.tab === tab;
      t.classList.toggle('active', isActive);
      t.style.color = isActive ? 'var(--brand)' : 'var(--text-2)';
      t.style.background = isActive ? 'var(--card)' : 'transparent';
    });
    U.$('form-signin').style.display = tab === 'signin' ? 'block' : 'none';
    U.$('form-signup').style.display = tab === 'signup' ? 'block' : 'none';
  },
  togglePw(btn, id) {
    const input = U.$(id);
    if (!input) return;
    input.type = input.type === 'password' ? 'text' : 'password';
    btn.textContent = input.type === 'password' ? '👁️' : '🙈';
  },
  pickAvatar(el) {
    U.$$('.avatar-pick').forEach(a => { a.style.borderColor = 'transparent'; a.style.background = 'var(--card-2)'; });
    el.style.borderColor = 'var(--brand)';
    el.style.background = 'var(--brand-soft)';
  },
  async signin(e) {
    e.preventDefault();
    const id = U.$('signin-id').value.trim().toLowerCase();
    const pw = U.$('signin-pw').value;
    if (!id || !pw) return UI.toast('أكمل البيانات', 'error');

    const btn = e.target.querySelector('button[type="submit"]');
    const orig = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> جاري الدخول...';

    try {
      // Admin shortcut
      if ((id === 'admin' || id === 'admin@yasedu.dev') && pw === 'Admin@2025') {
        await this._adminLogin();
        btn.disabled = false;
        btn.innerHTML = orig;
        return;
      }

      if (!window.db) throw new Error('Firebase غير متصل');

      let user = null, uid = null;
      const byEmail = await window.db.ref('users').orderByChild('email').equalTo(id).once('value');
      if (byEmail.exists()) {
        const val = byEmail.val();
        uid = Object.keys(val)[0];
        user = val[uid];
      } else {
        const byName = await window.db.ref('users').orderByChild('name').equalTo(id).once('value');
        if (byName.exists()) {
          const val = byName.val();
          uid = Object.keys(val)[0];
          user = val[uid];
        }
      }

      if (!user) { UI.toast('البريد/الاسم أو كلمة السر غلط', 'error'); btn.disabled = false; btn.innerHTML = orig; return; }
      if (user.banned) { UI.toast('🚫 الحساب محظور', 'error'); btn.disabled = false; btn.innerHTML = orig; return; }

      const hash = await U.hashPw(pw, user.salt || '');
      if (hash !== user.hash) { UI.toast('البريد/الاسم أو كلمة السر غلط', 'error'); btn.disabled = false; btn.innerHTML = orig; return; }

      Session.save({ uid, ...user });
      await window.db.ref('users/' + uid + '/lastActive').set(Date.now());
      U.sound('success');
      U.haptic(20);
      UI.toast('👋 أهلاً ' + user.name, 'success');
      setTimeout(() => Router.go('home'), 300);
    } catch(err) {
      console.error(err);
      UI.toast('خطأ: ' + err.message, 'error');
      btn.disabled = false;
      btn.innerHTML = orig;
    }
  },
  async signup(e) {
    e.preventDefault();
    const name = U.$('signup-name').value.trim();
    const email = U.$('signup-email').value.trim().toLowerCase();
    const pw = U.$('signup-pw').value;
    const secretQ = U.$('signup-secret-q').value.trim();
    const secretA = U.$('signup-secret-a').value.trim();
    const av = document.querySelector('.avatar-pick.selected');
    const avatar = av ? av.dataset.avatar : '🧑‍🎓';

    if (!name || name.length < 2) return UI.toast('الاسم قصير', 'error');
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return UI.toast('بريد غير صالح', 'error');
    if (pw.length < 6) return UI.toast('كلمة السر قصيرة (6+)', 'error');
    if (!secretQ || !secretA) return UI.toast('أكمل السؤال السري', 'error');

    const btn = e.target.querySelector('button[type="submit"]');
    const orig = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> إنشاء...';

    try {
      if (!window.db) throw new Error('Firebase غير متصل');

      const snap = await window.db.ref('users').orderByChild('email').equalTo(email).once('value');
      if (snap.exists()) { UI.toast('البريد مستخدم', 'error'); btn.disabled = false; btn.innerHTML = orig; return; }

      const uid = U.genId('u');
      const salt = U.genSalt();
      const hash = await U.hashPw(pw, salt);
      const secretHash = await U.sha256(secretA.toLowerCase());

      const userData = { name, email, avatar, salt, hash, secretQ, secretHash, role:'member', xp:0, level:1, streak:0, lastActive:Date.now(), createdAt:Date.now() };
      await window.db.ref('users/' + uid).set(userData);
      Session.save({ uid, ...userData });
      U.sound('success');
      U.haptic(20);
      UI.toast('🎉 تم إنشاء حسابك', 'success');
      setTimeout(() => Router.go('home'), 300);
    } catch(err) {
      console.error(err);
      UI.toast('خطأ: ' + err.message, 'error');
      btn.disabled = false;
      btn.innerHTML = orig;
    }
  },
  async _adminLogin() {
    if (!window.db) throw new Error('Firebase غير متصل');
    const snap = await window.db.ref('users').once('value');
    const users = snap.val() || {};
    let adminUid = null, adminUser = null;

    for (const uid in users) {
      if (users[uid].name === 'admin' || users[uid].email === 'admin@yasedu.dev') {
        adminUid = uid;
        adminUser = users[uid];
        break;
      }
    }

    if (!adminUid) {
      const salt = U.genSalt();
      const hash = await U.hashPw('Admin@2025', salt);
      const secretHash = await U.sha256('admin');
      adminUid = 'admin_' + Date.now();
      adminUser = { name:'admin', email:'admin@yasedu.dev', avatar:'👑', salt, hash, secretQ:'admin', secretHash, role:'developer', isAdmin:true, xp:0, level:99, streak:0, lastActive:Date.now(), createdAt:Date.now() };
      await window.db.ref('users/' + adminUid).set(adminUser);
    }

    Session.save({ uid:adminUid, ...adminUser });
    U.sound('success');
    U.haptic(30);
    UI.toast('👑 أهلاً يا أدمن', 'success');
    setTimeout(() => Router.go('home'), 300);
  },
  guest() {
    const guestId = U.genId('guest');
    const guestName = 'ضيف_' + Math.floor(Math.random() * 9000 + 1000);
    Session.save({ uid:guestId, name:guestName, avatar:'👤' });
    UI.toast('👤 دخلت كضيف', 'info');
    setTimeout(() => Router.go('home'), 200);
  },
  logout() {
    UI.confirm('🚪 تسجيل الخروج', 'هل تريد تسجيل الخروج؟').then(ok => {
      if (!ok) return;
      Session.clear();
      UI.toast('👋 تم تسجيل الخروج', 'info');
      U.haptic(10);
      setTimeout(() => Router.go('auth'), 300);
    });
  },
  _forgotUser: null,
  showForgot() {
    this._forgotUser = null;
    UI.modal({
      title: '🔑 نسيت كلمة السر',
      content: `
        <div id="forgot-step-1">
          <div class="field">
            <label>البريد</label>
            <input class="input" type="email" id="forgot-email" placeholder="you@example.com">
          </div>
          <button class="btn btn-block" onclick="Core.auth._forgotFind()">التالي</button>
        </div>
        <div id="forgot-step-2" style="display:none;">
          <p id="forgot-secret-q" style="font-size:14px;font-weight:800;margin-bottom:16px;color:var(--brand);"></p>
          <div class="field">
            <label>الإجابة</label>
            <input class="input" type="text" id="forgot-secret-a">
          </div>
          <div class="field">
            <label>كلمة السر الجديدة</label>
            <input class="input" type="password" id="forgot-newpw">
          </div>
          <button class="btn btn-block" onclick="Core.auth._forgotReset()">تغيير</button>
        </div>
      `
    });
  },
  async _forgotFind() {
    const email = U.$('forgot-email').value.trim().toLowerCase();
    if (!email) return UI.toast('أدخل البريد', 'error');
    try {
      const snap = await window.db.ref('users').orderByChild('email').equalTo(email).once('value');
      if (!snap.exists()) return UI.toast('البريد غير مسجل', 'error');
      const val = snap.val();
      const uid = Object.keys(val)[0];
      this._forgotUser = { uid, user:val[uid] };
      U.$('forgot-secret-q').textContent = '❓ ' + (this._forgotUser.user.secretQ || 'السؤال');
      U.$('forgot-step-1').style.display = 'none';
      U.$('forgot-step-2').style.display = 'block';
    } catch(e) { UI.toast('خطأ: ' + e.message, 'error'); }
  },
  async _forgotReset() {
    if (!this._forgotUser) return;
    const answer = U.$('forgot-secret-a').value.trim().toLowerCase();
    const newPw = U.$('forgot-newpw').value;
    if (!answer || !newPw) return UI.toast('أكمل البيانات', 'error');
    if (newPw.length < 6) return UI.toast('كلمة السر قصيرة', 'error');
    try {
      const answerHash = await U.sha256(answer);
      if (answerHash !== this._forgotUser.user.secretHash) return UI.toast('الإجابة غلط', 'error');
      const salt = U.genSalt();
      const hash = await U.hashPw(newPw, salt);
      await window.db.ref('users/' + this._forgotUser.uid).update({ salt, hash });
      UI.toast('✅ تم — سجّل دخول', 'success');
      UI.closeAllModals();
      this._forgotUser = null;
    } catch(e) { UI.toast('خطأ: ' + e.message, 'error'); }
  }
};

// ═══ PROFILE SCREEN ═══
function renderProfile() {
  const session = S.get('session');
  const stats = S.get('stats');
  if (!session.uid) { setTimeout(() => Router.go('auth'), 50); return '<div style="padding:40px;text-align:center;">جاري التحويل...</div>'; }

  const thresholds = [0,100,250,500,900,1400,2000,2800,3800,5000,6500,8300,10500,13000,16000,19500,23500,28000,33000,40000];
  const lvlStart = thresholds[stats.level - 1] || 0;
  const lvlEnd = thresholds[stats.level] || thresholds[thresholds.length - 1];
  const progress = lvlEnd > lvlStart ? Math.round(((stats.xp - lvlStart) / (lvlEnd - lvlStart)) * 100) : 100;
  const nextXP = Math.max(0, lvlEnd - stats.xp);

  let rank = { emoji:'🥉', name:'برونزي' };
  if (stats.level >= 50) rank = { emoji:'💠', name:'ماسي' };
  else if (stats.level >= 20) rank = { emoji:'💎', name:'بلاتيني' };
  else if (stats.level >= 10) rank = { emoji:'🥇', name:'ذهبي' };
  else if (stats.level >= 5) rank = { emoji:'🥈', name:'فضي' };

  return `
    <div class="app-shell">
      ${Core.renderHeader('الملف الشخصي')}
      <main class="app-main">
        <div style="text-align:center;margin-bottom:28px;">

                      background:var(--grad-gold);border-radius:999px;font-size:12px;font-weight:900;color:#78350F;">
            ${rank.emoji} ${rank.name} • Lv.${stats.level}
          </div>
        </div>

        <div class="card mb-4">
          <div style="display:flex;justify-content:space-between;font-size:12px;font-weight:800;color:var(--text-2);margin-bottom:8px;">
            <span>Level ${stats.level}</span>
            <span>${stats.xp} / ${lvlEnd} XP</span>
          </div>
          <div style="height:10px;background:var(--border);border-radius:5px;overflow:hidden;">
            <div style="height:100%;background:var(--grad-gold);border-radius:5px;width:${progress}%;transition:width .6s ease;"></div>
          </div>
          <div style="font-size:11px;color:var(--text-3);margin-top:8px;text-align:center;font-weight:700;">
            ${nextXP > 0 ? `${nextXP} XP للمستوى ${stats.level + 1}` : 'أعلى مستوى! 🏆'}
          </div>
        </div>

        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px;">
          <div class="card" style="text-align:center;padding:16px;">
            <div style="font-size:24px;font-weight:900;color:var(--brand);">${stats.xp}</div>
            <div style="font-size:11px;color:var(--text-2);font-weight:700;margin-top:4px;">XP</div>
          </div>
          <div class="card" style="text-align:center;padding:16px;">
            <div style="font-size:24px;font-weight:900;color:var(--brand);">${stats.level}</div>
            <div style="font-size:11px;color:var(--text-2);font-weight:700;margin-top:4px;">المستوى</div>
          </div>
          <div class="card" style="text-align:center;padding:16px;">
            <div style="font-size:24px;font-weight:900;color:var(--brand);">${stats.streak}🔥</div>
            <div style="font-size:11px;color:var(--text-2);font-weight:700;margin-top:4px;">Streak</div>

      ${Core.renderBottomNav('profile')}

  `;
}

Auth.editProfile = function() {

Auth._pickEditAvatar = function(el) {
  U.$$('#ep-avatars .avatar-pick').forEach(a => { a.style.borderColor = 'transparent'; a.style.background = 'var(--card-2)'; });
  el.style.borderColor = 'var(--brand)';
  el.style.background = 'var(--brand-soft)';
  this._editAvatar = el.dataset.avatar;
};
Auth._saveProfile = async function() {
  const name = U.$('ep-name').value.trim();
  if (!name || name.length < 2) return UI.toast('الاسم قصير', 'error');
  const avatar = this._editAvatar || S.get('session.avatar');
  try {
    S.update('session', { name, avatar });
    U.ls.set(Core.config.keys.session, S.get('session'));
    if (S.get('session.uid') && !S.get('session.uid').startsWith('guest') && window.db) {
      await window.db.ref('users/' + S.get('session.uid')).update({ name, avatar });
    }
    UI.closeAllModals();
    UI.toast('✅ تم الحفظ', 'success');
    U.sound('success');
    U.haptic(20);
    if (Router.current() === 'profile') Router.go('profile');
  } catch(e) { UI.toast('خطأ: ' + e.message, 'error'); }
};

Auth._clearCache = function() {
  UI.confirm('🗑 مسح الكاش', 'مسح البيانات المحلية؟ (لن يحذف الحساب)').then(ok => {
    if (!ok) return;
    const keep = [Core.config.keys.session, Core.config.keys.stats, Core.config.keys.theme, Core.config.keys.palette];
    Object.keys(localStorage).forEach(k => { if (!keep.includes(k)) localStorage.removeItem(k); });
    UI.toast('✅ تم مسح الكاش', 'success');
    setTimeout(() => location.reload(), 800);
  });
};

// ═══ START SESSION ═══
function startSession() {
  const session = S.get('session');
  const room = ChatState.currentRoom;
  if (!session.uid || !window.db) {
    console.error('[Chat] Cannot start session:', { uid: session.uid, db: !!window.db });
    return;
  }

  console.log('🔌 Starting chat session:', room);

  ChatState.listeners.forEach(ref => { try { ref.off(); } catch(e) {} });
  ChatState.listeners = [];
  if (ChatState.heartbeatInt) clearInterval(ChatState.heartbeatInt);

  const userRef = window.db.ref('rooms/' + room + '/users/' + session.uid);
  userRef.set({ name:session.name, avatar:session.avatar, online:true, lastSeen:firebase.database.ServerValue.TIMESTAMP });
  userRef.onDisconnect().remove();

  ChatState.heartbeatInt = setInterval(() => {
    window.db.ref('rooms/' + room + '/users/' + session.uid + '/lastSeen').set(firebase.database.ServerValue.TIMESTAMP);
  }, 20000);

  const usersRef = window.db.ref('rooms/' + room + '/users');
  usersRef.on('value', snap => {
    const users = snap.val() || {};
    const now = Date.now();
    let active = 0;
    Object.keys(users).forEach(uid => {
      const u = users[uid];
      const ls = u.lastSeen || 0;
      if (now - ls > 90000 && uid !== session.uid) {
        window.db.ref('rooms/' + room + '/users/' + uid).remove();
      } else active++;
    });
    ChatState.users = users;
    const el = U.$('chat-online');
    if (el) el.textContent = '🟢 ' + active + ' متصل';
  });
  ChatState.listeners.push(usersRef);

  const msgRef = window.db.ref('rooms/' + room + '/messages').limitToLast(200);
  msgRef.on('value', snap => {
    ChatState.messages = snap.val() || {};
    console.log('📨 Messages:', Object.keys(ChatState.messages).length);
    if (Router.current() === 'chat') renderMessages();
  });
  ChatState.listeners.push(msgRef);

  const typingRef = window.db.ref('rooms/' + room + '/typing');
  typingRef.on('value', snap => {
    const t = snap.val() || {};
    const names = Object.keys(t)
      .filter(uid => uid !== session.uid && (Date.now() - (t[uid].ts || 0)) < 4000)
      .map(uid => t[uid].name);
    const bar = U.$('typing-bar');
    if (bar) bar.textContent = names.length ? names.join(', ') + ' يكتب...' : '';
  });
  ChatState.listeners.push(typingRef);

  console.log('✅ Chat session started');
}

// ═══ RENDER MESSAGES ═══
function renderMessages() {
  const body = U.$('chat-body');
  if (!body) return;
  const session = S.get('session');
  const msgs = ChatState.messages;
  const keys = Object.keys(msgs).sort((a, b) => (msgs[a].timestamp || 0) - (msgs[b].timestamp || 0));

  if (!keys.length) {
    body.innerHTML = '<div class="chat-empty"><div class="chat-empty-icon">💬</div><div class="chat-empty-title">لا توجد رسائل</div><div class="chat-empty-desc">كن أول من يبدأ!</div></div>';
    return;
  }

  const atBottom = body.scrollHeight - body.scrollTop - body.clientHeight < 100;
  body.innerHTML = keys.map(k => renderMessage(k, msgs[k], session)).join('');
  if (atBottom) body.scrollTop = body.scrollHeight;
}

function renderMessage(id, m, session) {
  const mine = m.userId === session.uid;
  const bot = m.userId === 'bot';
  const cls = mine ? 'mine' : (bot ? 'bot' : '');
  const time = m.timestamp ? U.fmtTime(m.timestamp) : '';

  let content = '';
  if (m.type === 'image') {
    content = `<img class="msg-img" src="${U.esc(m.media.data)}" onclick="Core.chat.lightbox('${U.esc(m.media.data)}')" loading="lazy">`;
    if (m.text) content += `<div style="margin-top:6px;">${U.esc(m.text)}</div>`;
  } else if (m.type === 'audio') {
    const dur = Math.round(m.media.duration || 0);
    const bars = Array.from({ length: 20 }, () => `<span style="height:${6 + Math.random() * 16}px"></span>`).join('');
    content = `
      <div class="msg-audio">
        <button class="msg-audio-play" onclick="Core.chat.toggleAudio('${id}')" id="play-${id}">▶</button>
        <div class="audio-wave">${bars}</div>
        <span style="font-size:11px;opacity:.8;">${dur}ث</span>
      </div>
      <audio id="audio-${id}" src="${U.esc(m.media.data)}" preload="metadata"></audio>
    `;
  } else {
    content = U.esc(m.text || '');
  }

  let replyCtx = '';
  if (m.replyTo) {
    replyCtx = `<div class="msg-reply-ctx"><div class="name">↩ ${U.esc(m.replyTo.name)}</div><div class="preview">${U.esc(m.replyTo.preview)}</div></div>`;
  }

  let reactionsHtml = '';
  if (m.reactions && Object.keys(m.reactions).length) {
    reactionsHtml = '<div class="msg-reactions">' + Object.entries(m.reactions).map(([emo, users]) => {
      const count = Object.keys(users || {}).length;
      const isMine = (users || {})[session.uid];
      return `<button class="reaction-chip ${isMine ? 'mine' : ''}" onclick="Core.chat.react('${id}','${emo}')">${emo} ${count}</button>`;
    }).join('') + '</div>';
  }

  const actions = `
    <div class="msg-actions">
      <button class="msg-action" onclick="Core.chat.replyTo('${id}')">↩ رد</button>
      <button class="msg-action" onclick="Core.chat.react('${id}','❤️')">❤️</button>
      <button class="msg-action" onclick="Core.chat.react('${id}','👍')">👍</button>
      ${mine ? `<button class="msg-action" onclick="Core.chat.deleteMsg('${id}')">🗑</button>` : ''}
    </div>
  `;

  return `
    <div class="msg-row ${cls}">
      <div class="msg-avatar">${m.avatar || '👤'}</div>
      <div class="msg-content">
        <div class="msg-meta">${U.esc(m.name || 'مجهول')} • ${time}</div>
        <div class="msg-bubble">${replyCtx}${content}</div>
        ${reactionsHtml}
        ${actions}
      </div>
    </div>
  `;
}

// ═══ SEND ═══
function sendMessage() {
  const input = U.$('chat-input');
  const text = input?.value.trim();
  if (!text) return;
  const session = S.get('session');
  if (!session.uid) return UI.toast('سجّل دخول', 'error');
  if (!window.db) return UI.toast('❌ Firebase غير متصل', 'error');

  const id = U.genId('m');
  const payload = { type:'text', text, name:session.name, avatar:session.avatar, userId:session.uid, timestamp:firebase.database.ServerValue.TIMESTAMP };

  if (ChatState.replyTo) {
    payload.replyTo = ChatState.replyTo;
    cancelReply();
  }

  console.log('📤 Sending:', text);
  window.db.ref('rooms/' + ChatState.currentRoom + '/messages/' + id).set(payload)
    .then(() => { console.log('✅ Sent:', id); U.haptic(6); Session.addXP(2); })
    .catch(e => { console.error('❌ Send failed:', e); UI.toast('فشل: ' + e.message, 'error'); });

  input.value = '';
  input.focus();

  if (/@bot/i.test(text) || text.includes('؟') || text.includes('?')) {
    setTimeout(() => botReply(text), 500);
  }
}

// ═══ TYPING ═══
function sendTyping() {
  const session = S.get('session');
  if (!session.uid || !window.db) return;
  const ref = window.db.ref('rooms/' + ChatState.currentRoom + '/typing/' + session.uid);
  ref.set({ name:session.name, ts:Date.now() });
  ref.onDisconnect().remove();
  clearTimeout(ChatState.typingTimeout);
  ChatState.typingTimeout = setTimeout(() => ref.remove(), 2500);
}

// ═══ REPLY / REACT / DELETE ═══
function replyTo(id) {
  const m = ChatState.messages[id];
  if (!m) return;
  const preview = m.type === 'image' ? '📷 صورة' : m.type === 'audio' ? '🎤 صوت' : (m.text || '').slice(0, 50);
  ChatState.replyTo = { id, name:m.name || 'مجهول', preview, type:m.type || 'text' };
  U.$('reply-name').textContent = '↩ ' + ChatState.replyTo.name;
  U.$('reply-text').textContent = preview;
  U.$('reply-preview').classList.add('show');
  U.$('chat-input')?.focus();
  U.haptic(8);
}

function cancelReply() {
  ChatState.replyTo = null;
  U.$('reply-preview')?.classList.remove('show');
}

function react(id, emo) {
  const session = S.get('session');
  if (!session.uid) return;
  const ref = window.db.ref('rooms/' + ChatState.currentRoom + '/messages/' + id + '/reactions/' + emo + '/' + session.uid);
  ref.once('value').then(s => { if (s.val()) ref.remove(); else ref.set(true); });
  U.haptic(5);
}

function deleteMsg(id) {
  UI.confirm('🗑 حذف', 'حذف هذه الرسالة؟').then(ok => {
    if (!ok) return;
    window.db.ref('rooms/' + ChatState.currentRoom + '/messages/' + id).remove();
    UI.toast('تم الحذف', 'success');
  });
}

// ═══ EMOJI ═══
function showEmoji(btn) {
  const existing = document.querySelector('.emoji-picker');
  if (existing) { existing.remove(); return; }
  const emojis = ['😀','😁','😂','🤣','😊','😍','🤔','😎','😢','😡','👍','👎','❤️','🔥','✨','🎉','💯','👏','🙏','💪','🎓','📚','📝','✅','❌','⭐','🚀','💡'];
  const picker = document.createElement('div');
  picker.className = 'emoji-picker';
  picker.innerHTML = emojis.map(e => `<button onclick="Core.chat.insertEmoji('${e}')">${e}</button>`).join('');
  const parent = btn.closest('.chat-input-area');
  if (parent) parent.appendChild(picker);
  setTimeout(() => {
    document.addEventListener('click', function closeP(e) {
      if (!picker.contains(e.target) && e.target !== btn) {
        picker.remove();
        document.removeEventListener('click', closeP);
      }
    }, { once:true });
  }, 10);
}

function insertEmoji(emoji) {
  const input = U.$('chat-input');
  if (input) { input.value += emoji; input.focus(); }
  document.querySelector('.emoji-picker')?.remove();
}

// ═══ IMAGE ═══
function pickImage() {
  const session = S.get('session');
  if (!session.uid) return UI.toast('سجّل دخول', 'error');
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  input.onchange = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    if (file.size > 5 * 1024 * 1024) return UI.toast('الصورة كبيرة (5MB max)', 'error');
    await prepareImage(file);
  };
  input.click();
}

async function prepareImage(file) {
  UI.toast('⏳ جاري المعالجة...', 'info', 1500);
  try {
    const blob = await compressImage(file, 800, 0.7);
    const reader = new FileReader();
    reader.onload = (e) => {
      ChatState.pendingMedia = { type:'image', dataUrl:e.target.result, size:blob.size };
      showMediaPreview();
    };
    reader.readAsDataURL(blob);
  } catch(err) { UI.toast('فشل: ' + err.message, 'error'); }
}

function compressImage(file, maxDim, quality) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const reader = new FileReader();
    reader.onload = (e) => {
      img.onload = () => {
        let w = img.width, h = img.height;
        if (w > maxDim || h > maxDim) {
          const r = Math.min(maxDim / w, maxDim / h);
          w = Math.round(w * r);
          h = Math.round(h * r);
        }
        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        canvas.toBlob(b => b ? resolve(b) : reject(new Error('canvas')), 'image/jpeg', quality);
      };
      img.onerror = () => reject(new Error('load'));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error('read'));
    reader.readAsDataURL(file);
  });
}

// ═══ AUDIO RECORDING ═══
async function toggleRecord() {
  const session = S.get('session');
  if (!session.uid) return UI.toast('سجّل دخول', 'error');
  if (ChatState.isRecording && ChatState.mediaRecorder && ChatState.mediaRecorder.state === 'recording') {
    stopRecord();
    return;
  }

  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio:true });
    const mime = MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : MediaRecorder.isTypeSupported('audio/mp4') ? 'audio/mp4' : '';
    ChatState.mediaRecorder = mime ? new MediaRecorder(stream, { mimeType:mime }) : new MediaRecorder(stream);
    ChatState.recordChunks = [];
    ChatState.isRecording = true;

    ChatState.mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) ChatState.recordChunks.push(e.data); };

    ChatState.mediaRecorder.onstop = async () => {
      stream.getTracks().forEach(t => t.stop());
      clearInterval(ChatState.recordTimer);
      ChatState.isRecording = false;
      const duration = (Date.now() - ChatState.recordStart) / 1000;
      const micBtn = U.$('mic-btn');
      if (micBtn) { micBtn.classList.remove('recording'); micBtn.textContent = '🎤'; }
      if (duration < 1) return UI.toast('تسجيل قصير', 'error');

      const blob = new Blob(ChatState.recordChunks, { type:ChatState.mediaRecorder.mimeType || 'audio/webm' });
      const reader = new FileReader();
      reader.onload = (e) => {
        ChatState.pendingMedia = { type:'audio', dataUrl:e.target.result, duration };
        showMediaPreview();
      };
      reader.readAsDataURL(blob);
    };

    ChatState.mediaRecorder.start();
    ChatState.recordStart = Date.now();
    const micBtn = U.$('mic-btn');
    if (micBtn) { micBtn.classList.add('recording'); micBtn.textContent = '⏹'; }
    U.haptic(15);
    UI.toast('🎤 جاري التسجيل', 'info', 2000);

    ChatState.recordTimer = setInterval(() => {
      const s = Math.floor((Date.now() - ChatState.recordStart) / 1000);
      if (s >= 180) { stopRecord(); UI.toast('الحد 3 دقائق', 'warning'); }
    }, 500);
  } catch(e) {
    UI.toast('تعذّر الميكروفون: ' + e.message, 'error');
    ChatState.isRecording = false;
  }
}

function stopRecord() {
  if (ChatState.mediaRecorder && ChatState.mediaRecorder.state === 'recording') ChatState.mediaRecorder.stop();
  ChatState.isRecording = false;
  const micBtn = U.$('mic-btn');
  if (micBtn) { micBtn.classList.remove('recording'); micBtn.textContent = '🎤'; }
}

async function sendPending() {
  if (!ChatState.pendingMedia || !window.db) return;
  const session = S.get('session');
  const media = ChatState.pendingMedia;
  const id = U.genId('m');
  const payload = {
    type: media.type,
    media: { data:media.dataUrl, duration:media.duration || 0, size:media.size || 0 },
    name: session.name, avatar: session.avatar, userId: session.uid,
    timestamp: firebase.database.ServerValue.TIMESTAMP
  };

  if (ChatState.replyTo) { payload.replyTo = ChatState.replyTo; cancelReply(); }

  try {
    if (media.dataUrl.length > 5 * 1024 * 1024) {
      UI.toast('الملف كبير — جرب حاجة أصغر', 'error');
      return;
    }
    await window.db.ref('rooms/' + ChatState.currentRoom + '/messages/' + id).set(payload);
    UI.toast('✅ تم الإرسال', 'success');
    Session.addXP(3);
    ChatState.pendingMedia = null;

}

    ChatState.currentAudio.pause();
    const prevBtn = U.$('play-' + ChatState.currentAudioId);
    if (prevBtn) prevBtn.textContent = '▶';
  }
  if (audio.paused) {
    audio.play();

    ChatState.currentAudio = audio;
    ChatState.currentAudioId = id;
    audio.onended = () => { if (btn) btn.textContent = '▶'; };
  } else {
    audio.pause();
    if (btn) btn.textContent = '▶';
  }
}

async function loadPublicRooms() {
  const list = U.$('public-rooms-list');
  if (!list) return;
  if (!window.db) { list.innerHTML = '<div style="text-align:center;padding:20px;color:var(--danger);">❌ Firebase غير متصل</div>'; return; }
  if (list.dataset.loaded === '1') return;
  list.dataset.loaded = '1';

  try {
    const snap = await window.db.ref('roomsMeta').once('value');
    const rooms = snap.val() || {};
    const publicRooms = Object.entries(rooms).filter(([k, v]) => !v.password && v.type !== 'private' && k !== 'GENERAL');
    if (!publicRooms.length) {
      list.innerHTML = '<div style="text-align:center;padding:20px;color:var(--text-3);font-size:13px;">لا غرف عامة بعد. كن أول من ينشئ!</div>';
      return;

    list.innerHTML = '<div class="rooms-grid">' + publicRooms.slice(0, 30).map(([code, r]) => `

}

async function createRoom() {
  const name = U.$('cr-name').value.trim();
  const emoji = U.$('cr-emoji').value.trim() || '🏠';
  const password = U.$('cr-password').value.trim();
  if (!name) return UI.toast('أدخل الاسم', 'error');
  if (!window.db) return UI.toast('Firebase غير متصل', 'error');
  const session = S.get('session');
  const code = 'R' + Math.random().toString(36).slice(2, 7).toUpperCase();
  try {
    await window.db.ref('roomsMeta/' + code).set({
      name, emoji, password: password || null, type: password ? 'private' : 'public',
      createdBy: session.name, createdById: session.uid, createdAt: Date.now()
    });
    UI.toast('✅ تم: ' + code, 'success', 5000);
    UI.closeAllModals();
    enterRoom(code);
  } catch(e) { UI.toast('خطأ: ' + e.message, 'error'); }
}

function showJoinRoom() {

async function joinRoomByCode() {
  const code = U.$('jr-code').value.trim().toUpperCase();
  const password = U.$('jr-password').value;
  if (!code) return UI.toast('أدخل الكود', 'error');
  if (!window.db) return UI.toast('Firebase غير متصل', 'error');
  try {
    const snap = await window.db.ref('roomsMeta/' + code).once('value');
    const room = snap.val();
    if (room && room.password && room.password !== password) return UI.toast('كلمة السر غلط', 'error');
    UI.closeAllModals();
    enterRoom(code);
  } catch(e) { UI.toast('خطأ: ' + e.message, 'error'); }
}

function enterRoom(code) {
  if (!code) return;
  const session = S.get('session');
  const myRooms = U.ls.get('v6_myRooms', []);
  if (!myRooms.includes(code)) { myRooms.push(code); U.ls.set('v6_myRooms', myRooms); }
  if (session.uid && window.db && ChatState.currentRoom) {
    window.db.ref('rooms/' + ChatState.currentRoom + '/users/' + session.uid).remove();
  }
  ChatState.currentRoom = code;
  UI.toast('✅ دخلت: ' + code, 'success');
  Router.go('chat');
}

function showMyRooms() {
  const myRooms = U.ls.get('v6_myRooms', [ChatState.currentRoom]);
  const list = myRooms.map(code => `
    <div class="room-card" style="margin-bottom:8px;" onclick="Core.ui.closeAllModals();Core.chat.enterRoom('${U.esc(code)}')">
      <div class="room-icon">🏠</div>
      <div class="room-info"><div class="room-name">${U.esc(code)}</div></div>
    </div>
  `).join('');
  UI.modal({ title: '🏠 غرفي', content: list || '<div style="text-align:center;padding:20px;color:var(--text-3);">لا غرف</div>' });
}

// ═══ ROUTES ═══
Router.register('chat', renderChat);
Router.register('rooms', renderRooms);

Router.beforeNavigate((screen) => {

Core.chat = {

  showInfo,
  enterRoom, showCreateRoom, createRoom, showJoinRoom, joinRoomByCode, showMyRooms,
  renderRooms, loadPublicRooms
};

console.log('%c✅ Chat + Rooms Loaded (3/5)', 'color:#10B981;font-weight:bold;');

})();

// ═══ PDF ═══
async function loadPDFJS() {
  if (typeof pdfjsLib !== 'undefined') return;
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    s.onload = resolve;
    s.onerror = reject;
    document.head.appendChild(s);
  });
}

async function handlePDF(e) {
  const file = e.target.files[0];
  if (!file) return;
  const status = U.$('pdf-status');
  if (status) status.textContent = '⏳ استخراج...';

  try {
    await loadPDFJS();
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    const buf = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
    let text = '';
    for (let i = 1; i <= pdf.numPages; i++) {
      const page = await pdf.getPage(i);
      const content = await page.getTextContent();
      text += content.items.map(x => x.str).join(' ') + '\n';
    }
    U.$('quiz-text').value = text.trim();
    if (status) status.textContent = `✅ ${pdf.numPages} صفحة`;
    UI.toast('✅ تم الاستخراج', 'success');
  } catch(e) {
    if (status) status.textContent = '❌ ' + e.message;
    UI.toast('فشل: ' + e.message, 'error');
  }
}

// ═══ GENERATOR ═══
const STOPWORDS = new Set(['في','من','على','إلى','عن','مع','هذا','هذه','ذلك','التي','الذي','كان','كانت','يكون','أن','إن','لا','ما','هل','قد','كل','بعض','بعد','قبل','بين','حيث','لكن','أو','و','ثم','هو','هي','هم','نحن','أنا','أنت','كما','حتى','عند','عندما','إذا','لأن','هناك','عليه','إليه','لها','له','بها','به','منها','منه','أيضا','فيه','فيها','جميع','تم','يتم','غير','وهو','وهي','the','is','a','an','of','to','in','and','or','for']);

function extractWords(text) {
  return text.split(/[^\u0600-\u06FFa-zA-Z0-9]+/).map(w => w.trim()).filter(w => w.length >= 4 && !STOPWORDS.has(w) && !/^\d+$/.test(w));
}

function generateQuestions(text, count, type, optsCount) {
  const clean = String(text).replace(/\s+/g, ' ').trim();
  if (clean.length < 80) throw new Error('النص قصير (80+ حرف)');
  let sentences = clean.split(/[.؟!؟\n]+/).map(s => s.trim()).filter(s => s.length >= 20);
  if (sentences.length < 3) sentences = clean.split(/[،,؛;:]+/).map(s => s.trim()).filter(s => s.length >= 20);
  if (sentences.length < 3) throw new Error('لم أستطع تقسيم النص');

  const allWords = new Set();
  sentences.forEach(s => extractWords(s).forEach(w => allWords.add(w)));
  const uniqueWords = Array.from(allWords);
  if (uniqueWords.length < 4) throw new Error('كلمات غير كافية');

  function buildMCQ(sen, words, cw, nOpts) {
    const idx = sen.indexOf(cw);
    if (idx === -1) return null;
    const qT = (sen.slice(0, idx) + '______' + sen.slice(idx + cw.length)).trim();
    if (qT.length < 15) return null;
    const distractors = [];
    words.forEach(w => { if (distractors.length < nOpts - 1 && w !== cw && !distractors.includes(w)) distractors.push(w); });
    uniqueWords.filter(w => w !== cw && !distractors.includes(w)).sort(() => Math.random() - 0.5).forEach(w => { if (distractors.length < nOpts - 1) distractors.push(w); });
    const opts = [{ text:cw, isCorrect:true }];
    distractors.slice(0, nOpts - 1).forEach(t => opts.push({ text:t, isCorrect:false }));
    for (let i = opts.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [opts[i], opts[j]] = [opts[j], opts[i]]; }
    let ci = -1;
    opts.forEach((o, k) => { if (o.isCorrect) ci = k; });
    return { type:'mcq', question:qT, options:opts.map(o => o.text), correct:ci };
  }

  function buildTF(sen, cw) {
    if (Math.random() < 0.5) return { type:'tf', question:sen, correct:true };
    const others = uniqueWords.filter(w => w !== cw);
    if (!others.length) return null;
    const wrong = others[Math.floor(Math.random() * others.length)];
    const idx = sen.indexOf(cw);
    if (idx === -1) return null;
    return { type:'tf', question:sen.slice(0, idx) + wrong + sen.slice(idx + cw.length), correct:false };
  }

  function buildFill(sen, cw) {
    const idx = sen.indexOf(cw);
    if (idx === -1) return null;
    const qT = (sen.slice(0, idx) + '______' + sen.slice(idx + cw.length)).trim();
    if (qT.length < 15) return null;
    return { type:'fill', question:qT, correct:cw, hint:cw.charAt(0) + '...' + cw.charAt(cw.length - 1) + ' (' + cw.length + ' حروف)' };
  }

  const out = [], used = new Set(), usedAns = new Set();
  const pattern = type === 'mix' ? ['mcq','tf','fill'] : [type];
  let i = 0;
  const shuffled = sentences.slice().sort(() => Math.random() - 0.5);

  for (const sen of shuffled) {
    if (out.length >= count) break;
    if (used.has(sen)) continue;
    const words = extractWords(sen);
    if (!words.length) continue;
    const cw = words.filter(w => !usedAns.has(w)).sort((a, b) => b.length - a.length)[0];
    if (!cw) continue;
    const ct = pattern[i % pattern.length]; i++;
    let q = ct === 'mcq' ? buildMCQ(sen, words, cw, optsCount) : ct === 'tf' ? buildTF(sen, cw) : buildFill(sen, cw);
    if (!q) q = buildMCQ(sen, words, cw, optsCount) || buildTF(sen, cw) || buildFill(sen, cw);
    if (q) { out.push(q); used.add(sen); usedAns.add(cw); }
  }

  if (!out.length) throw new Error('لم أستطع التوليد');
  return out;
}

function generate() {
  const text = U.$('quiz-text')?.value.trim();
  if (!text) return UI.toast('الصق نصًا', 'error');
  const btn = event?.target;
  if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>...'; }
  setTimeout(() => {
    try {
      const qs = generateQuestions(text, LearnState.quizConfig.count, LearnState.quizConfig.type, LearnState.quizConfig.optionsCount);
      showQuiz(qs);
      UI.toast(`✅ ${qs.length} أسئلة`, 'success');
    } catch(err) { UI.toast('❌ ' + err.message, 'error'); }
    if (btn) { btn.disabled = false; btn.innerHTML = '✨ توليد'; }
  }, 50);
}

function showQuiz(qs) {
  LearnState.curQuiz = qs;
  LearnState.userAns = new Array(qs.length).fill(null);
  U.$('quiz-setup').style.display = 'none';
  U.$('quiz-display').style.display = 'block';
  updateProgress();
  U.$('quiz-questions').innerHTML = qs.map((q, i) => renderQuestion(q, i)).join('');

  if (LearnState.quizConfig.timer > 0) {
    LearnState.quizSecondsLeft = LearnState.quizConfig.timer * 60;
    U.$('quiz-timer').classList.add('show');
    updateTimerDisplay();
    if (LearnState.quizTimer) clearInterval(LearnState.quizTimer);
    LearnState.quizTimer = setInterval(() => {
      LearnState.quizSecondsLeft--;
      updateTimerDisplay();
      if (LearnState.quizSecondsLeft <= 0) {
        clearInterval(LearnState.quizTimer);
        submitQuiz();
        UI.toast('انتهى الوقت!', 'error');
      }
    }, 1000);
  }
}

function renderQuestion(q, i) {
  let badge, badgeClass;
  if (q.type === 'mcq') { badge = '📋 اختيار'; badgeClass = 'mcq'; }
  else if (q.type === 'tf') { badge = '✅ صح/خطأ'; badgeClass = 'tf'; }
  else { badge = '✍️ فراغ'; badgeClass = 'fill'; }

  let optionsHtml = '';
  if (q.type === 'mcq') {
    optionsHtml = q.options.map((o, j) => `
      <button class="opt-btn" data-q="${i}" data-o="${j}" onclick="Core.learn.pickAns(${i},${j})">
        ${String.fromCharCode(65 + j)}. ${U.esc(o)}
      </button>
    `).join('');
  } else if (q.type === 'tf') {
    optionsHtml = `
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
        <button class="opt-btn" data-q="${i}" data-o="true" onclick="Core.learn.pickAns(${i},true)" style="text-align:center;">✅ صح</button>
        <button class="opt-btn" data-q="${i}" data-o="false" onclick="Core.learn.pickAns(${i},false)" style="text-align:center;">❌ خطأ</button>
      </div>
    `;
  } else {
    optionsHtml = `
      <input type="text" class="input" id="fill-${i}" placeholder="الإجابة..." oninput="Core.learn.pickFill(${i},this.value)" style="font-size:14px;">
      ${q.hint ? `<p style="font-size:11px;color:var(--text-3);margin-top:6px;">💡 ${U.esc(q.hint)}</p>` : ''}
    `;
  }

  return `
    <div class="q-card">
      <div class="q-badge ${badgeClass}">${badge}</div>
      <div class="q-text">${i + 1}. ${U.esc(q.question)}</div>
      ${optionsHtml}
    </div>
  `;
}

function pickAns(q, o) {
  LearnState.userAns[q] = o;
  document.querySelectorAll(`[data-q="${q}"]`).forEach(b => { b.classList.remove('correct','wrong'); b.style.background = 'var(--card-2)'; b.style.borderColor = 'var(--border)'; b.style.color = 'var(--text)'; });
  const btn = document.querySelector(`[data-q="${q}"][data-o="${o}"]`);
  if (btn) { btn.style.background = 'var(--info-bg)'; btn.style.borderColor = 'var(--info)'; btn.style.color = 'var(--info)'; }
  updateProgress();
  U.haptic(5);
}

function pickFill(q, v) { LearnState.userAns[q] = v.trim(); updateProgress(); }

function updateProgress() {
  let answered = 0;
  LearnState.curQuiz.forEach((q, i) => {
    if (q.type === 'fill') { if (LearnState.userAns[i] && LearnState.userAns[i].trim()) answered++; }
    else if (LearnState.userAns[i] !== null && LearnState.userAns[i] !== undefined) answered++;
  });
  const pct = LearnState.curQuiz.length ? (answered / LearnState.curQuiz.length) * 100 : 0;
  const bar = U.$('quiz-progress');
  if (bar) bar.style.width = pct + '%';
}

function updateTimerDisplay() {
  const m = Math.floor(LearnState.quizSecondsLeft / 60);
  const s = LearnState.quizSecondsLeft % 60;
  const el = U.$('quiz-timer');
  if (el) {
    el.textContent = `⏱️ ${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    el.classList.toggle('danger', LearnState.quizSecondsLeft < 30);
  }
}

function submitQuiz() {
  if (LearnState.quizTimer) { clearInterval(LearnState.quizTimer); LearnState.quizTimer = null; }
  let score = 0;
  LearnState.curQuiz.forEach((q, i) => {
    const ua = LearnState.userAns[i];
    let ok = false;
    if (q.type === 'mcq') {
      document.querySelectorAll(`[data-q="${i}"]`).forEach(b => {
        const o = +b.dataset.o;
        b.disabled = true;
        if (o === q.correct) b.classList.add('correct');
        else if (o === ua) b.classList.add('wrong');
      });
      ok = ua === q.correct;
    } else if (q.type === 'tf') {
      document.querySelectorAll(`[data-q="${i}"]`).forEach(b => {
        const o = b.dataset.o === 'true';
        b.disabled = true;
        if (o === q.correct) b.classList.add('correct');
        else if (ua === o) b.classList.add('wrong');
      });
      ok = ua === q.correct;
    } else {
      const norm = s => String(s || '').trim().toLowerCase().replace(/[،,.!؟\s]/g, '').replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي');
      const uN = norm(ua), cN = norm(q.correct);
      ok = uN === cN || (uN.length > 2 && (cN.includes(uN) || uN.includes(cN)));
      const inp = U.$('fill-' + i);
      if (inp) { inp.disabled = true; inp.style.background = ok ? 'var(--success-bg)' : 'var(--danger-bg)'; inp.style.color = ok ? '#065F46' : '#991B1B'; }
    }
    if (ok) score++;
  });

  const pct = Math.round((score / LearnState.curQuiz.length) * 100);
  const emoji = pct >= 80 ? '🎉' : pct >= 50 ? '👍' : '📚';

  const hist = U.ls.get('v6_quizHistory', []);
  hist.unshift({ date:Date.now(), score, total:LearnState.curQuiz.length, percent:pct });
  if (hist.length > 50) hist.length = 50;
  U.ls.set('v6_quizHistory', hist);

  Session.addXP(score * 5);
  U.sound('success');
  U.haptic(20);

  const resultDiv = document.createElement('div');
  resultDiv.className = 'quiz-result';
  resultDiv.id = 'quiz-result';
  resultDiv.innerHTML = `
    <div style="font-size:64px;margin-bottom:12px;">${emoji}</div>
    <div style="font-size:40px;font-weight:900;">${score} / ${LearnState.curQuiz.length}</div>
    <div style="font-size:20px;font-weight:800;margin-top:4px;">${pct}%</div>
    <div style="font-size:12px;margin-top:16px;opacity:.85;">تم الحفظ ✓</div>
  `;
  U.$('quiz-result')?.remove();
  U.$('quiz-display').appendChild(resultDiv);
  resultDiv.scrollIntoView({ behavior:'smooth' });
}

function resetQuiz() {
  if (LearnState.quizTimer) clearInterval(LearnState.quizTimer);
  LearnState.curQuiz = [];
  LearnState.userAns = [];
  U.$('quiz-setup').style.display = 'block';
  U.$('quiz-display').style.display = 'none';
  U.$('quiz-result')?.remove();
}

function showHistory() {
  const hist = U.ls.get('v6_quizHistory', []);
  const content = hist.length ? hist.map(h => {
    const icon = h.percent >= 80 ? '🏆' : h.percent >= 50 ? '👍' : '📚';
    return `<div class="card mb-2" style="padding:12px;display:flex;align-items:center;gap:12px;">
      <div style="font-size:24px;">${icon}</div>
      <div style="flex:1;"><div style="font-weight:800;font-size:13px;">${U.fmtDate(h.date)}</div><div style="font-size:11px;color:var(--text-2);">${h.score}/${h.total}</div></div>

  }).join('') : '<div style="text-align:center;padding:40px;color:var(--text-3);">لا سجل بعد</div>';
  UI.modal({ title:'📊 سجل الاختبارات', content });
}

function loadTemplate(name) {
  const t = FLASH_TEMPLATES[name];

  LearnState.flashIdx = 0;
  U.$('cards-setup').style.display = 'none';
  U.$('cards-display').style.display = 'block';
  renderFlashcard();
  UI.toast(`✅ ${LearnState.flashcards.length} بطاقة`, 'success');
}

function generateCards() {
  const text = U.$('cards-text')?.value.trim();
  if (!text) return UI.toast('الصق نصًا', 'error');
  const sentences = text.split(/[.؟!؟\n]+/).map(s => s.trim()).filter(s => s.length >= 20);
  if (sentences.length < 2) return UI.toast('النص قصير', 'error');
  LearnState.flashcards = sentences.map(s => {
    const words = extractWords(s);
    if (!words.length) return null;
    words.sort((a, b) => b.length - a.length);
    return { front:'ما معنى: ' + words[0] + '؟', back:s, _known:false };
  }).filter(Boolean);
  if (!LearnState.flashcards.length) return UI.toast('فشل', 'error');
  LearnState.flashIdx = 0;
  U.$('cards-setup').style.display = 'none';
  U.$('cards-display').style.display = 'block';
  renderFlashcard();
  UI.toast(`✅ ${LearnState.flashcards.length} بطاقة`, 'success');
}

function renderFlashcard() {
  if (!LearnState.flashcards.length) return;
  const card = LearnState.flashcards[LearnState.flashIdx];
  const front = U.$('flash-front'), back = U.$('flash-back'), inner = U.$('flashcard-inner');
  if (front) front.textContent = card.front;
  if (back) back.textContent = card.back;
  if (inner) inner.style.transform = 'rotateY(0)';
  const stats = U.$('cards-stats');
  if (stats) stats.innerHTML = `
    <div class="flash-stat"><div class="flash-stat-num">${LearnState.flashIdx + 1}</div><div class="flash-stat-label">الحالية</div></div>
    <div class="flash-stat"><div class="flash-stat-num">${LearnState.flashcards.length}</div><div class="flash-stat-label">الإجمالي</div></div>
    <div class="flash-stat"><div class="flash-stat-num" style="color:var(--success);">${LearnState.flashcards.filter(f => f._known).length}</div><div class="flash-stat-label">عرفت</div></div>
  `;
}

function flip() {
  const inner = U.$('flashcard-inner');
  if (!inner) return;
  inner.style.transform = inner.style.transform === 'rotateY(180deg)' ? 'rotateY(0)' : 'rotateY(180deg)';
  U.haptic(5);
}

function reviewCard(known) {
  if (!LearnState.flashcards.length) return;
  LearnState.flashcards[LearnState.flashIdx]._known = known;
  if (known) Session.addXP(1);
  U.haptic(8);
  nextCard();
}

function nextCard() {
  if (LearnState.flashIdx < LearnState.flashcards.length - 1) {
    LearnState.flashIdx++;
    renderFlashcard();
  } else {
    const known = LearnState.flashcards.filter(f => f._known).length;
    UI.toast(`🎉 خلصت! عرفت ${known}/${LearnState.flashcards.length}`, 'success', 4000);
    U.sound('success');
  }
}

function prevCard() {
  if (LearnState.flashIdx > 0) { LearnState.flashIdx--; renderFlashcard(); }
}

function resetCards() {
  LearnState.flashcards = [];
  LearnState.flashIdx = 0;
  U.$('cards-setup').style.display = 'block';
  U.$('cards-display').style.display = 'none';
}

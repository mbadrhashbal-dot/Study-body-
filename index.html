<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F172A">
<title>YasEdu — منصة التعلم الذكي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ═══ CSS Variables ═══ */
:root{
  --p-950:#020617;--p-900:#0F172A;--p-800:#1E293B;--p-700:#334155;--p-600:#475569;
  --p-500:#64748B;--p-400:#94A3B8;--p-300:#CBD5E1;--p-200:#E2E8F0;--p-100:#F1F5F9;--p-50:#F8FAFC;
  --brand:#6366F1;--brand-dark:#4F46E5;--brand-darker:#3730A3;
  --brand-soft:rgba(99,102,241,.12);--brand-glow:rgba(99,102,241,.3);
  --gold:#F59E0B;--gold-dark:#D97706;--gold-soft:rgba(245,158,11,.12);
  --cyan:#06B6D4;--cyan-soft:rgba(6,182,212,.12);
  --green:#10B981;--green-soft:rgba(16,185,129,.12);
  --red:#EF4444;--red-soft:rgba(239,68,68,.1);
  --purple:#A855F7;--purple-soft:rgba(168,85,247,.12);
  --bg:#F8FAFC;--surface:#FFFFFF;--border:#E2E8F0;
  --text:#0F172A;--text-2:#475569;--text-3:#94A3B8;
  --r:10px;--r-lg:14px;--r-xl:20px;--r-2xl:28px;
  --sh:0 4px 16px rgba(15,23,42,.06);--sh-lg:0 8px 32px rgba(15,23,42,.1);--sh-xl:0 20px 60px rgba(15,23,42,.15);
  --sh-glow:0 0 40px rgba(99,102,241,.2);
  --font:'Cairo',-apple-system,system-ui,sans-serif;
  --t:220ms cubic-bezier(.4,0,.2,1);
  --safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px);
}
[data-theme="dark"]{
  --bg:#070B14;--surface:#0F172A;--border:#1E293B;
  --text:#F1F5F9;--text-2:#94A3B8;--text-3:#475569;
  --p-50:#070B14;--p-100:#0F172A;--p-200:#1E293B;--p-300:#334155;
  --brand-soft:rgba(99,102,241,.18);--gold-soft:rgba(245,158,11,.15);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16px;-webkit-text-size-adjust:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100dvh;line-height:1.6;overflow-x:hidden;transition:background var(--t),color var(--t)}
button{font-family:inherit;cursor:pointer;background:none;border:none;color:inherit}
input,textarea,select{font-family:inherit;color:inherit}
img{max-width:100%;display:block}
::selection{background:var(--brand-soft);color:var(--brand-dark)}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:var(--p-300);border-radius:3px}
.hidden{display:none!important}

/* ═══ Splash ═══ */
#splash{position:fixed;inset:0;background:linear-gradient(135deg,#020617 0%,#0F172A 40%,#1a1040 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:99999;transition:opacity 400ms,visibility 400ms}
#splash.hide{opacity:0;visibility:hidden;pointer-events:none}
.splash-orb{position:absolute;border-radius:50%;filter:blur(80px);pointer-events:none}
.splash-orb-1{width:400px;height:400px;background:radial-gradient(circle,rgba(99,102,241,.4),transparent 70%);top:-100px;right:-100px}
.splash-orb-2{width:300px;height:300px;background:radial-gradient(circle,rgba(245,158,11,.25),transparent 70%);bottom:-80px;left:-80px}
.splash-logo{width:100px;height:100px;background:linear-gradient(135deg,var(--brand),var(--brand-dark));border-radius:28px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:44px;margin-bottom:24px;box-shadow:0 0 60px rgba(99,102,241,.5);animation:splashIn 700ms cubic-bezier(.34,1.56,.64,1);position:relative;z-index:1}
@keyframes splashIn{from{opacity:0;transform:scale(.3) rotate(-20deg)}to{opacity:1;transform:scale(1) rotate(0)}}
.splash-brand{color:#fff;font-size:36px;font-weight:900;letter-spacing:-1px;margin-bottom:6px;animation:fadeUp 500ms 200ms backwards;position:relative;z-index:1}
.splash-brand span{background:linear-gradient(135deg,#A5B4FC,#818CF8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.splash-sub{color:rgba(255,255,255,.6);font-size:14px;font-weight:600;animation:fadeUp 500ms 300ms backwards;position:relative;z-index:1}
.splash-bar-wrap{margin-top:36px;width:220px;height:3px;background:rgba(255,255,255,.1);border-radius:2px;overflow:hidden;animation:fadeUp 500ms 400ms backwards;position:relative;z-index:1}
.splash-bar{height:100%;background:linear-gradient(90deg,var(--brand),var(--gold));width:0;animation:load 1400ms cubic-bezier(.4,0,.2,1) forwards}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes load{0%{width:0}100%{width:100%}}

/* ═══ Buttons ═══ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 22px;border-radius:var(--r);font-size:14px;font-weight:700;background:var(--brand);color:#fff;transition:all var(--t);white-space:nowrap;border:none;position:relative;overflow:hidden}
.btn::after{content:'';position:absolute;inset:0;background:linear-gradient(rgba(255,255,255,.15),transparent);opacity:0;transition:opacity var(--t)}
.btn:hover{background:var(--brand-dark);transform:translateY(-1px);box-shadow:0 4px 20px var(--brand-glow)}
.btn:hover::after{opacity:1}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none!important}
.btn-block{width:100%}
.btn-lg{padding:14px 28px;font-size:15px;border-radius:var(--r-lg)}
.btn-sm{padding:7px 14px;font-size:12px;border-radius:8px}
.btn-secondary{background:var(--surface);color:var(--text);border:1.5px solid var(--border)}
.btn-secondary:hover{background:var(--p-100);border-color:var(--p-300);box-shadow:var(--sh)}
.btn-danger{background:var(--red)}
.btn-danger:hover{background:#DC2626;box-shadow:0 4px 20px rgba(239,68,68,.3)}
.btn-gold{background:linear-gradient(135deg,var(--gold-dark),var(--gold));color:#fff}
.btn-gold:hover{box-shadow:0 4px 20px rgba(245,158,11,.4)}
.btn-glass{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(10px)}
.btn-glass:hover{background:rgba(255,255,255,.2)}
.btn-icon{width:40px;height:40px;padding:0;border-radius:var(--r);background:transparent;color:var(--text-2);display:inline-flex;align-items:center;justify-content:center;font-size:18px;transition:all var(--t)}
.btn-icon:hover{background:var(--p-100);color:var(--text)}

/* ═══ Inputs ═══ */
.input,.textarea{width:100%;padding:11px 14px;border-radius:var(--r);font-size:14px;background:var(--surface);border:1.5px solid var(--border);color:var(--text);transition:all var(--t);font-family:inherit}
.input:focus,.textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.input::placeholder,.textarea::placeholder{color:var(--text-3)}
.textarea{resize:vertical;min-height:100px;line-height:1.7}
.field{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.field label{font-size:13px;font-weight:700;color:var(--text)}
.field-hint{font-size:12px;color:var(--text-3);font-weight:500}
.pw-wrap{position:relative}
.pw-eye{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:32px;height:32px;display:flex;align-items:center;justify-content:center;color:var(--text-3);border-radius:var(--r);font-size:16px;cursor:pointer}
.pw-eye:hover{background:var(--p-100)}

/* ═══ Cards ═══ */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:20px;box-shadow:var(--sh)}
.card-hover{cursor:pointer;transition:all var(--t)}
.card-hover:hover{border-color:var(--brand);box-shadow:var(--sh-lg),0 0 0 1px var(--brand-soft);transform:translateY(-2px)}

/* ═══ Badges ═══ */
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700;background:var(--p-100);color:var(--text-2)}
.badge-brand{background:var(--brand-soft);color:var(--brand-dark)}
.badge-gold{background:var(--gold-soft);color:var(--gold-dark)}
.badge-green{background:var(--green-soft);color:var(--green)}
.badge-danger{background:var(--red-soft);color:var(--red)}
.badge-purple{background:var(--purple-soft);color:var(--purple)}
.badge-cyan{background:var(--cyan-soft);color:var(--cyan)}

/* ═══ Avatar ═══ */
.avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--brand),var(--brand-dark));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex-shrink:0;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}

/* ═══ Modal ═══ */
#modal-root{position:fixed;inset:0;pointer-events:none;z-index:9000}
.modal{position:fixed;inset:0;background:rgba(7,11,20,.7);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:16px;pointer-events:auto;animation:fadeIn 200ms}
@keyframes fadeIn{from{opacity:0}}
.modal-content{background:var(--surface);border-radius:var(--r-xl);padding:24px;max-width:500px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:var(--sh-xl);animation:slideUp 300ms cubic-bezier(.34,1.56,.64,1);border:1px solid var(--border)}
@keyframes slideUp{from{opacity:0;transform:scale(.9) translateY(30px)}}
.modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;gap:12px}
.modal-title{font-size:18px;font-weight:800;flex:1}
.modal-close{width:32px;height:32px;border-radius:var(--r);color:var(--text-3);display:flex;align-items:center;justify-content:center;font-size:18px;transition:all var(--t)}
.modal-close:hover{background:var(--p-100);color:var(--text)}

/* ═══ Toast ═══ */
#toast-root{position:fixed;bottom:calc(24px + var(--safe-bottom));left:50%;transform:translateX(-50%);z-index:99999;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;max-width:calc(100% - 32px)}
.toast{padding:12px 20px;border-radius:var(--r);background:var(--p-900);color:#fff;font-size:13px;font-weight:700;box-shadow:var(--sh-lg);opacity:0;transform:translateY(16px);transition:all 300ms;text-align:center;backdrop-filter:blur(10px)}
.toast.show{opacity:1;transform:translateY(0)}
.toast.success{background:linear-gradient(135deg,#059669,#10B981)}
.toast.error{background:linear-gradient(135deg,#DC2626,var(--red))}
.toast.warning{background:linear-gradient(135deg,var(--gold-dark),var(--gold))}
.toast.info{background:linear-gradient(135deg,var(--brand-dark),var(--brand))}

/* ═══ Spinner ═══ */
.spinner{width:16px;height:16px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:spin 700ms linear infinite;display:inline-block;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}

/* ═══ Plan Pill ═══ */
.plan-pill{display:inline-flex;align-items:center;gap:5px;padding:4px 12px;border-radius:999px;font-size:11px;font-weight:800;letter-spacing:.3px}
.plan-free{background:var(--p-100);color:var(--text-2);border:1px solid var(--border)}
.plan-pro{background:linear-gradient(135deg,rgba(99,102,241,.15),rgba(99,102,241,.05));color:var(--brand-dark);border:1px solid var(--brand-soft)}
.plan-premium{background:linear-gradient(135deg,rgba(245,158,11,.2),rgba(245,158,11,.05));color:var(--gold-dark);border:1px solid var(--gold-soft)}

/* ═══ Auth Screen ═══ */
.auth-screen{min-height:100dvh;display:flex;position:relative;overflow:hidden;background:linear-gradient(135deg,#020617 0%,#0F172A 50%,#1a1040 100%)}
.auth-bg-orb{position:absolute;border-radius:50%;filter:blur(100px);pointer-events:none;animation:orbFloat 8s ease-in-out infinite}
.auth-bg-orb:nth-child(1){width:500px;height:500px;background:radial-gradient(circle,rgba(99,102,241,.3),transparent 70%);top:-150px;right:-100px;animation-delay:0s}
.auth-bg-orb:nth-child(2){width:400px;height:400px;background:radial-gradient(circle,rgba(245,158,11,.2),transparent 70%);bottom:-100px;left:-50px;animation-delay:-4s}
.auth-bg-orb:nth-child(3){width:300px;height:300px;background:radial-gradient(circle,rgba(6,182,212,.15),transparent 70%);top:40%;left:40%;animation-delay:-2s}
@keyframes orbFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-30px)}}
.auth-left{flex:1;display:none;flex-direction:column;align-items:center;justify-content:center;padding:60px;position:relative;z-index:1}
.auth-brand-logo{width:80px;height:80px;background:linear-gradient(135deg,var(--brand),var(--brand-dark));border-radius:24px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:36px;font-weight:900;margin-bottom:28px;box-shadow:0 0 60px rgba(99,102,241,.4)}
.auth-brand-name{font-size:42px;font-weight:900;color:#fff;letter-spacing:-1.5px;margin-bottom:10px}
.auth-brand-name em{font-style:normal;background:linear-gradient(135deg,#A5B4FC,#818CF8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.auth-tagline{font-size:17px;color:rgba(255,255,255,.6);font-weight:600;margin-bottom:40px;line-height:1.7}
.auth-features{display:flex;flex-direction:column;gap:14px}
.auth-feat{display:flex;align-items:center;gap:12px;color:rgba(255,255,255,.8);font-size:14px;font-weight:600}
.auth-feat-icon{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.auth-right{width:100%;max-width:460px;margin:0 auto;display:flex;align-items:center;justify-content:center;padding:20px;position:relative;z-index:1}
.auth-box{width:100%}
.auth-box-header{text-align:center;margin-bottom:28px}
.auth-box-logo{width:72px;height:72px;background:linear-gradient(135deg,var(--brand),var(--brand-dark));border-radius:22px;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:32px;margin-bottom:16px;box-shadow:0 0 40px rgba(99,102,241,.4)}
.auth-box-title{font-size:26px;font-weight:900;color:#fff;letter-spacing:-.5px;margin-bottom:6px}
.auth-box-sub{font-size:13px;color:rgba(255,255,255,.6);font-weight:600}
.auth-card{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:var(--r-2xl);padding:28px;backdrop-filter:blur(20px)}
.auth-card .input{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.15);color:#fff}
.auth-card .input:focus{border-color:var(--brand);background:rgba(255,255,255,.1)}
.auth-card .input::placeholder{color:rgba(255,255,255,.35)}
.auth-card label{color:rgba(255,255,255,.8)}
.auth-tabs{display:flex;background:rgba(255,255,255,.07);padding:4px;border-radius:12px;margin-bottom:22px;gap:4px}
.auth-tab{flex:1;padding:10px;border-radius:9px;font-size:13px;font-weight:700;color:rgba(255,255,255,.5);transition:all var(--t);cursor:pointer}
.auth-tab.active{background:rgba(255,255,255,.15);color:#fff}
.auth-form{display:none}
.auth-form.active{display:block;animation:fadeIn 250ms}
.auth-divider{text-align:center;margin:16px 0;position:relative;color:rgba(255,255,255,.3);font-size:12px;font-weight:600}
.auth-divider::before,.auth-divider::after{content:'';position:absolute;top:50%;width:42%;height:1px;background:rgba(255,255,255,.1)}
.auth-divider::before{right:0}.auth-divider::after{left:0}
.auth-divider span{background:transparent;padding:0 14px;position:relative;z-index:1}
.auth-footer{text-align:center;margin-top:20px;font-size:12px;color:rgba(255,255,255,.35);font-weight:500}

/* ═══ Plan Unlock Banner ═══ */
.plan-unlock-bar{background:linear-gradient(135deg,rgba(99,102,241,.15),rgba(245,158,11,.1));border:1px solid rgba(99,102,241,.25);border-radius:var(--r-lg);padding:14px 18px;margin-bottom:18px;display:flex;align-items:center;gap:12px}
.plan-unlock-icon{font-size:24px;flex-shrink:0}
.plan-unlock-text{flex:1;font-size:13px;font-weight:700;color:var(--text-2)}
.plan-unlock-text strong{color:var(--brand-dark)}

/* ═══ Plan Cards in modal ═══ */
.plan-cards-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.plan-card{border:2px solid var(--border);border-radius:var(--r-lg);padding:16px;text-align:center;cursor:pointer;transition:all var(--t);position:relative;overflow:hidden}
.plan-card:hover{transform:translateY(-2px)}
.plan-card.free{border-color:var(--p-300)}
.plan-card.free:hover,.plan-card.free.selected{border-color:var(--p-500);background:var(--p-50)}
.plan-card.pro{border-color:var(--brand-soft)}
.plan-card.pro:hover,.plan-card.pro.selected{border-color:var(--brand);background:var(--brand-soft);box-shadow:0 0 20px var(--brand-soft)}
.plan-card.premium{border-color:var(--gold-soft)}
.plan-card.premium:hover,.plan-card.premium.selected{border-color:var(--gold);background:var(--gold-soft);box-shadow:0 0 20px var(--gold-soft)}
.plan-card-badge{position:absolute;top:0;left:50%;transform:translateX(-50%);background:var(--brand);color:#fff;font-size:9px;font-weight:800;padding:3px 10px;border-radius:0 0 8px 8px}
.plan-card-icon{font-size:28px;margin-bottom:8px}
.plan-card-name{font-size:14px;font-weight:800;margin-bottom:4px}
.plan-card-desc{font-size:11px;color:var(--text-3);font-weight:600;line-height:1.5}

/* ═══ App Layout ═══ */
.app-layout{display:flex;min-height:100dvh}
.app-sidebar{display:none;position:fixed;top:0;right:0;bottom:0;width:260px;background:var(--surface);border-left:1px solid var(--border);padding:20px 12px;flex-direction:column;z-index:100;box-shadow:-4px 0 30px rgba(15,23,42,.06)}
.sidebar-brand{display:flex;align-items:center;gap:12px;padding:0 10px 20px;border-bottom:1px solid var(--border);margin-bottom:16px}
.sidebar-logo{width:44px;height:44px;background:linear-gradient(135deg,var(--brand),var(--brand-dark));border-radius:13px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:19px;flex-shrink:0;box-shadow:0 4px 16px var(--brand-glow)}
.sidebar-name{font-size:16px;font-weight:900;color:var(--text)}
.sidebar-sub{font-size:11px;color:var(--text-3);font-weight:600}
.sidebar-nav{display:flex;flex-direction:column;gap:2px;flex:1;overflow-y:auto}
.sidebar-item{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:10px;font-size:14px;font-weight:700;color:var(--text-2);transition:all var(--t);text-align:right;width:100%}
.sidebar-item:hover{background:var(--p-100);color:var(--text)}
.sidebar-item.active{background:var(--brand-soft);color:var(--brand-dark)}
.sidebar-item-icon{font-size:18px;flex-shrink:0}
.sidebar-footer{padding-top:14px;border-top:1px solid var(--border);margin-top:10px}
.sidebar-user{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;cursor:pointer;transition:background var(--t)}
.sidebar-user:hover{background:var(--p-100)}
.sidebar-user-name{font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sidebar-user-lvl{font-size:11px;color:var(--text-3);font-weight:600}
.app-main{flex:1;display:flex;flex-direction:column;min-width:0}
.app-header{position:sticky;top:0;z-index:50;background:rgba(248,250,252,.9);border-bottom:1px solid var(--border);padding:14px 20px;padding-top:max(14px,var(--safe-top));display:flex;align-items:center;gap:12px;height:62px;backdrop-filter:blur(16px)}
[data-theme="dark"] .app-header{background:rgba(7,11,20,.9)}
.header-title{font-size:17px;font-weight:800;flex:1}
.app-content{flex:1;padding:20px;padding-bottom:calc(88px + var(--safe-bottom));max-width:1050px;width:100%;margin:0 auto}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);padding:8px 10px;padding-bottom:max(8px,var(--safe-bottom));display:flex;justify-content:space-around;z-index:50;box-shadow:0 -4px 20px rgba(15,23,42,.06);backdrop-filter:blur(16px)}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 4px;border-radius:8px;color:var(--text-3);font-size:10px;font-weight:700;transition:all var(--t)}
.nav-item.active{color:var(--brand)}
.nav-item-icon{font-size:20px;line-height:1}

/* ═══ Welcome Hero ═══ */
.welcome{background:linear-gradient(135deg,#0F172A 0%,#1a1040 50%,#0F172A 100%);color:#fff;border-radius:var(--r-xl);padding:26px;margin-bottom:20px;position:relative;overflow:hidden;box-shadow:var(--sh-xl)}
.welcome-orb{position:absolute;border-radius:50%;filter:blur(60px);pointer-events:none}
.welcome-orb-1{width:200px;height:200px;background:radial-gradient(circle,rgba(99,102,241,.4),transparent 70%);top:-60px;left:-60px}
.welcome-orb-2{width:150px;height:150px;background:radial-gradient(circle,rgba(245,158,11,.3),transparent 70%);bottom:-40px;right:-30px}
.welcome-content{position:relative;z-index:1}

.welcome-sub{font-size:12px;color:rgba(255,255,255,.55);margin-top:5px;font-weight:500}

/* ═══ Stats ═══ */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:22px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:14px;text-align:center}
.stat-icon{width:40px;height:40px;margin:0 auto 8px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px}
.stat-value{font-size:20px;font-weight:900;color:var(--text)}
.stat-label{font-size:10px;color:var(--text-2);margin-top:2px;font-weight:700}
.section-title{font-size:15px;font-weight:800;margin-bottom:12px;color:var(--text)}
.quick-actions{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.quick-action{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:all var(--t)}
.quick-action:hover{border-color:var(--brand);box-shadow:var(--sh);transform:translateY(-2px)}
.quick-icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:22px}
.quick-title{font-size:13px;font-weight:800;margin-bottom:2px;color:var(--text)}
.quick-desc{font-size:11px;color:var(--text-3);font-weight:600}

/* ═══ Chat ═══ */
.chat-container{display:flex;flex-direction:column;height:calc(100dvh - 168px);min-height:400px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden}
.chat-header{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-shrink:0;background:var(--surface)}
.chat-header-icon{width:42px;height:42px;border-radius:12px;background:var(--brand-soft);color:var(--brand);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:20px}
.chat-header-title{font-size:14px;font-weight:800}
.chat-header-sub{font-size:11px;color:var(--brand);font-weight:700;margin-top:1px}
.chat-body{flex:1;overflow-y:auto;padding:16px;background:var(--p-50);display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth}
[data-theme="dark"] .chat-body{background:var(--bg)}
.msg{display:flex;gap:8px;animation:msgIn 250ms}
@keyframes msgIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.msg.mine{flex-direction:row-reverse}
.msg-avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--p-300),var(--p-400));color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex-shrink:0;align-self:flex-end;overflow:hidden}
.msg.mine .msg-avatar{background:linear-gradient(135deg,var(--brand),var(--brand-dark))}
.msg-avatar img{width:100%;height:100%;object-fit:cover}
.msg-content{max-width:75%;display:flex;flex-direction:column}
.msg.mine .msg-content{align-items:flex-end}
.msg-meta{font-size:10px;color:var(--text-3);margin-bottom:4px;padding:0 6px;font-weight:700}
.msg-bubble{padding:10px 14px;border-radius:16px;font-size:13px;line-height:1.6;word-wrap:break-word;background:var(--surface);border:1px solid var(--border);color:var(--text)}
.msg.mine .msg-bubble{background:linear-gradient(135deg,var(--brand),var(--brand-dark));color:#fff;border-color:transparent}
.msg-img{max-width:100%;max-height:240px;border-radius:10px;cursor:pointer;display:block;margin-bottom:4px}
.msg-audio{display:flex;align-items:center;gap:8px;min-width:180px}
.msg-audio-play{width:30px;height:30px;border-radius:50%;background:var(--surface);color:var(--text);border:none;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px}
.msg.mine .msg-audio-play{background:rgba(255,255,255,.25);color:#fff}
.audio-wave{flex:1;display:flex;gap:2px;align-items:center;height:18px}
.audio-wave span{width:3px;background:currentColor;border-radius:2px;opacity:.4}
.msg-reply-ctx{background:rgba(0,0,0,.08);border-right:2px solid currentColor;padding:4px 8px;border-radius:6px;margin-bottom:4px;font-size:11px}
.msg.mine .msg-reply-ctx{background:rgba(255,255,255,.2)}
.msg-reactions{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap}
.reaction-chip{background:var(--surface);border:1px solid var(--border);padding:3px 8px;border-radius:999px;font-size:11px;cursor:pointer;display:inline-flex;align-items:center;gap:3px;font-weight:700;transition:all var(--t)}
.reaction-chip:hover{background:var(--p-100)}
.reaction-chip.mine{background:var(--brand-soft);border-color:var(--brand);color:var(--brand-dark)}
.msg-actions{display:flex;gap:4px;margin-top:4px;opacity:0;transition:opacity 150ms}
.msg:hover .msg-actions{opacity:1}
@media(hover:none){.msg-actions{opacity:1}}
.msg-action{background:var(--surface);border:1px solid var(--border);padding:3px 8px;border-radius:6px;font-size:11px;cursor:pointer;color:var(--text-2);font-weight:700;transition:all var(--t)}
.msg-action:hover{background:var(--p-100)}
.typing-indicator{padding:4px 16px;font-size:11px;color:var(--text-3);font-style:italic;font-weight:600;height:20px;flex-shrink:0}
.reply-preview{display:none;padding:10px 16px;background:var(--p-50);border-top:1px solid var(--border);align-items:center;gap:10px;flex-shrink:0}
.reply-preview.show{display:flex}
.reply-preview-content{flex:1;border-right:3px solid var(--brand);padding-right:10px;min-width:0}
.reply-preview-name{font-weight:800;color:var(--brand);font-size:12px}
.reply-preview-text{color:var(--text-2);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-input-area{padding:12px 16px;border-top:1px solid var(--border);display:flex;gap:8px;align-items:flex-end;flex-shrink:0;background:var(--surface)}
.chat-input{flex:1;resize:none;max-height:90px;min-height:40px;padding:10px 14px;font-size:14px}
.chat-send{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--brand),var(--brand-dark));color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:17px;box-shadow:0 4px 12px var(--brand-glow);transition:all var(--t)}
.chat-send:hover{transform:scale(1.08)}
.chat-btn{width:36px;height:36px;border-radius:50%;background:var(--p-100);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--text-2);cursor:pointer;flex-shrink:0;font-size:15px;transition:all var(--t)}
.chat-btn:hover{background:var(--p-200);color:var(--text)}
.chat-btn.recording{background:var(--red);color:#fff;animation:recPulse 1s infinite}
@keyframes recPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.chat-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--text-3);text-align:center;padding:40px 20px}
.chat-empty-icon{font-size:52px;opacity:.25;margin-bottom:12px}
.emoji-picker{position:absolute;bottom:60px;right:0;background:var(--surface);border-radius:var(--r-lg);padding:10px;box-shadow:var(--sh-xl);display:grid;grid-template-columns:repeat(7,1fr);gap:3px;width:260px;z-index:1000;border:1px solid var(--border);max-height:200px;overflow-y:auto}
.emoji-picker button{background:none;border:none;font-size:21px;padding:5px;cursor:pointer;border-radius:6px;transition:background 100ms}
.emoji-picker button:hover{background:var(--p-100)}

/* ═══ Rooms ═══ */
.rooms-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:22px}
.room-action-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:20px;cursor:pointer;transition:all var(--t);text-align:center}

.room-action-icon{width:52px;height:52px;margin:0 auto 10px;background:var(--brand-soft);color:var(--brand);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px}
.room-action-title{font-size:14px;font-weight:800;margin-bottom:3px}
.room-action-desc{font-size:12px;color:var(--text-3);font-weight:600}
.room-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;margin-bottom:20px}
.room-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px;display:flex;gap:12px;align-items:center;cursor:pointer;transition:all var(--t)}
.room-card:hover{border-color:var(--brand);box-shadow:var(--sh);transform:translateY(-2px)}
.room-card-icon{width:44px;height:44px;border-radius:12px;background:var(--brand-soft);color:var(--brand);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:20px}
.room-card-name{font-size:13px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:3px}
.room-card-meta{font-size:11px;color:var(--text-3);display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-weight:600}
.room-tag{background:var(--p-100);padding:2px 7px;border-radius:999px;font-size:10px;font-weight:800;color:var(--text-2)}

/* ═══ Quiz ═══ */
.quiz-option{display:block;width:100%;text-align:right;padding:13px 16px;border:1.5px solid var(--border);border-radius:var(--r);background:var(--surface);font-size:14px;font-weight:700;cursor:pointer;transition:all var(--t);margin-bottom:8px;color:var(--text);font-family:inherit}
.quiz-option:hover{background:var(--p-100);border-color:var(--brand)}
.quiz-option.selected{background:var(--brand-soft);border-color:var(--brand);color:var(--brand-dark)}
.quiz-option.correct{background:var(--green-soft);border-color:var(--green);color:var(--green)}
.quiz-option.wrong{background:var(--red-soft);border-color:var(--red);color:var(--red)}
.quiz-progress{height:6px;background:var(--p-200);border-radius:999px;overflow:hidden;margin-bottom:20px}
.quiz-progress-bar{height:100%;background:linear-gradient(90deg,var(--brand),var(--gold));width:0%;transition:width .4s;border-radius:999px}
.quiz-result{text-align:center;padding:40px 24px}
.quiz-result-emoji{font-size:72px;margin-bottom:16px}
.quiz-result-score{font-size:40px;font-weight:900;margin-bottom:4px}

/* quiz-result-card extra styles */
.quiz-result-card{text-align:center;padding:28px 20px;margin-bottom:16px}
.quiz-result-icon{font-size:56px;margin-bottom:12px}
.quiz-result-title{font-size:20px;font-weight:900;margin:0 0 12px;color:var(--text)}
.quiz-result-grade{font-size:18px;font-weight:800;margin:8px 0 16px;color:var(--brand-dark)}
.pdf-upload-area{background:var(--surface);border:2px dashed var(--border);border-radius:var(--r-lg);padding:28px;margin-bottom:16px;text-align:center;cursor:pointer;transition:all var(--t)}
.pdf-upload-area:hover,.pdf-upload-area.drag{border-color:var(--brand);background:var(--brand-soft)}
.pdf-upload-icon{font-size:44px;margin-bottom:10px}
.pdf-status{margin-top:12px;font-size:13px;font-weight:700}
.pdf-status.loading{color:var(--brand)}.pdf-status.success{color:var(--green)}.pdf-status.error{color:var(--red)}
.quiz-creator{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px;margin-bottom:16px}
.quiz-creator-title{font-size:15px;font-weight:800;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.q-builder-item{background:var(--p-50);border:1px solid var(--border);border-radius:var(--r);padding:14px;margin-bottom:10px;position:relative}
.q-builder-label{font-size:12px;font-weight:800;color:var(--text-2);margin-bottom:8px}
.q-opt-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.q-opt-radio{width:16px;height:16px;accent-color:var(--brand);cursor:pointer;flex-shrink:0}
.q-opt-input{flex:1;padding:8px 12px;border-radius:8px;border:1.5px solid var(--border);font-size:13px;font-weight:600;background:var(--surface)}
.q-opt-input:focus{outline:none;border-color:var(--brand)}

/* ═══ Flash Cards ═══ */
.cards-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.flashcard-container{perspective:1200px;height:250px;margin:18px 0;cursor:pointer}
.flashcard-inner{position:relative;width:100%;height:100%;transition:transform .6s cubic-bezier(.34,1.56,.64,1);transform-style:preserve-3d}
.flashcard-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:var(--r-xl);display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;font-size:18px;font-weight:800;box-shadow:var(--sh-lg)}
.flashcard-front{background:linear-gradient(135deg,var(--brand),var(--brand-dark));color:#fff}
.flashcard-back{background:var(--surface);color:var(--text);transform:rotateY(180deg);border:3px solid var(--brand)}

/* ═══ Profile ═══ */
.profile-hero{text-align:center;padding:26px 16px 20px}
.profile-avatar{width:100px;height:100px;border-radius:50%;background:linear-gradient(135deg,var(--brand),var(--brand-dark));color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:38px;font-weight:900;margin-bottom:14px;overflow:hidden;border:4px solid var(--surface);box-shadow:var(--sh-lg);position:relative;cursor:pointer}
.profile-avatar img{width:100%;height:100%;object-fit:cover}
.profile-avatar:hover::after{content:'📷';position:absolute;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;font-size:26px}
.profile-name{font-size:22px;font-weight:900;margin-bottom:4px}
.profile-email{font-size:13px;color:var(--text-2);margin-bottom:12px;font-weight:600}
.profile-action{display:flex;align-items:center;gap:14px;padding:14px 16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);text-align:right;width:100%;cursor:pointer;transition:all var(--t);color:var(--text);margin-bottom:8px}
.profile-action:hover{background:var(--p-100);border-color:var(--brand);transform:translateX(-2px)}
.profile-action-icon{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:18px}

/* ═══ Settings ═══ */
.settings-section{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px;margin-bottom:14px}
.settings-title{font-size:11px;font-weight:800;color:var(--text-3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:12px;padding:0 4px}
.settings-item{display:flex;align-items:center;gap:12px;padding:12px;border-radius:10px;cursor:pointer;transition:background var(--t)}
.settings-item:hover{background:var(--p-100)}
.settings-icon{width:38px;height:38px;background:var(--p-100);color:var(--text-2);border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:17px}
.settings-label{font-size:14px;font-weight:800;margin-bottom:2px}
.settings-desc{font-size:11px;color:var(--text-3);font-weight:600}
.toggle{width:46px;height:26px;border-radius:999px;background:var(--p-300);position:relative;transition:background var(--t);flex-shrink:0;cursor:pointer;border:none;padding:0}
.toggle.active{background:var(--brand)}
.toggle-thumb{position:absolute;top:3px;right:3px;width:20px;height:20px;background:#fff;border-radius:50%;transition:transform var(--t);box-shadow:0 1px 4px rgba(0,0,0,.2)}
.toggle.active .toggle-thumb{transform:translateX(-20px)}

/* ═══ About Section ═══ */
.about-hero{background:linear-gradient(135deg,#0F172A 0%,#1a1040 60%,#0F172A 100%);border-radius:var(--r-xl);padding:32px;text-align:center;margin-bottom:18px;position:relative;overflow:hidden}
.about-hero-orb{position:absolute;border-radius:50%;filter:blur(60px);pointer-events:none}

.about-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:20px;margin-bottom:12px}
.about-section-label{font-size:11px;font-weight:800;color:var(--text-3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:12px}
.about-dev-row{display:flex;align-items:center;gap:14px}

.about-dev-name{font-size:18px;font-weight:900;margin-bottom:4px}
.about-dev-title{font-size:13px;color:var(--text-2);font-weight:600}

/* ═══ Admin ═══ */
.admin-stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:20px}

.admin-tab.active{background:var(--surface);color:var(--brand);box-shadow:var(--sh)}
.admin-item{background:var(--p-50);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:8px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.admin-item-info{flex:1;min-width:140px}
.admin-item-name{font-size:13px;font-weight:800;margin-bottom:2px}
.admin-item-meta{font-size:11px;color:var(--text-3);font-weight:600}
.admin-btn{padding:5px 11px;border-radius:6px;border:none;font-size:11px;font-weight:800;cursor:pointer;font-family:inherit;transition:all var(--t)}

var Auth = {
  switchTab:function(tab){
    U.$$('.auth-tab').forEach(function(t,i){t.classList.toggle('active',i===(tab==='signin'?0:1));});
    U.$$('.auth-form').forEach(function(f){f.classList.toggle('active',f.id==='form-'+tab);});
  },
  togglePw:function(btn,id){var inp=U.$(id);if(!inp)return;var isPw=inp.type==='password';inp.type=isPw?'text':'password';btn.textContent=isPw?'🙈':'👁️';},

  signin:async function(e){
    e.preventDefault();
    var email=U.$('signin-email').value.trim().toLowerCase();
    var pw=U.$('signin-password').value;
    if(!email||!pw){UI.toast('أكمل البيانات','error');return;}
    var btn=U.$('signin-btn');var orig=btn.innerHTML;
    btn.disabled=true;btn.innerHTML='<span class="spinner"></span>';
    try{
      if(!window.db)throw new Error('Firebase غير متصل');
      if((email===ADMIN.name||email===ADMIN.email)&&pw===ADMIN.password){
        var snap=await window.db.ref('users').once('value');
        var users=snap.val()||{};var adminUid=null,adminData=null;
        for(var uid in users){if(users[uid].name==='admin'||users[uid].email===ADMIN.email){adminUid=uid;adminData=users[uid];break;}}
        if(!adminUid){
          var salt=U.genSalt();var hash=await U.hashPw(ADMIN.password,salt);
          adminUid='admin_'+Date.now();
          adminData={name:'admin',email:ADMIN.email,salt:salt,hash:hash,role:'developer',level:99,xp:0,plan:'premium',createdAt:Date.now()};
          await window.db.ref('users/'+adminUid).set(adminData);
        }
        Session.save({uid:adminUid,name:adminData.name,email:adminData.email,role:adminData.role,level:adminData.level,xp:adminData.xp,plan:'premium'});
        UI.toast('مرحباً يا أدمن 👑','success');U.haptic(20);
        setTimeout(function(){Router.go('home');},200);return;
      }
      var user=null,foundUid=null;
      var byEmail=await window.db.ref('users').orderByChild('email').equalTo(email).once('value');
      if(byEmail.exists()){var val=byEmail.val();foundUid=Object.keys(val)[0];user=val[foundUid];}
      else{var byName=await window.db.ref('users').orderByChild('name').equalTo(email).once('value');if(byName.exists()){var val2=byName.val();foundUid=Object.keys(val2)[0];user=val2[foundUid];}}
      if(!user){UI.toast('البيانات غير صحيحة','error');btn.disabled=false;btn.innerHTML=orig;return;}
      if(user.banned){UI.toast('🚫 الحساب محظور','error');btn.disabled=false;btn.innerHTML=orig;return;}
      var userHash=await U.hashPw(pw,user.salt||'');
      if(userHash!==user.hash){UI.toast('البيانات غير صحيحة','error');btn.disabled=false;btn.innerHTML=orig;return;}
      Session.save({uid:foundUid,name:user.name,email:user.email,avatar:user.avatar,role:user.role,level:user.level,xp:user.xp,plan:user.plan||'free'});
      await window.db.ref('users/'+foundUid+'/lastActive').set(Date.now());
      UI.toast('مرحباً '+user.name,'success');U.haptic(20);
      setTimeout(function(){Router.go('home');},200);
    }catch(err){UI.toast('خطأ: '+err.message,'error');btn.disabled=false;btn.innerHTML=orig;}
  },

  signup:async function(e){
    e.preventDefault();
    var name=U.$('signup-name').value.trim();
    var email=U.$('signup-email').value.trim().toLowerCase();
    var pw=U.$('signup-password').value;
    if(!name||name.length<2){UI.toast('الاسم قصير','error');return;}
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){UI.toast('بريد غير صالح','error');return;}
    if(pw.length<6){UI.toast('كلمة المرور قصيرة','error');return;}
    var btn=U.$('signup-btn');var orig=btn.innerHTML;
    btn.disabled=true;btn.innerHTML='<span class="spinner"></span>';
    try{
      if(!window.db)throw new Error('Firebase غير متصل');
      var snap=await window.db.ref('users').orderByChild('email').equalTo(email).once('value');
      if(snap.exists()){UI.toast('البريد مستخدم','error');btn.disabled=false;btn.innerHTML=orig;return;}
      var uid=U.genId('u');var salt=U.genSalt();var hash=await U.hashPw(pw,salt);
      var data={name:name,email:email,avatar:'',salt:salt,hash:hash,role:'member',level:1,xp:0,plan:'free',createdAt:Date.now(),lastActive:Date.now()};
      await window.db.ref('users/'+uid).set(data);
      Session.save({uid:uid,name:name,email:email,avatar:'',role:'member',level:1,xp:0,plan:'free'});
      UI.toast('تم إنشاء حسابك 🎉','success');U.haptic(20);
      setTimeout(function(){Router.go('home');},200);
    }catch(err){UI.toast('خطأ: '+err.message,'error');btn.disabled=false;btn.innerHTML=orig;}
  },

  googleSignIn:async function(){
    var btn=U.$('google-btn');if(!btn)return;
    var orig=btn.innerHTML;btn.disabled=true;btn.innerHTML='<span class="spinner"></span> جاري...';
    try{
      if(!window.fbAuth)throw new Error('Firebase Auth غير متصل');
      var provider=new firebase.auth.GoogleAuthProvider();
      provider.addScope('email');provider.addScope('profile');
      var result=await window.fbAuth.signInWithPopup(provider);
      var guser=result.user;
      if(!guser||!guser.email)throw new Error('لم يتم الحصول على البيانات');
      var snap=await window.db.ref('users').orderByChild('email').equalTo(guser.email.toLowerCase()).once('value');
      var uid,userData;
      if(snap.exists()){var val=snap.val();uid=Object.keys(val)[0];userData=val[uid];
        await window.db.ref('users/'+uid).update({lastActive:Date.now(),googleUid:guser.uid,avatar:userData.avatar||guser.photoURL||''});
        userData.avatar=userData.avatar||guser.photoURL||'';
      }else{
        uid=U.genId('u');
        userData={name:guser.displayName||guser.email.split('@')[0],email:guser.email.toLowerCase(),avatar:guser.photoURL||'',googleUid:guser.uid,role:'member',level:1,xp:0,plan:'free',provider:'google',createdAt:Date.now(),lastActive:Date.now()};
        await window.db.ref('users/'+uid).set(userData);
      }
      Session.save({uid:uid,name:userData.name,email:userData.email,avatar:userData.avatar||'',role:userData.role,level:userData.level,xp:userData.xp,plan:userData.plan||'free'});
      UI.toast('مرحباً '+userData.name,'success');U.haptic(20);
      setTimeout(function(){Router.go('home');},300);
    }catch(err){
      var code=err.code||'';
      if(code==='auth/popup-closed-by-user'){UI.toast('تم إغلاق النافذة','warning');}
      else if(code==='auth/popup-blocked'){UI.toast('المتصفح منع النافذة','error');}
      else{UI.toast('فشل: '+(err.message||'خطأ'),'error');}
      btn.disabled=false;btn.innerHTML=orig;
    }
  },

  guest:function(){
    var guestId=U.genId('guest');
    Session.save({uid:guestId,name:'ضيف',email:'',avatar:'',role:'guest',level:1,xp:0,plan:'free'});
    UI.toast('دخلت كضيف','info');
    setTimeout(function(){Router.go('home');},100);
  },

  enterCode:function(){
    UI.modal({
      title:'🔑 أدخل الكود',
      content:'<p style="margin-bottom:14px;font-size:13px;color:var(--text-2);font-weight:600">أدخل كود الترقية لفتح خطة Pro أو Premium</p>'+
      '<div class="field"><label>الكود</label><input class="input" id="code-inp" placeholder="مثال: PROXXXX" maxlength="20" style="text-align:center;font-weight:800;letter-spacing:3px;text-transform:uppercase;font-size:18px"></div>'+
      '<div style="display:flex;gap:8px;margin-top:16px">'+
      '<button class="btn btn-secondary" onclick="App.ui.closeAll()" style="flex:1">إلغاء</button>'+
      '<button class="btn" id="code-btn" onclick="Auth.redeemCode()" style="flex:1">تفعيل</button>'+
      '</div>'
    });
    setTimeout(function(){var i=U.$('code-inp');if(i)i.focus();},100);
  },

  redeemCode:async function(){
    var code=(U.$('code-inp').value||'').trim().toUpperCase();
    if(!code||code.length<4){UI.toast('أدخل الكود','error');return;}
    var btn=U.$('code-btn');btn.disabled=true;btn.innerHTML='<span class="spinner"></span>';
    try{
      if(!window.db)throw new Error('Firebase غير متصل');
      var snap=await window.db.ref('codes/'+code).once('value');
      var codeData=snap.val();
      if(!codeData){UI.toast('الكود غير صحيح ❌','error');btn.disabled=false;btn.innerHTML='تفعيل';return;}
      if(codeData.used){UI.toast('الكود مستخدم من قبل ❌','error');btn.disabled=false;btn.innerHTML='تفعيل';return;}
      if(codeData.expiresAt&&Date.now()>codeData.expiresAt){UI.toast('الكود منتهي الصلاحية ❌','error');btn.disabled=false;btn.innerHTML='تفعيل';return;}
      var plan=codeData.plan||'pro';
      await window.db.ref('codes/'+code).update({used:true,usedBy:State.user?State.user.uid:'',usedAt:Date.now()});
      if(State.user&&State.user.uid&&State.user.uid.indexOf('guest')!==0){
        await window.db.ref('users/'+State.user.uid+'/plan').set(plan);
      }
      Session.setPlan(plan);
      UI.closeAll();
      UI.toast('تم تفعيل '+(plan==='premium'?'Premium 👑':'Pro ⚡'),'success',5000);
    }catch(err){UI.toast('خطأ: '+err.message,'error');btn.disabled=false;btn.innerHTML='تفعيل';}
  }
};

function startChatSession(){
  var s=App.state.user;if(!window.db||!s.uid)return;
  var uid=s.uid,room=ChatState.room;
  ChatState.listeners.forEach(function(ref){try{ref.off();}catch(e){}});ChatState.listeners=[];
  if(ChatState.heartbeatInt)clearInterval(ChatState.heartbeatInt);
  var userRef=window.db.ref('rooms/'+room+'/users/'+uid);
  userRef.set({name:s.name,avatar:s.avatar||'',lastSeen:firebase.database.ServerValue.TIMESTAMP});
  userRef.onDisconnect().remove();
  ChatState.heartbeatInt=setInterval(function(){window.db.ref('rooms/'+room+'/users/'+uid+'/lastSeen').set(firebase.database.ServerValue.TIMESTAMP);},20000);
  var usersRef=window.db.ref('rooms/'+room+'/users');
  usersRef.on('value',function(snap){ChatState.users=snap.val()||{};var el=U.$('chat-online');if(el)el.textContent=Object.keys(ChatState.users).length+' متصل';});
  ChatState.listeners.push(usersRef);
  var msgRef=window.db.ref('rooms/'+room+'/messages').limitToLast(100);
  msgRef.on('value',function(snap){ChatState.messages=snap.val()||{};renderMessages();});
  ChatState.listeners.push(msgRef);
  var typingRef=window.db.ref('rooms/'+room+'/typing');
  typingRef.on('value',function(snap){
    var t=snap.val()||{};
    var names=Object.keys(t).filter(function(k){return k!==uid&&(Date.now()-(t[k].ts||0))<4000;}).map(function(k){return t[k].name;});
    var bar=U.$('chat-typing');if(bar)bar.textContent=names.length?names.join(', ')+' يكتب...':'';
  });
  ChatState.listeners.push(typingRef);
}

function renderMessages(){
  var body=U.$('chat-body');if(!body)return;
  var msgs=ChatState.messages;
  var keys=Object.keys(msgs).sort(function(a,b){return(msgs[a].timestamp||0)-(msgs[b].timestamp||0);});
  if(!keys.length){body.innerHTML='<div class="chat-empty"><div class="chat-empty-icon">💬</div><div style="font-size:14px;font-weight:800;color:var(--text-2)">لا رسائل بعد</div><div style="font-size:12px;font-weight:600">كن أول من يبدأ</div></div>';return;}
  var atBottom=body.scrollHeight-body.scrollTop-body.clientHeight<100;
  var s=App.state.user;
  body.innerHTML=keys.map(function(k){return renderOneMessage(k,msgs[k],s);}).join('');
  if(atBottom)body.scrollTop=body.scrollHeight;
}

function renderOneMessage(id,m,s){
  var mine=m.userId===s.uid;
  var time=m.timestamp?U.fmtTime(m.timestamp):'';
  var avatarHtml=m.avatar?'<img src="'+U.esc(m.avatar)+'" alt="">':U.initials(m.name||'?');
  var replyCtx=m.replyTo?'<div class="msg-reply-ctx"><div style="font-weight:700;opacity:.9">↩ '+U.esc(m.replyTo.name)+'</div><div style="opacity:.7;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+U.esc(m.replyTo.preview)+'</div></div>':'';
  var content='';
  if(m.type==='image'&&m.media&&m.media.data){
    content='<img class="msg-img" src="'+U.esc(m.media.data)+'" onclick="Chat.lightbox(\''+id+'\')" loading="lazy">';
    if(m.text)content+='<div style="margin-top:4px">'+U.esc(m.text)+'</div>';
  }else if(m.type==='audio'&&m.media&&m.media.data){
    var dur=Math.round(m.media.duration||0);var bars='';
    for(var i=0;i<18;i++)bars+='<span style="height:'+(4+Math.random()*12)+'px"></span>';
    content='<div class="msg-audio"><button class="msg-audio-play" onclick="Chat.toggleAudio(\''+id+'\')" id="play-'+id+'">▶</button><div class="audio-wave">'+bars+'</div><span style="font-size:11px;opacity:.8">'+dur+'ث</span></div><audio id="audio-'+id+'" src="'+U.esc(m.media.data)+'" preload="metadata"></audio>';
  }else{content=U.esc(m.text||'');}
  var reactions='';
  if(m.reactions&&Object.keys(m.reactions).length){
    reactions='<div class="msg-reactions">';
    Object.keys(m.reactions).forEach(function(emo){
      var users=m.reactions[emo]||{};var count=Object.keys(users).length;var isMine=users[s.uid];
      reactions+='<button class="reaction-chip'+(isMine?' mine':'')+'" onclick="Chat.react(\''+id+'\',\''+emo+'\')">'+emo+' '+count+'</button>';
    });
    reactions+='</div>';
  }
  var actions='<div class="msg-actions">'+
    '<button class="msg-action" onclick="Chat.replyTo(\''+id+'\')">↩ رد</button>'+
    '<button class="msg-action" onclick="Chat.react(\''+id+'\',\'❤️\')">❤️</button>'+
    '<button class="msg-action" onclick="Chat.react(\''+id+'\',\'👍\')">👍</button>'+
    (mine?'<button class="msg-action" onclick="Chat.deleteMsg(\''+id+'\')">🗑</button>':'')+
    '</div>';
  return'<div class="msg'+(mine?' mine':'')+'">'+
    '<div class="msg-avatar">'+avatarHtml+'</div>'+
    '<div class="msg-content">'+
    '<div class="msg-meta">'+U.esc(m.name||'?')+' • '+time+'</div>'+
    '<div class="msg-bubble">'+replyCtx+content+'</div>'+
    reactions+actions+'</div></div>';
}

var Chat={
  send:async function(){
    var inp=U.$('chat-input');var text=inp&&inp.value.trim();if(!text)return;
    if(!window.db){UI.toast('Firebase غير متصل','error');return;}
    var s=App.state.user;var id=U.genId('m');
    var payload={type:'text',text:text,name:s.name,avatar:s.avatar||'',userId:s.uid,timestamp:firebase.database.ServerValue.TIMESTAMP};
    if(ChatState.replyTo){payload.replyTo=ChatState.replyTo;Chat.cancelReply();}
    try{await window.db.ref('rooms/'+ChatState.room+'/messages/'+id).set(payload);inp.value='';Session.addXP(2);}
    catch(e){UI.toast('فشل: '+e.message,'error');}
  },
  typing:function(){
    var s=App.state.user;if(!s.uid||!window.db)return;
    var ref=window.db.ref('rooms/'+ChatState.room+'/typing/'+s.uid);
    ref.set({name:s.name,ts:Date.now()});ref.onDisconnect().remove();
    clearTimeout(ChatState.typingTimeout);ChatState.typingTimeout=setTimeout(function(){ref.remove();},2500);
  },
  replyTo:function(id){
    var m=ChatState.messages[id];if(!m)return;
    var preview=m.type==='image'?'📷 صورة':m.type==='audio'?'🎤 صوت':(m.text||'').slice(0,50);
    ChatState.replyTo={id:id,name:m.name||'?',preview:preview};
    var p=U.$('chat-reply-preview');if(p)p.classList.add('show');
    var n=U.$('chat-reply-name');if(n)n.textContent='↩ '+ChatState.replyTo.name;
    var t=U.$('chat-reply-text');if(t)t.textContent=preview;
    var ci=U.$('chat-input');if(ci)ci.focus();
  },
  cancelReply:function(){ChatState.replyTo=null;var el=U.$('chat-reply-preview');if(el)el.classList.remove('show');},
  react:function(id,emo){
    var s=App.state.user;if(!s.uid)return;
    var ref=window.db.ref('rooms/'+ChatState.room+'/messages/'+id+'/reactions/'+emo+'/'+s.uid);
    ref.once('value').then(function(snap){if(snap.val())ref.remove();else ref.set(true);});
  },
  deleteMsg:function(id){UI.confirm('حذف','حذف هذه الرسالة؟').then(function(ok){if(!ok)return;window.db.ref('rooms/'+ChatState.room+'/messages/'+id).remove();UI.toast('تم الحذف','success');});},
  showEmoji:function(btn){
    var existing=document.querySelector('.emoji-picker');if(existing){existing.remove();return;}
    var emojis=['😀','😁','😂','🤣','😊','😍','🤔','😎','😢','😡','👍','👎','❤️','🔥','✨','🎉','💯','👏','🙏','💪','🎓','📚','📝','✅','❌','⭐','🚀','💡','🌟','😆'];
    var picker=document.createElement('div');picker.className='emoji-picker';
    picker.innerHTML=emojis.map(function(e){return'<button onclick="Chat.insertEmoji(\''+e+'\')">'+e+'</button>';}).join('');
    btn.parentNode.appendChild(picker);
    setTimeout(function(){document.addEventListener('click',function close(e){if(!picker.contains(e.target)&&e.target!==btn){picker.remove();document.removeEventListener('click',close);}},{once:true});},10);
  },
  insertEmoji:function(e){var inp=U.$('chat-input');if(inp){inp.value+=e;inp.focus();}var p=document.querySelector('.emoji-picker');if(p)p.remove();},
  pickImage:function(){
    var input=document.createElement('input');input.type='file';input.accept='image/*';
    input.onchange=function(e){
      var file=e.target.files[0];if(!file)return;
      if(file.size>5*1024*1024){UI.toast('الصورة كبيرة (5MB max)','error');return;}
      var reader=new FileReader();
      reader.onload=function(ev){ChatState.pendingMedia={type:'image',dataUrl:ev.target.result};Chat.showMediaPreview();};
      reader.readAsDataURL(file);
    };input.click();
  },
  toggleRecord:async function(){
    var s=App.state.user;if(!s.uid)return;
    if(ChatState.isRecording&&ChatState.mediaRecorder&&ChatState.mediaRecorder.state==='recording'){Chat.stopRecord();return;}
    try{
      var stream=await navigator.mediaDevices.getUserMedia({audio:true});
      var mime=MediaRecorder.isTypeSupported('audio/webm')?'audio/webm':MediaRecorder.isTypeSupported('audio/mp4')?'audio/mp4':'';
      ChatState.mediaRecorder=mime?new MediaRecorder(stream,{mimeType:mime}):new MediaRecorder(stream);
      ChatState.recordChunks=[];ChatState.isRecording=true;
      ChatState.mediaRecorder.ondataavailable=function(e){if(e.data.size>0)ChatState.recordChunks.push(e.data);};
      ChatState.mediaRecorder.onstop=function(){
        stream.getTracks().forEach(function(t){t.stop();});clearInterval(ChatState.recordTimer);ChatState.isRecording=false;
        var duration=(Date.now()-ChatState.recordStart)/1000;
        var micBtn=U.$('chat-mic-btn');if(micBtn){micBtn.classList.remove('recording');micBtn.textContent='🎤';}
        if(duration<1){UI.toast('تسجيل قصير','error');return;}
        var blob=new Blob(ChatState.recordChunks,{type:ChatState.mediaRecorder.mimeType||'audio/webm'});
        var reader=new FileReader();
        reader.onload=function(ev){ChatState.pendingMedia={type:'audio',dataUrl:ev.target.result,duration:duration};Chat.showMediaPreview();};
        reader.readAsDataURL(blob);
      };
      ChatState.mediaRecorder.start();ChatState.recordStart=Date.now();
      var micBtn=U.$('chat-mic-btn');if(micBtn){micBtn.classList.add('recording');micBtn.textContent='⏹';}
      UI.toast('🎤 جاري التسجيل — اضغط تاني للإيقاف','info',2500);
      ChatState.recordTimer=setInterval(function(){var sec=Math.floor((Date.now()-ChatState.recordStart)/1000);if(sec>=180){Chat.stopRecord();UI.toast('الحد 3 دقائق','warning');}},500);
    }catch(e){UI.toast('تعذّر الميكروفون: '+e.message,'error');ChatState.isRecording=false;}
  },
  stopRecord:function(){if(ChatState.mediaRecorder&&ChatState.mediaRecorder.state==='recording')ChatState.mediaRecorder.stop();ChatState.isRecording=false;var micBtn=U.$('chat-mic-btn');if(micBtn){micBtn.classList.remove('recording');micBtn.textContent='🎤';}},
  showMediaPreview:function(){
    if(!ChatState.pendingMedia)return;
    var isImg=ChatState.pendingMedia.type==='image';
    var html=isImg?'<img src="'+ChatState.pendingMedia.dataUrl+'" style="max-width:100%;max-height:280px;border-radius:12px;margin:0 auto 12px;display:block">':'<audio controls src="'+ChatState.pendingMedia.dataUrl+'" style="width:100%;margin-bottom:12px"></audio><p style="font-size:13px;color:var(--text-2);font-weight:600">المدة: '+Math.round(ChatState.pendingMedia.duration)+' ثانية</p>';
    UI.modal({title:isImg?'📷 معاينة':'🎤 معاينة',content:'<div style="text-align:center;padding:16px 0">'+html+'</div><div style="display:flex;gap:8px;margin-top:16px"><button class="btn btn-block" onclick="Chat.sendPending()">📤 إرسال</button><button class="btn btn-secondary btn-block" onclick="Chat.cancelPending()">إلغاء</button></div>'});
  },
  sendPending:function(){
    if(!ChatState.pendingMedia||!window.db)return;
    var s=App.state.user;var media=ChatState.pendingMedia;var id=U.genId('m');
    var payload={type:media.type,media:{data:media.dataUrl,duration:media.duration||0},name:s.name,avatar:s.avatar||'',userId:s.uid,timestamp:firebase.database.ServerValue.TIMESTAMP};
    if(ChatState.replyTo){payload.replyTo=ChatState.replyTo;Chat.cancelReply();}
    window.db.ref('rooms/'+ChatState.room+'/messages/'+id).set(payload).then(function(){UI.toast('تم الإرسال','success');Session.addXP(3);ChatState.pendingMedia=null;UI.closeAll();}).catch(function(e){UI.toast('فشل: '+e.message,'error');});
  },
  cancelPending:function(){ChatState.pendingMedia=null;UI.closeAll();},
  toggleAudio:function(id){
    var audio=U.$('audio-'+id);var btn=U.$('play-'+id);if(!audio)return;
    if(ChatState.currentAudio&&ChatState.currentAudio!==audio){ChatState.currentAudio.pause();var prevBtn=U.$('play-'+ChatState.currentAudioId);if(prevBtn)prevBtn.textContent='▶';}
    if(audio.paused){audio.play();if(btn)btn.textContent='⏸';ChatState.currentAudio=audio;ChatState.currentAudioId=id;audio.onended=function(){if(btn)btn.textContent='▶';};}else{audio.pause();if(btn)btn.textContent='▶';}
  },
  lightbox:function(id){var m=ChatState.messages[id];if(!m||!m.media)return;UI.modal({title:'🖼️',content:'<img src="'+U.esc(m.media.data)+'" style="max-width:100%;max-height:80vh;border-radius:12px;margin:0 auto;display:block">'});}
};
window.Chat=Chat;

function RoomsScreen(){
  if(!Session.isLoggedIn()){setTimeout(function(){Router.go('auth');},50);return'';}
  setTimeout(loadPublicRooms,100);
  return '<div class="app-layout">'+layout.Sidebar('rooms')+'<div class="app-main">'+layout.Header('الغرف')+
  '<main class="app-content">'+
  '<div class="rooms-actions">'+
  '<div class="room-action-card" onclick="Rooms.showCreate()"><div class="room-action-icon">➕</div><div class="room-action-title">غرفة جديدة</div><div class="room-action-desc">أنشئ غرفة خاصة أو عامة</div></div>'+
  '<div class="room-action-card" onclick="Rooms.showJoin()"><div class="room-action-icon">🔐</div><div class="room-action-title">انضم بكود</div><div class="room-action-desc">عندك كود غرفة؟</div></div>'+
  '</div>'+

  '<div style="font-size:11px;font-weight:800;color:var(--text-3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:12px">الغرف العامة</div>'+
  '<div id="public-rooms-list"><div style="text-align:center;padding:20px;color:var(--text-3);font-weight:600">جاري التحميل...</div></div>'+
  '</main>'+layout.BottomNav('rooms')+'</div></div>';
}

async function loadPublicRooms(){
  var list=U.$('public-rooms-list');if(!list||!window.db)return;
  try{
    var snap=await window.db.ref('roomsMeta').once('value');
    var rooms=snap.val()||{};
    var publicRooms=Object.keys(rooms).filter(function(k){return!rooms[k].password&&rooms[k].type!=='private'&&k!=='GENERAL';}).map(function(k){return{code:k,data:rooms[k]};}).sort(function(a,b){return(b.data.createdAt||0)-(a.data.createdAt||0);});
    if(!publicRooms.length){list.innerHTML='<div style="text-align:center;padding:40px;color:var(--text-3);font-size:13px;font-weight:600">لا غرف عامة بعد — كن أول من ينشئ غرفة</div>';return;}
    list.innerHTML='<div class="room-list">'+publicRooms.slice(0,30).map(function(r){return'<div class="room-card" onclick="Rooms.enter(\''+U.esc(r.code)+'\')"><div class="room-card-icon">🏠</div><div style="flex:1;min-width:0"><div class="room-card-name">'+U.esc(r.data.name||r.code)+'</div><div class="room-card-meta"><span class="room-tag">'+U.esc(r.code)+'</span>'+(r.data.createdBy?'<span>'+U.esc(r.data.createdBy)+'</span>':'')+'</div></div></div>';}).join('')+'</div>';
  }catch(e){list.innerHTML='<div style="text-align:center;padding:20px;color:var(--red);font-weight:600">فشل التحميل</div>';}
}

var Rooms={
  showCreate:function(){
    UI.modal({title:'غرفة جديدة',content:'<div class="field"><label>اسم الغرفة</label><input class="input" id="cr-name" placeholder="مثال: الرياضيات" maxlength="40"></div><div class="field"><label>كلمة سر (اختياري)</label><input class="input" id="cr-password" type="password" placeholder="اتركها فاضية للعامة"></div><div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px"><button class="btn btn-secondary" onclick="App.ui.closeAll()">إلغاء</button><button class="btn" id="create-room-btn" onclick="Rooms.create()">إنشاء</button></div>'});
  },
  create:async function(){
    var name=U.$('cr-name').value.trim();var password=U.$('cr-password').value.trim();
    if(!name){UI.toast('أدخل الاسم','error');return;}
    if(!window.db){UI.toast('Firebase غير متصل','error');return;}
    var btn=U.$('create-room-btn');btn.disabled=true;btn.innerHTML='<span class="spinner"></span>';
    var s=App.state.user;var code='R'+Math.random().toString(36).slice(2,7).toUpperCase();
    try{
      await window.db.ref('roomsMeta/'+code).set({name:name,password:password||null,type:password?'private':'public',createdBy:s.name,createdById:s.uid,createdAt:Date.now()});
      UI.toast('تم إنشاء: '+code,'success',5000);UI.closeAll();
      setTimeout(function(){Rooms.enter(code);},500);
    }catch(e){UI.toast('خطأ: '+e.message,'error');btn.disabled=false;btn.innerHTML='إنشاء';}
  },
  showJoin:function(){
    UI.modal({title:'انضم لغرفة',content:'<div class="field"><label>كود الغرفة</label><input class="input" id="jr-code" placeholder="مثال: RABC12" maxlength="10" style="text-align:center;font-weight:800;letter-spacing:3px;text-transform:uppercase;font-size:18px"></div><div class="field"><label>كلمة سر (لو محمية)</label><input class="input" id="jr-password" type="password" placeholder="اتركها فاضية"></div><div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px"><button class="btn btn-secondary" onclick="App.ui.closeAll()">إلغاء</button><button class="btn" id="join-room-btn" onclick="Rooms.join()">انضمام</button></div>'});
  },
  join:async function(){
    var code=U.$('jr-code').value.trim().toUpperCase();var password=U.$('jr-password').value;
    if(!code){UI.toast('أدخل الكود','error');return;}
    var btn=U.$('join-room-btn');btn.disabled=true;btn.innerHTML='<span class="spinner"></span>';
    try{
      var snap=await window.db.ref('roomsMeta/'+code).once('value');var room=snap.val();
      if(!room){UI.toast('الغرفة غير موجودة','error');btn.disabled=false;btn.innerHTML='انضمام';return;}
      if(room.password&&room.password!==password){UI.toast('كلمة السر غلط','error');btn.disabled=false;btn.innerHTML='انضمام';return;}
      UI.closeAll();Rooms.enter(code);
    }catch(e){UI.toast('خطأ: '+e.message,'error');btn.disabled=false;btn.innerHTML='انضمام';}
  },
  enter:function(code){
    if(!code)return;
    var s=App.state.user;
    if(s.uid&&window.db&&ChatState.room&&ChatState.room!==code){window.db.ref('rooms/'+ChatState.room+'/users/'+s.uid).remove().catch(function(){});}
    ChatState.room=code;UI.toast('دخلت: '+code,'success');Router.go('chat');
  }
};
window.Rooms=Rooms;

Router.register('home',HomeScreen);
Router.register('chat',ChatScreen);
Router.register('rooms',RoomsScreen);
console.log('✓ Home + Chat + Rooms');
})();

  solveMath:function(text){
    var t=text.replace(/[×✕]/g,'*').replace(/÷/g,'/').replace(/[س]/g,'x').replace(/،/g,'').replace(/\s+/g,'');
    // basic op
    var m=t.match(/(-?\d+(?:\.\d+)?)\s*([+\-*/])\s*(-?\d+(?:\.\d+)?)/);
    if(m){var a=parseFloat(m[1]),op=m[2],b=parseFloat(m[3]),r;
      if(op==='+')r=a+b;else if(op==='-')r=a-b;else if(op==='*')r=a*b;else r=b!==0?+(a/b).toFixed(4):'غير معرّف';
      var ops={'+':'جمع','-':'طرح','*':'ضرب','/':'قسمة'};
      return'🧮 **'+a+' '+m[2]+' '+b+' = '+r+'**\n\n_العملية: '+ops[op]+'_';}
    // percentage
    var pct=t.match(/(\d+(?:\.\d+)?)%(?:من|of)(\d+(?:\.\d+)?)/);
    if(pct)return'📊 **'+pct[1]+'% من '+pct[2]+' = '+(parseFloat(pct[1])*parseFloat(pct[2])/100)+'**';
    // linear eq: ax+b=c
    var eq=t.match(/(-?\d*\.?\d*)\*?x([+\-]\d+(?:\.\d+)?)=(-?\d+(?:\.\d+)?)/i);
    if(eq){
      var ea=parseFloat(eq[1]||'1')||1;var eb=parseFloat(eq[2]);var ec=parseFloat(eq[3]);
      var x=(ec-eb)/ea;
      return'📐 **حل المعادلة:**\n\n'+ea+'x '+eq[2]+' = '+ec+'\n\n**الخطوات:**\n1. ننقل '+Math.abs(eb)+' للطرف الآخر\n2. '+ea+'x = '+(ec-eb)+'\n3. x = '+(ec-eb)+' ÷ '+ea+'\n\n✅ **x = '+Math.round(x*1000)/1000+'**';}
    // pythagorean
    var pyth=t.match(/(\d+)\s*,?\s*(\d+)\s*,?\s*وتر|فيثاغورس\s+(\d+)\s+(\d+)/);
    if(pyth){var pa=parseFloat(pyth[1]||pyth[3]),pb=parseFloat(pyth[2]||pyth[4]);var pc=Math.sqrt(pa*pa+pb*pb);return'📐 **فيثاغورس:**\n\nأ='+pa+', ب='+pb+'\nج² = أ² + ب² = '+pa+'² + '+pb+'² = '+(pa*pa+pb*pb)+'\n✅ **الوتر = '+Math.round(pc*1000)/1000+'**';}
    return null;
  },
